      <div class="card pad">
        <h3 style="margin-bottom:10px">Finalização</h3>
        <label class="f">Status do atendimento
          <select id="finalizacao" ${readonly?"disabled":""}><option value="">Selecionar…</option>${FINALIZACOES.map(f=>`<option${m.finalizacao===f?" selected":""}>${f}</option>`).join("")}</select></label>
        <label class="f" style="margin-top:10px">Próxima ação
          <select id="proximaAcao" ${readonly?"disabled":""}>${Object.entries(PROX_ACOES).map(([k,val])=>`<option value="${k}"${m.proximaAcao===k?" selected":""}>${val}</option>`).join("")}</select></label>
        <label class="f" style="margin-top:10px">Agendar para<input type="date" id="proximaData" ${readonly?"disabled":""} value="${esc((m.proximaData||"").slice(0,10))}"></label>
        <div id="finalHint"></div>
        ${!readonly?`<div class="actionbar" style="margin-top:14px">
          <button class="btn" id="salvarRasc">Salvar rascunho</button>
          <button class="btn primary" id="encerrar">Encerrar atendimento</button>
        </div>`:""}
        <button class="btn" id="emailrel" style="margin-top:10px;width:100%">✉ Enviar relatório ao cliente</button>
        ${m.status==="encerrada"&&can("editar")?`<button class="btn sm" id="reabrir" style="margin-top:12px">Reabrir</button>`:""}
      </div>
      <div class="card pad">
        <h3 style="margin-bottom:10px">Contexto</h3>
        <dl class="kv">
          <dt>OS (Bling)</dt><dd class="mono">${esc(m.numeroBlingRef||"—")}</dd>
          <dt>Cliente</dt><dd><a href="#/clientes/${m.clienteId}">${esc(cliNome(m.clienteId))}</a></dd>
          <dt>Equipamento</dt><dd><a href="#/equipamentos/${m.equipamentoId}" class="mono">${esc(eq?.ns||"—")}</a></dd>
          <dt>Tipo</dt><dd>${esc(TIPOS_ATEND[m.tipoAtendimento]||"—")}</dd>
          <dt>Técnico</dt><dd>${esc(tecNome(m.tecnicoId))}</dd>
          <dt>Veículo</dt><dd>${esc(m.veiculoId?veiNome(m.veiculoId):"—")}</dd>
          <dt>Início</dt><dd>${fmtDT(m.horaInicio||m.criadaEm)}</dd>
          ${m.horaFim?`<dt>Fim</dt><dd>${fmtDT(m.horaFim)}</dd>`:""}
        </dl>
      </div>
    </div>
  </div>`;

  // peças render
  const renderPecas=()=>{
    v.querySelector("#pecasBody").innerHTML=(m.pecas||[]).map((p,ix)=>{
      const pr=byId("produtos",p.produtoId);
      return `<tr><td>${esc(pr?.descricao||"—")}<div class="small muted mono">${esc(pr?.codigo||"")}</div></td>
      <td class="tnum">${p.qtd}</td>
      <td>${p.baixa==="automatica"?'<span class="pill">automática</span>':p.aprovada?'<span class="pill good">aprovada</span>':'<span class="pill warn">aguarda aprovação</span>'}</td>
      <td>${!readonly?`${p.baixa==="aprovacao"&&!p.aprovada&&can("editar")?`<button class="btn sm" data-aprova="${ix}">Aprovar</button> `:""}<button class="btn sm danger" data-rmpeca="${ix}">×</button>`:""}</td></tr>`;
    }).join("")||'<tr><td colspan="4" class="muted">Nenhuma peça.</td></tr>';
    v.querySelectorAll("[data-rmpeca]").forEach(b=>b.onclick=()=>{m.pecas.splice(+b.dataset.rmpeca,1);persist();renderPecas();});
    v.querySelectorAll("[data-aprova]").forEach(b=>b.onclick=()=>{const p=m.pecas[+b.dataset.aprova];p.aprovada=true;const pr=byId("produtos",p.produtoId);if(pr)pr.estoque=Math.max(0,pr.estoque-p.qtd);audit("Aprovação","Peça",m.id,pr?.descricao);persist();renderPecas();toast("Baixa aprovada.");});
  };
  renderPecas();

  // fotos render
  const renderFotos=()=>{
    const groups={antes:[],durante:[],depois:[]};
    (m.fotos||[]).forEach((f,ix)=>groups[f.grupo||"durante"].push({...f,ix}));
    v.querySelector("#fotos").innerHTML=Object.entries(groups).map(([g,arr])=>arr.length?`<div class="photogroup">${g}</div>`+arr.map(f=>{
      const d=f.data||getFotoLocal(f.id);
      const cell=d?`<img src="${d}" alt="${g}">`:`<div style="width:74px;height:74px;border-radius:var(--radius-sm);border:1px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:10px;color:var(--ink-3)">foto em outro<br>dispositivo</div>`;
      return `<div style="position:relative">${cell}${!readonly?`<button class="btn sm danger" style="position:absolute;top:2px;right:2px;padding:1px 6px" data-rmfoto="${f.ix}">×</button>`:""}</div>`;
    }).join(""):"").join("")||'<span class="small muted">Sem fotos.</span>';
    v.querySelectorAll("[data-rmfoto]").forEach(b=>b.onclick=()=>{m.fotos.splice(+b.dataset.rmfoto,1);persist();renderFotos();});
  };
  renderFotos();

  const renderExtra=()=>{
    v.querySelector("#testesExtra").innerHTML=(m.testesExtra||[]).map((t,ix)=>`<label class="f" style="margin-top:10px">${esc(t.nome)}<input data-te="${ix}" ${readonly?"disabled":""} value="${esc(t.valor||"")}"></label>`).join("");
  };
  renderExtra();

  if(!readonly){
    const collect=()=>{
      m.problema=v.querySelector("#problema").value.trim();
      m.diagnostico=v.querySelector("#diagnostico").value.trim();
      m.servico=v.querySelector("#servico").value.trim();
      m.obs=v.querySelector("#obs").value.trim();
      m.testes={};v.querySelectorAll("[data-t]").forEach(i=>{if(i.value.trim())m.testes[i.dataset.t]=i.value.trim();});
      m.medicoes={};v.querySelectorAll("[data-m]").forEach(i=>{if(i.value.trim())m.medicoes[i.dataset.m]=i.value.trim();});
      (m.testesExtra||[]).forEach((t,ix)=>{const el=v.querySelector(`[data-te="${ix}"]`);if(el)t.valor=el.value.trim();});
      m.finalizacao=v.querySelector("#finalizacao").value;
      m.proximaAcao=v.querySelector("#proximaAcao").value;
      m.proximaData=v.querySelector("#proximaData").value||null;
    };
    v.querySelector("#addTeste").onclick=()=>{
      const nome=prompt("Nome do teste");if(!nome)return;
      m.testesExtra=m.testesExtra||[];m.testesExtra.push({nome:nome.trim(),valor:""});persist();renderExtra();
    };
    v.querySelector("#addPeca").onclick=()=>addPecaModal(m,renderPecas);
    v.querySelectorAll('input[type=file][data-g]').forEach(inp=>inp.onchange=e=>{
      [...e.target.files].forEach(file=>{
        compressImg(file,dataURL=>{const fid=uid("foto");saveFotoLocal(fid,dataURL);m.fotos=m.fotos||[];m.fotos.push({id:fid,grupo:inp.dataset.g,ts:nowISO()});persist();renderFotos();});
      });
    });
    v.querySelector("#salvarRasc").onclick=()=>{collect();m.status="aberta";persist();audit("Edição","Manutenção",m.id,"rascunho");toast("Rascunho salvo.");};
    v.querySelector("#encerrar").onclick=()=>{
      collect();
      if(!m.finalizacao)return toast("Selecione o status de finalização.");
      m.status="encerrada";m.horaFim=nowISO();
      // baixa automática de peças
      (m.pecas||[]).forEach(p=>{if(p.baixa==="automatica"&&!p.baixado){const pr=byId("produtos",p.produtoId);if(pr)pr.estoque=Math.max(0,pr.estoque-p.qtd);p.baixado=true;}});
      // atualiza OS
      const o=byId("ordens",m.osId);
      if(o){
        if(m.finalizacao==="Aguardando peça"){o.status="aguardando_peca";criarSolicitacaoAguardandoPeca(m);}
        else if(m.finalizacao==="Necessita retorno"||m.proximaAcao==="retorno")o.status="aguardando_retorno";
        else if(m.finalizacao==="Aguardando cliente")o.status="aguardando_retorno";
        else o.status="encerrada";
      }
      // jornada evento
      const j=byId("jornadas",m.jornadaId);if(j){j.eventos=j.eventos||[];j.eventos.push({tipo:"atend_fim",ts:nowISO(),ref:m.numeroBlingRef});}
      audit("Encerramento","Manutenção",m.id,m.finalizacao);persist();toast("Atendimento encerrado.");router();
    };
  }
  v.querySelector("#reabrir")&&(v.querySelector("#reabrir").onclick=()=>{m.status="aberta";const o=byId("ordens",m.osId);if(o)o.status="em_atendimento";audit("Reabertura","Manutenção",m.id);persist();router();});
  v.querySelector("#emailrel").onclick=()=>emailManutencao(m);
  // hint
  const fh=v.querySelector("#finalHint");
  const upd=()=>{const val=v.querySelector("#finalizacao")?.value;if(val==="Aguardando peça")fh.innerHTML='<div class="alertbox" style="margin-top:10px"><span>!</span><div>A OS ficará <b>Aguardando peça</b> e uma solicitação de peça será aberta.</div></div>';else fh.innerHTML="";};
  v.querySelector("#finalizacao")&&(v.querySelector("#finalizacao").onchange=upd,upd());
}
function addPecaModal(m,cb){
  modal({title:"Adicionar peça",body:`
    <div class="searchbar" style="margin-bottom:10px"><span class="ic">⌕</span><input id="pq" placeholder="Código, descrição, referência ou código de barras"></div>
    <div class="panel" style="max-height:240px;overflow:auto"><div class="list" id="plist"></div></div>
    <div class="row" style="margin-top:12px">
      <label class="f" style="max-width:110px">Quantidade<input id="pqtd" type="number" value="1" min="1"></label>
      <label class="f">Baixa de estoque<select id="pbaixa"><option value="automatica">Automática</option><option value="aprovacao">Mediante aprovação</option></select></label>
    </div>
    <p class="small muted" id="psel">Selecione um produto.</p>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="okpeca" disabled>Adicionar</button>`});
  let sel=null;
  const drawP=q=>{
    const list=DB.produtos.filter(ativo).filter(p=>!q||[p.codigo,p.descricao,p.referencia,p.barras].join(" ").toLowerCase().includes(q.toLowerCase()));
    $("#plist").innerHTML=list.map(p=>`<button class="item" style="width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2)" data-p="${p.id}">
      <div><div class="t">${esc(p.descricao)}</div><div class="d mono">${esc(p.codigo)} · ref ${esc(p.referencia)} · barras ${esc(p.barras)}</div></div>
      <span class="sp"></span><span class="pill ${p.estoque<=p.minimo?"crit":"good"}">estoque ${p.estoque}</span></button>`).join("")||'<div class="emptyst small">Nada encontrado.</div>';
    $("#plist").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
      sel=byId("produtos",b.dataset.p);
      $("#plist").querySelectorAll("[data-p]").forEach(x=>x.style.background="");b.style.background="var(--accent-soft)";
      $("#okpeca").disabled=false;
      $("#psel").innerHTML=`Selecionado: <b>${esc(sel.descricao)}</b> · estoque atual ${sel.estoque}`+(sel.estoque<=0?' · <span style="color:var(--crit)">sem estoque — registro permitido, gera solicitação</span>':"");
    });
  };
  drawP("");
  $("#pq").oninput=e=>drawP(e.target.value);
  $("#okpeca").onclick=()=>{
    const qtd=Math.max(1,+$("#pqtd").value||1);const baixa=$("#pbaixa").value;
    m.pecas=m.pecas||[];m.pecas.push({produtoId:sel.id,qtd,baixa,aprovada:baixa==="automatica"});
    if(baixa==="automatica"&&sel.estoque>0){/* baixa efetiva no encerramento */}
    if(sel.estoque<=0){DB.solicitacoesPeca.unshift({id:uid("sol"),criadaEm:nowISO(),produtoNome:sel.descricao,qtd,osRef:m.numeroBlingRef,equipamentoId:m.equipamentoId,motivo:"Sem estoque durante o atendimento.",status:"pendente"});toast("Peça sem estoque — solicitação aberta.");}
    audit("Uso de peça","Manutenção",m.id,sel.descricao+" x"+qtd);persist();closeModal();cb();
  };
}
function criarSolicitacaoAguardandoPeca(m){
  if(DB.solicitacoesPeca.some(s=>ativo(s)&&s.osRef===m.numeroBlingRef&&s.status==="pendente"))return;
  DB.solicitacoesPeca.unshift({id:uid("sol"),criadaEm:nowISO(),produtoNome:"(a definir — atendimento encerrado como Aguardando peça)",qtd:1,osRef:m.numeroBlingRef,equipamentoId:m.equipamentoId,motivo:"Manutenção encerrada aguardando peça.",status:"pendente"});
}

/* ============ JORNADA ============ */
ROUTES.jornada=(v,rest)=>{
  if(rest[0])return jornadaDetalhe(v,rest[0]);
  const aberta=jornadaAberta();
  if(aberta)return jornadaDetalhe(v,aberta.id);
  const encerradas=DB.jornadas.filter(j=>ativo(j)).sort((a,b)=>new Date(b.criadaEm)-new Date(a.criadaEm));
  v.innerHTML=`<div class="pagehead"><h1>Jornada</h1><p>Uma jornada cobre vários clientes no mesmo dia, sem retorno à empresa entre atendimentos. Localização por eventos, não rastreamento contínuo.</p></div>
  <div class="card pad" style="margin-bottom:16px">
    <h3 style="margin-bottom:12px">Iniciar jornada</h3>
    <div class="formgrid">
      <label class="f">Técnico<select id="tec">${DB.tecnicos.filter(ativo).map(t=>`<option value="${t.id}"${t.id===VIEWER.tecnicoId?" selected":""}>${esc(t.nome)}</option>`).join("")}</select></label>
      <label class="f">Papel<select id="papel"><option value="motorista">Motorista</option><option value="passageiro">Passageiro / técnico</option></select></label>
      <label class="f">Veículo<select id="vei">${DB.veiculos.filter(x=>ativo(x)&&x.situacao==="Ativo").map(x=>`<option value="${x.id}">${esc(x.placa)} · ${esc(x.marcaModelo)} (${km(x.kmAtual)})</option>`).join("")}</select></label>
      <label class="f">KM inicial<input id="kmi" type="number"></label>
      <label class="f">Origem<select id="origem"><option value="empresa">Empresa</option><option value="residencia">Residência (direto ao 1º cliente)</option></select></label>
      <label class="f">Foto do painel (opcional)<input id="painel" type="file" accept="image/*"></label>
    </div>
    <button class="btn primary" id="startJ" style="margin-top:14px">Iniciar jornada</button>
  </div>
  <div class="panel"><div class="ph"><h3>Jornadas anteriores</h3></div>
    <div class="list">${encerradas.filter(j=>j.status==="encerrada").slice(0,10).map(j=>`
      <a class="item" href="#/jornada/${j.id}"><div><div class="t">${fmtDate(j.criadaEm)} · ${esc(veiNome(j.veiculoId))}</div>
      <div class="d">${km((j.kmFinal||0)-(j.kmInicial||0))} · ${(j.eventos||[]).filter(e=>e.tipo==="chegada").length} visitas</div></div>
      <span class="sp"></span><span class="pill good">encerrada</span></a>`).join("")||'<div class="emptyst small">Nenhuma jornada anterior.</div>'}</div>
  </div>`;
  const veiSel=v.querySelector("#vei");
  const setKm=()=>{const vv=byId("veiculos",veiSel.value);if(vv)v.querySelector("#kmi").value=vv.kmAtual;};
  setKm();veiSel.onchange=setKm;
  v.querySelector("#startJ").onclick=()=>{
    const kmi=+v.querySelector("#kmi").value;
    if(!kmi)return toast("Informe o KM inicial.");
    VIEWER.tecnicoId=v.querySelector("#tec").value;saveViewer();
    const j={id:uid("jor"),criadaEm:nowISO(),tecnicoId:VIEWER.tecnicoId,papel:v.querySelector("#papel").value,veiculoId:veiSel.value,kmInicial:kmi,kmFinal:null,origem:v.querySelector("#origem").value,status:"aberta",
      eventos:[{tipo:"login",ts:nowISO()}]};
    const file=v.querySelector("#painel").files[0];
    const fin=()=>{DB.jornadas.unshift(j);audit("Início","Jornada",j.id);persist();location.hash="#/jornada/"+j.id;};
    if(file){compressImg(file,dataURL=>{saveFotoLocal("painel_"+j.id,dataURL);j.fotoPainelId="painel_"+j.id;fin();});}else fin();
  };
};
const EVT_LABEL={login:"Login / início da jornada",desloc_inicio:"Início de deslocamento",chegada:"Chegada ao cliente",atend_inicio:"Início do atendimento",atend_fim:"Fim do atendimento",almoco_inicio:"Início do almoço",almoco_fim:"Fim do almoço",retorno:"Retorno à empresa",encerramento:"Encerramento da jornada",pausa:"Pausa"};
function jornadaDetalhe(v,id){
  const j=byId("jornadas",id);if(!j||!ativo(j))return v.innerHTML='<div class="alertbox crit">Jornada não encontrada.</div>';
  const aberta=j.status==="aberta";
  const vei=byId("veiculos",j.veiculoId);
  const mnts=DB.manutencoes.filter(m=>ativo(m)&&m.jornadaId===id);
  const evs=(j.eventos||[]);
  const last=evs[evs.length-1]?.tipo;
  const emAlmoco=last==="almoco_inicio";
  const add=(tipo,extra)=>{j.eventos.push({tipo,ts:nowISO(),...(extra||{})});audit("Evento","Jornada",id,EVT_LABEL[tipo]);persist();router();};
  v.innerHTML=`<a class="btn ghost sm" href="#/jornada">← Jornada</a>
  <div class="pagehead between"><div><h1>Jornada · ${fmtDate(j.criadaEm)}</h1>
    <p>${esc(veiNome(j.veiculoId))} · ${esc(tecNome(j.tecnicoId))} (${esc(j.papel||"—")}) · origem ${esc(j.origem)}</p></div>
    <div>${aberta?'<span class="pill warn"><span class="dot"></span>em andamento</span>':'<span class="pill good">encerrada</span>'}</div></div>
  <div class="kpis" style="margin-bottom:18px">
    <div class="kpi"><div class="lab">KM inicial</div><div class="val tnum" style="font-size:20px">${j.kmInicial?.toLocaleString("pt-BR")||"—"}</div></div>
    <div class="kpi"><div class="lab">KM final</div><div class="val tnum" style="font-size:20px">${j.kmFinal?j.kmFinal.toLocaleString("pt-BR"):"—"}</div></div>
    <div class="kpi"><div class="lab">Percorrido</div><div class="val tnum" style="font-size:20px">${j.kmFinal?km(j.kmFinal-j.kmInicial):"—"}</div></div>
    <div class="kpi"><div class="lab">Visitas</div><div class="val tnum">${evs.filter(e=>e.tipo==="chegada").length}</div></div>
  </div>
  ${aberta?`<div class="card pad" style="margin-bottom:16px">
    <h3 style="margin-bottom:6px">Ações</h3>
    <p class="small muted" style="margin:0 0 12px">A chegada ao cliente é preferencialmente automática por evento/localização — o botão manual é contingência.</p>
    <div class="actionbar">
      <button class="btn" data-ev="desloc_inicio">Iniciar deslocamento</button>
      <button class="btn" data-ev="chegada">Registrar chegada (manual)</button>
      <button class="btn" data-ev="${emAlmoco?"almoco_fim":"almoco_inicio"}">${emAlmoco?"Fim do almoço":"Início do almoço"}</button>
      <button class="btn" data-ev="retorno">Retorno à empresa</button>
      <a class="btn primary" href="#/os">Selecionar OS / atender →</a>
    </div>
    <hr style="border:0;border-top:1px solid var(--line-2);margin:14px 0">
    <div class="row" style="align-items:flex-end">
      <label class="f" style="max-width:150px">KM final<input id="kmf" type="number" value="${vei?.kmAtual||""}"></label>
      <button class="btn primary" id="encerrarJ">Encerrar jornada</button>
    </div>
  </div>`:""}
  <div class="detailgrid two">
    <div class="panel"><div class="ph"><h3>Controle de horários</h3></div><div class="pb" style="padding:14px 16px">
      ${evs.length?`<div class="timeline">${evs.map(e=>`<div class="tl"><div class="when">${fmtTime(e.ts)}</div><div class="what">${esc(EVT_LABEL[e.tipo]||e.tipo)}${e.ref?` · <span class="mono">${esc(e.ref)}</span>`:""}</div></div>`).join("")}</div>`:'<div class="emptyst small">Sem eventos.</div>'}
      ${j.fotoPainelId&&getFotoLocal(j.fotoPainelId)?`<div style="margin-top:12px"><div class="photogroup">Painel</div><img src="${getFotoLocal(j.fotoPainelId)}" alt="Foto do painel" style="max-width:180px;border-radius:var(--radius-sm);border:1px solid var(--line)"></div>`:""}
    </div></div>
    <div class="panel"><div class="ph"><h3>Atendimentos da jornada</h3></div>
      <div class="list">${mnts.map(m=>`<a class="item" href="#/manutencoes/${m.id}"><div><div class="t">${esc(eqNome(m.equipamentoId))}</div><div class="d">${esc(cliNome(m.clienteId))} · OS ${esc(m.numeroBlingRef||"—")}</div></div><span class="sp"></span><span class="pill ${m.status==="encerrada"?"good":"warn"}">${esc(m.finalizacao||"em aberto")}</span></a>`).join("")||'<div class="emptyst small">Nenhum atendimento ainda.</div>'}</div>
    </div>
  </div>`;
  v.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>add(b.dataset.ev));
  v.querySelector("#encerrarJ")&&(v.querySelector("#encerrarJ").onclick=()=>{
    const kmf=+v.querySelector("#kmf").value;
    if(!kmf||kmf<j.kmInicial)return toast("KM final inválido.");
    if(mnts.some(m=>m.status!=="encerrada"))return toast("Há atendimento em aberto nesta jornada.");
    j.kmFinal=kmf;j.status="encerrada";j.eventos.push({tipo:"encerramento",ts:nowISO()});
    if(vei)vei.kmAtual=kmf;
    audit("Encerramento","Jornada",id,km(kmf-j.kmInicial));persist();toast("Jornada encerrada.");router();
  });
}

/* ============ VEÍCULOS ============ */
ROUTES.veiculos=(v,rest)=>{
  if(rest[0]==="novo")return veicForm(v,null);
  if(rest[0])return veicDetalhe(v,rest[0]);
  v.innerHTML=`<div class="pagehead between"><div><h1>Veículos</h1><p>Frota, preventivas por KM e/ou tempo, e alertas de vencimento.</p></div>
    ${can("criar")?`<a class="btn primary" href="#/veiculos/novo">+ Veículo</a>`:""}</div>
  <div class="stack">${DB.veiculos.filter(ativo).map(x=>{
    const prevs=DB.preventivas.filter(p=>ativo(p)&&p.veiculoId===x.id);
    const venc=prevs.filter(p=>preventivaStatus(p).venc).length;
    const prox=prevs.filter(p=>!preventivaStatus(p).venc&&preventivaStatus(p).prox).length;
    return `<a class="card pad" href="#/veiculos/${x.id}" style="text-decoration:none;color:inherit">
      <div class="between"><div><h3 class="mono">${esc(x.placa)}</h3><div class="small muted">${esc(x.marcaModelo)} · ${x.ano} · ${esc(x.cor)}</div></div>
      <div class="chips">${venc?`<span class="pill crit">${venc} vencida(s)</span>`:""}${prox?`<span class="pill warn">${prox} próxima(s)</span>`:""}${!venc&&!prox?'<span class="pill good">preventivas em dia</span>':""}</div></div>
      <dl class="kv" style="margin-top:10px"><dt>KM atual</dt><dd class="tnum">${km(x.kmAtual)}</dd><dt>Combustível</dt><dd>${esc(x.combustivel)}</dd><dt>Motorista</dt><dd>${esc(x.motorista||"—")}</dd><dt>Situação</dt><dd>${esc(x.situacao)}</dd></dl>
    </a>`;}).join("")}</div>`;
};
function veicDetalhe(v,id){
  const x=byId("veiculos",id);if(!x||!ativo(x))return v.innerHTML='<div class="alertbox crit">Veículo não encontrado.</div>';
  const prevs=DB.preventivas.filter(p=>ativo(p)&&p.veiculoId===id);
  const abast=DB.abastecimentos.filter(a=>ativo(a)&&a.veiculoId===id).sort((a,b)=>new Date(b.dataHora)-new Date(a.dataHora));
  v.innerHTML=`<div class="between" style="margin-bottom:6px"><a class="btn ghost sm" href="#/veiculos">← Veículos</a>
    <div class="actionbar">${can("editar")?`<button class="btn sm" id="edit">Editar</button><button class="btn sm" id="addpv">+ Preventiva</button><button class="btn sm danger" id="del">Excluir</button>`:""}</div></div>
  <div class="pagehead"><h1 class="mono">${esc(x.placa)}</h1><p>${esc(x.marcaModelo)} · ${x.ano} · ${esc(x.cor)} · ${esc(x.tipo)} · <span class="tnum">${km(x.kmAtual)}</span></p></div>
  <div class="detailgrid two">
    <div class="stack">
      <div class="panel"><div class="ph"><h3>Manutenção preventiva</h3></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Serviço</th><th>Regra</th><th>Última</th><th>Restante</th><th>Status</th><th></th></tr></thead><tbody>
      ${prevs.map(p=>{const s=preventivaStatus(p);return `<tr>
        <td>${esc(p.tipo)}</td>
        <td class="small">${p.regraKm?km(p.regraKm):""}${p.regraKm&&p.regraMeses?" ou ":""}${p.regraMeses?p.regraMeses+" meses":""}</td>
        <td class="small">${p.ultData?fmtDate(p.ultData):"—"}<br>${p.ultKm?km(p.ultKm):""}</td>
        <td class="small tnum">${isFinite(s.kmRest)?km(s.kmRest):""}${isFinite(s.kmRest)&&isFinite(s.diasRest)?"<br>":""}${isFinite(s.diasRest)?s.diasRest+" d":""}</td>
        <td><span class="pill ${s.cls}">${s.label}</span></td>
        <td>${can("editar")?`<button class="btn sm" data-done="${p.id}">Registrar</button>`:""}</td></tr>`;}).join("")||'<tr><td colspan="6" class="muted">Sem preventivas.</td></tr>'}
      </tbody></table></div></div>
      <div class="panel"><div class="ph"><h3>Abastecimentos</h3><a class="btn ghost sm" href="#/abastecimento">Registrar</a></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Data</th><th>Posto</th><th>Litros</th><th>Total</th><th>R$/L</th></tr></thead><tbody>
      ${abast.map(a=>`<tr><td>${fmtDate(a.dataHora)}</td><td>${esc(a.posto)}</td><td class="tnum">${a.litros}</td><td class="tnum">${money(a.valorTotal)}</td><td class="tnum">${money(a.precoLitro)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">Nenhum.</td></tr>'}
      </tbody></table></div></div>
    </div>
    <div class="card pad"><h3 style="margin-bottom:10px">Dados</h3>
      <dl class="kv">
        <dt>Combustível</dt><dd>${esc(x.combustivel)}</dd>
        <dt>Data de aquisição</dt><dd>${fmtDate(x.dataAquis)}</dd>
        <dt>Situação</dt><dd>${esc(x.situacao)}</dd>
        <dt>Motorista principal</dt><dd>${esc(x.motorista||"—")}</dd>
      </dl>
      ${x.obs?`<p class="small muted" style="margin-top:10px">${esc(x.obs)}</p>`:""}
    </div>
  </div>`;
  can("editar")&&(v.querySelector("#edit").onclick=()=>veicForm(v,x));
  can("editar")&&(v.querySelector("#addpv").onclick=()=>preventivaModal(x));
  can("editar")&&(v.querySelector("#del").onclick=()=>excluir("veiculos",id,"Veículo",()=>location.hash="#/veiculos","editar"));
  v.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{
    const p=byId("preventivas",b.dataset.done);p.ultData=nowISO();p.ultKm=x.kmAtual;audit("Registro","Preventiva",p.id,p.tipo);persist();toast("Preventiva registrada.");router();
  });
}
function preventivaModal(x){
  modal({title:"Nova preventiva · "+x.placa,body:`<div class="formgrid">
    <label class="f full">Serviço<input id="tp" placeholder="Troca de óleo, Filtros, Pneus…"></label>
    <label class="f">Regra por KM<input id="rk" type="number" placeholder="ex: 10000"></label>
    <label class="f">Regra por meses<input id="rm" type="number" placeholder="ex: 6"></label>
    <label class="f">Último KM<input id="uk" type="number" value="${x.kmAtual}"></label>
    <label class="f">Última data<input id="ud" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
  </div><p class="small muted" style="margin-top:8px">Vale o primeiro limite atingido (KM ou tempo).</p>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="ok">Adicionar</button>`});
  $("#ok").onclick=()=>{
    if(!$("#tp").value.trim())return toast("Informe o serviço.");
    DB.preventivas.push({id:uid("pv"),veiculoId:x.id,tipo:$("#tp").value.trim(),regraKm:+$("#rk").value||0,regraMeses:+$("#rm").value||0,ultKm:+$("#uk").value||x.kmAtual,ultData:$("#ud").value||nowISO()});
    audit("Criação","Preventiva",x.id);persist();closeModal();router();
  };
}
function veicForm(v,x){
  const e=x||{};
  v.innerHTML=`<a class="btn ghost sm" href="#/veiculos">← Cancelar</a><div class="pagehead"><h1>${x?"Editar veículo":"Novo veículo"}</h1></div>
  <div class="card pad"><div class="formgrid">
    <label class="f">Placa <span class="rq">*</span><input id="placa" class="mono" value="${esc(e.placa||"")}"></label>
    <label class="f">Marca / modelo<input id="marcaModelo" value="${esc(e.marcaModelo||"")}"></label>
    <label class="f">Ano<input id="ano" type="number" value="${esc(e.ano||"")}"></label>
    <label class="f">Cor<input id="cor" value="${esc(e.cor||"")}"></label>
    <label class="f">Tipo<input id="tipo" value="${esc(e.tipo||"")}"></label>
    <label class="f">Combustível<input id="combustivel" value="${esc(e.combustivel||"")}"></label>
    <label class="f">KM atual<input id="kmAtual" type="number" value="${esc(e.kmAtual||0)}"></label>
    <label class="f">Data de aquisição<input id="dataAquis" type="date" value="${esc((e.dataAquis||"").slice(0,10))}"></label>
    <label class="f">Situação<select id="situacao">${["Ativo","Em manutenção","Inativo","Vendido"].map(s=>`<option${e.situacao===s?" selected":""}>${s}</option>`).join("")}</select></label>
    <label class="f">Motorista principal<input id="motorista" value="${esc(e.motorista||"")}"></label>
    <label class="f full">Observações<textarea id="obs">${esc(e.obs||"")}</textarea></label>
  </div><div class="mf" style="border:0;padding:14px 0 0"><button class="btn" onclick="location.hash='#/veiculos'">Cancelar</button><button class="btn primary" id="save">Salvar</button></div></div>`;
  v.querySelector("#save").onclick=()=>{
    const g=id=>v.querySelector("#"+id).value.trim();
    if(!g("placa"))return toast("Placa é obrigatória.");
    const data={placa:g("placa"),marcaModelo:g("marcaModelo"),ano:+g("ano")||"",cor:g("cor"),tipo:g("tipo"),combustivel:g("combustivel"),kmAtual:+g("kmAtual")||0,dataAquis:g("dataAquis"),situacao:v.querySelector("#situacao").value,motorista:g("motorista"),obs:g("obs")};
    if(x){Object.assign(x,data);audit("Edição","Veículo",x.id);}
    else{const n={id:uid("vei"),criadoEm:nowISO(),...data};DB.veiculos.unshift(n);audit("Criação","Veículo",n.id);x=n;}
    persist();location.hash="#/veiculos/"+x.id;toast("Veículo salvo.");
  };
}

/* ============ ESTOQUE ============ */
ROUTES.estoque=(v)=>{
  let q="";
  const draw=()=>{
    const list=DB.produtos.filter(ativo).filter(p=>!q||[p.codigo,p.descricao,p.referencia,p.barras].join(" ").toLowerCase().includes(q.toLowerCase()));
    v.querySelector("#prodBody").innerHTML=list.map(p=>`<tr>
      <td><div style="font-weight:600">${esc(p.descricao)}</div><div class="small muted mono">${esc(p.codigo)} · ${esc(p.referencia)} · ${esc(p.barras)}</div></td>
      <td class="tnum">${p.estoque}</td><td class="tnum">${p.minimo}</td><td class="tnum">${money(p.custo)}</td>
      <td><span class="pill ${p.estoque<=0?"crit":p.estoque<=p.minimo?"warn":"good"}">${p.estoque<=0?"Zerado":p.estoque<=p.minimo?"Baixo":"OK"}</span></td>
      <td class="small">${esc(p.fonte)}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">Nada encontrado.</td></tr>';
  };
  v.innerHTML=`<div class="pagehead"><h1>Peças &amp; estoque</h1><p>O Bling é a fonte de produtos e estoque comercial. O app registra o uso técnico da peça e o vínculo com OS/equipamento, e trata solicitações.</p></div>
  <div class="row" style="margin-bottom:12px"><div class="searchbar"><span class="ic">⌕</span><input id="q" placeholder="Código, descrição, referência ou código de barras"></div></div>
  <div class="detailgrid two">
    <div class="panel"><div class="ph"><h3>Produtos (Bling)</h3></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Produto</th><th>Estoque</th><th>Mín.</th><th>Custo</th><th>Situação</th><th>Fonte</th></tr></thead><tbody id="prodBody"></tbody></table></div>
    </div>
    <div class="panel"><div class="ph"><h3>Solicitações de peça</h3></div>
      <div class="list">${DB.solicitacoesPeca.filter(ativo).map(s=>`
        <div class="item"><div><div class="t">${esc(s.produtoNome)} ×${s.qtd}</div>
        <div class="d">OS ${esc(s.osRef||"—")} · ${esc(s.equipamentoId?eqNome(s.equipamentoId):"—")}</div>
        <div class="small muted">${esc(s.motivo)}</div></div><span class="sp"></span>
        <span class="pill ${s.status==="pendente"?"warn":"good"}">${esc(s.status)}</span>
        ${s.status==="pendente"&&can("editar")?`<button class="btn sm" data-atende="${s.id}">Atender</button>`:""}</div>`).join("")||'<div class="emptyst small">Nenhuma solicitação.</div>'}
      </div>
    </div>
  </div>`;
  v.querySelector("#q").oninput=e=>{q=e.target.value;draw();};
  v.querySelectorAll("[data-atende]").forEach(b=>b.onclick=()=>{
    const s=byId("solicitacoesPeca",b.dataset.atende);s.status="atendida";
    const o=DB.ordens.find(x=>ativo(x)&&x.numeroBling===s.osRef);if(o&&o.status==="aguardando_peca")o.status="aguardando_retorno";
    audit("Atendimento","Solicitação de peça",s.id,s.produtoNome);persist();toast("Solicitação atendida — OS liberada para retorno.");router();
  });
  draw();
};

/* ============ ABASTECIMENTO ============ */
ROUTES.abastecimento=(v)=>{
  v.innerHTML=`<div class="pagehead"><h1>Abastecimento</h1><p>Fluxo: abastecer → escanear o QR Code do documento fiscal → conferir dados → confirmar → vincular ao veículo/jornada. Sempre editável; se o QR não ler, preenchimento manual.</p></div>
  <div class="detailgrid two">
    <div class="card pad">
      <h3 style="margin-bottom:10px">Novo registro</h3>
      <div class="row" style="margin-bottom:12px">
        <button class="btn" id="scan">⛶ Simular leitura de QR Code</button>
      </div>
      <div class="formgrid">
        <label class="f">Posto<input id="posto"></label>
        <label class="f">Data / hora<input id="dataHora" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"></label>
        <label class="f">Combustível<select id="combustivel"><option>Gasolina</option><option>Etanol</option><option>Diesel</option><option>GNV</option></select></label>
        <label class="f">Litros<input id="litros" type="number" step="any"></label>
        <label class="f">Valor total<input id="valorTotal" type="number" step="any"></label>
        <label class="f">Preço por litro<input id="precoLitro" type="number" step="any"></label>
        <label class="f full">Documento fiscal<input id="docFiscal" placeholder="Chave / número da NFC-e"></label>
        <label class="f">Veículo<select id="veiculoId">${DB.veiculos.filter(ativo).map(x=>`<option value="${x.id}">${esc(x.placa)} · ${esc(x.marcaModelo)}</option>`).join("")}</select></label>
        <label class="f">Jornada<select id="jornadaId"><option value="">— nenhuma —</option>${DB.jornadas.filter(ativo).slice(0,8).map(j=>`<option value="${j.id}">${fmtDate(j.criadaEm)} · ${esc(byId("veiculos",j.veiculoId)?.placa)}</option>`).join("")}</select></label>
      </div>
      <button class="btn primary" id="save" style="margin-top:14px">Confirmar e vincular</button>
    </div>
    <div class="panel"><div class="ph"><h3>Últimos abastecimentos</h3></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Data</th><th>Veículo</th><th>L</th><th>Total</th></tr></thead><tbody>
      ${DB.abastecimentos.filter(ativo).sort((a,b)=>new Date(b.dataHora)-new Date(a.dataHora)).map(a=>`<tr><td>${fmtDate(a.dataHora)}</td><td class="mono">${esc(byId("veiculos",a.veiculoId)?.placa||"—")}</td><td class="tnum">${a.litros}</td><td class="tnum">${money(a.valorTotal)}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">Nenhum.</td></tr>'}
      </tbody></table></div>
    </div>
  </div>`;
  const jA=jornadaAberta();if(jA)v.querySelector("#jornadaId").value=jA.id;
  v.querySelector("#scan").onclick=()=>{
    const postos=["Posto Trevo","Auto Posto Central","Posto Ipiranga BR277","Shell Rodovia"];
    const litros=+(20+Math.random()*35).toFixed(2);const preco=+(5.6+Math.random()*1).toFixed(2);
    v.querySelector("#posto").value=postos[Math.floor(Math.random()*postos.length)];
    v.querySelector("#litros").value=litros;v.querySelector("#precoLitro").value=preco;
    v.querySelector("#valorTotal").value=+(litros*preco).toFixed(2);
    v.querySelector("#docFiscal").value="NFC-e "+Math.random().toString().slice(2,13)+"…";
    toast("Dados extraídos do QR Code — confira antes de confirmar.");
  };
  v.querySelector("#litros").oninput=recalc;v.querySelector("#valorTotal").oninput=recalc;
  function recalc(){const l=+v.querySelector("#litros").value,t=+v.querySelector("#valorTotal").value;if(l&&t)v.querySelector("#precoLitro").value=(t/l).toFixed(3);}
  v.querySelector("#save").onclick=()=>{
    const g=id=>v.querySelector("#"+id).value;
    if(!g("litros")||!g("valorTotal"))return toast("Informe litros e valor total.");
    const n={id:uid("ab"),criadoEm:nowISO(),posto:g("posto"),dataHora:g("dataHora"),combustivel:g("combustivel"),litros:+g("litros"),valorTotal:+g("valorTotal"),precoLitro:+g("precoLitro")||(+g("valorTotal")/+g("litros")),docFiscal:g("docFiscal"),veiculoId:g("veiculoId"),jornadaId:g("jornadaId")||null};
    DB.abastecimentos.unshift(n);audit("Criação","Abastecimento",n.id);persist();toast("Abastecimento registrado.");router();
  };
};

/* ============ INDICADORES ============ */
ROUTES.indicadores=(v)=>{
  const i=ind();
  const porTipo={};DB.manutencoes.filter(ativo).forEach(m=>porTipo[m.tipoAtendimento]=(porTipo[m.tipoAtendimento]||0)+1);
  const maxTipo=Math.max(1,...Object.values(porTipo));
  const porMes={};DB.manutencoes.filter(ativo).forEach(m=>{const k=new Date(m.criadaEm).toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});porMes[k]=(porMes[k]||0)+1;});
  const kmTotal=DB.jornadas.filter(j=>ativo(j)&&j.kmFinal).reduce((s,j)=>s+(j.kmFinal-j.kmInicial),0);
  const custoPecas=DB.manutencoes.filter(ativo).flatMap(m=>m.pecas||[]).reduce((s,p)=>s+(byId("produtos",p.produtoId)?.custo||0)*p.qtd,0);
  const custoComb=DB.abastecimentos.filter(ativo).reduce((s,a)=>s+a.valorTotal,0);
  v.innerHTML=`<div class="pagehead"><h1>Indicadores</h1><p>Painel gerencial. Estrutura preparada para cruzar veículo → KM → abastecimento → visitas → clientes → OS → equipamentos → peças → tempo.</p></div>
  <div class="kpis" style="margin-bottom:20px">
    <div class="kpi"><div class="lab">Manutenções (mês)</div><div class="val tnum">${i.mntMes.length}</div></div>
    <div class="kpi"><div class="lab">KM rodado (total)</div><div class="val tnum" style="font-size:20px">${km(kmTotal)}</div></div>
    <div class="kpi"><div class="lab">Custo de peças</div><div class="val" style="font-size:18px">${money(custoPecas)}</div></div>
    <div class="kpi"><div class="lab">Custo combustível</div><div class="val" style="font-size:18px">${money(custoComb)}</div></div>
    <div class="kpi ${i.estCrit.length?"crit":"good"}"><div class="lab">Estoque crítico</div><div class="val tnum">${i.estCrit.length}</div></div>
    <div class="kpi ${i.prevVenc.length?"crit":"good"}"><div class="lab">Preventivas vencidas</div><div class="val tnum">${i.prevVenc.length}</div></div>
  </div>
  <div class="detailgrid two">
    <div class="card pad"><h3 style="margin-bottom:14px">Manutenções por natureza do atendimento</h3>
      ${Object.entries(porTipo).map(([k,n])=>`<div style="margin-bottom:10px"><div class="between small"><span>${esc(TIPOS_ATEND[k]||k)}</span><span class="tnum">${n}</span></div>
      <div style="height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${n/maxTipo*100}%;background:var(--accent)"></div></div></div>`).join("")||'<p class="muted small">Sem dados.</p>'}
      <p class="small muted" style="margin-top:10px">Locação, assistência técnica, garantia e cortesia contabilizados separadamente.</p>
    </div>
    <div class="stack">
      <div class="card pad"><h3 style="margin-bottom:12px">Manutenções por mês</h3>
        <div style="display:flex;gap:10px;align-items:flex-end;height:120px">
          ${Object.entries(porMes).map(([k,n])=>{const mx=Math.max(...Object.values(porMes));return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end">
          <span class="small tnum">${n}</span><div style="width:100%;background:var(--accent-deep);border-radius:4px 4px 0 0;height:${n/mx*90}px"></div><span class="small muted">${esc(k)}</span></div>`;}).join("")}
        </div>
      </div>
      <div class="card pad"><h3 style="margin-bottom:10px">OS por status</h3>
        <dl class="kv">
          <dt>Abertas</dt><dd class="tnum">${i.osAbertas.length}</dd>
          <dt>Aguardando peça</dt><dd class="tnum">${i.osPeca.length}</dd>
          <dt>Aguardando retorno</dt><dd class="tnum">${i.osRetorno.length}</dd>
          <dt>Encerradas</dt><dd class="tnum">${DB.ordens.filter(o=>ativo(o)&&o.status==="encerrada").length}</dd>
        </dl>
      </div>
      <div class="card pad"><h3 style="margin-bottom:10px">Produtividade por técnico</h3>
        <dl class="kv">${DB.tecnicos.map(t=>`<dt>${esc(t.nome)}</dt><dd class="tnum">${DB.manutencoes.filter(m=>ativo(m)&&m.tecnicoId===t.id).length} mnt.</dd>`).join("")}</dl>
      </div>
    </div>
  </div>`;
};

/* ============ RELATÓRIOS ============ */
const REL_DEFS={
  manutencoes:{nome:"Manutenções por período",filtros:["periodo","cliente","tecnico","tipo","status"]},
  os:{nome:"Ordens de Serviço",filtros:["periodo","cliente","statusOS"]},
  pecas:{nome:"Peças utilizadas e custo",filtros:["periodo","cliente"]},
  jornadas:{nome:"Jornadas, KM e tempo",filtros:["periodo","tecnico","veiculo"]},
  abastecimentos:{nome:"Abastecimentos",filtros:["periodo","veiculo"]},
  preventivas:{nome:"Preventivas de veículos",filtros:["veiculo"]},
  prontuario:{nome:"Prontuário do equipamento (laudo)",filtros:["equipamento","periodo"]},
  cliente:{nome:"Histórico do cliente",filtros:["cliente","periodo"]}
};
ROUTES.relatorios=(v)=>{
  const hoje=new Date();
  const st={
    tipo:"manutencoes",
    de:new Date(hoje.getFullYear(),0,1).toISOString().slice(0,10),
    ate:hoje.toISOString().slice(0,10),
    cliente:"",tecnico:"",tipoAtend:"",fin:"",statusOS:"",veiculo:"",equip:""
  };
  let ultimo=null;

  const per=d=>{if(!d)return false;const x=String(d).slice(0,10);return x>=st.de&&x<=st.ate;};
  const usaPeriodo=()=>REL_DEFS[st.tipo].filtros.includes("periodo");
  const custoMnt=m=>(m.pecas||[]).reduce((s,p)=>s+(byId("produtos",p.produtoId)?.custo||0)*p.qtd,0);
  const dur=j=>{const e=j.eventos||[];const a=e[0]?.ts,b=(e.find(x=>x.tipo==="encerramento")||e[e.length-1])?.ts;if(!a||!b)return"—";const min=Math.round((new Date(b)-new Date(a))/60000);return(min/60|0)+"h"+String(min%60).padStart(2,"0");};

  const BUILDERS={
    manutencoes(){
      let r=DB.manutencoes.filter(ativo).filter(m=>per(m.criadaEm));
      if(st.cliente)r=r.filter(m=>m.clienteId===st.cliente);
      if(st.tecnico)r=r.filter(m=>m.tecnicoId===st.tecnico);
      if(st.tipoAtend)r=r.filter(m=>m.tipoAtendimento===st.tipoAtend);
      if(st.fin)r=r.filter(m=>m.finalizacao===st.fin);
      r.sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      const pt={};r.forEach(m=>pt[m.tipoAtendimento]=(pt[m.tipoAtendimento]||0)+1);
      return{titulo:"Relatório de manutenções",
        colunas:["Data","OS","Cliente","NS","Tipo","Técnico","Finalização","Qtd peças","Custo peças"],
        linhas:r.map(m=>[fmtDate(m.criadaEm),m.numeroBlingRef||"—",cliNome(m.clienteId),byId("equipamentos",m.equipamentoId)?.ns||"—",TIPOS_ATEND[m.tipoAtendimento]||"—",tecNome(m.tecnicoId),m.finalizacao||"Em aberto",(m.pecas||[]).reduce((s,p)=>s+p.qtd,0),money(custoMnt(m))]),
        totais:[{l:"Manutenções",n:r.length},{l:"Encerradas",n:r.filter(m=>m.status==="encerrada").length},{l:"Locação / Assistência",n:(pt.locacao||0)+" / "+(pt.assistencia||0)},{l:"Custo de peças",n:money(r.reduce((s,m)=>s+custoMnt(m),0))}]};
    },
    os(){
      let r=DB.ordens.filter(ativo).filter(o=>per(o.criadaEm));
      if(st.cliente)r=r.filter(o=>o.clienteId===st.cliente);
      if(st.statusOS)r=r.filter(o=>o.status===st.statusOS);
      r.sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      const c=s=>r.filter(o=>o.status===s).length;
      return{titulo:"Relatório de Ordens de Serviço",
        colunas:["Número (Bling)","Aberta em","Cliente","Equipamento","Tipo","Situação cobrança","Status"],
        linhas:r.map(o=>[o.numeroBling,fmtDate(o.criadaEm),cliNome(o.clienteId),o.equipamentoId?eqNome(o.equipamentoId):"—",TIPOS_ATEND[o.tipoAtendimento]||"—",o.situacaoCobranca||"—",({aberta:"Aberta",em_atendimento:"Em atendimento",aguardando_peca:"Aguardando peça",aguardando_retorno:"Aguardando retorno",encerrada:"Encerrada"})[o.status]]),
        totais:[{l:"Total",n:r.length},{l:"Abertas",n:c("aberta")},{l:"Aguardando peça",n:c("aguardando_peca")},{l:"Encerradas",n:c("encerrada")}]};
    },
    pecas(){
      let ms=DB.manutencoes.filter(ativo).filter(m=>per(m.criadaEm));
      if(st.cliente)ms=ms.filter(m=>m.clienteId===st.cliente);
      const uso={};
      ms.forEach(m=>(m.pecas||[]).forEach(p=>{uso[p.produtoId]=uso[p.produtoId]||{qtd:0,ocor:0};uso[p.produtoId].qtd+=p.qtd;uso[p.produtoId].ocor++;}));
      const ents=Object.entries(uso).sort((a,b)=>b[1].qtd-a[1].qtd);
      let totQtd=0,totCusto=0;
      const linhas=ents.map(([pid,u])=>{const pr=byId("produtos",pid);const ct=(pr?.custo||0)*u.qtd;totQtd+=u.qtd;totCusto+=ct;return[pr?.descricao||"—",pr?.codigo||"—",u.qtd,u.ocor,money(pr?.custo||0),money(ct)];});
      return{titulo:"Relatório de peças utilizadas",
        colunas:["Produto","Código","Qtd total","Nº manutenções","Custo unitário","Custo total"],
        linhas,totais:[{l:"Itens distintos",n:ents.length},{l:"Peças (qtd)",n:totQtd},{l:"Custo total",n:money(totCusto)}]};
    },
    jornadas(){
      let r=DB.jornadas.filter(ativo).filter(j=>per(j.criadaEm));
      if(st.tecnico)r=r.filter(j=>j.tecnicoId===st.tecnico);
      if(st.veiculo)r=r.filter(j=>j.veiculoId===st.veiculo);
      r.sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      let totKm=0,totVis=0;
      const linhas=r.map(j=>{const perc=j.kmFinal?j.kmFinal-j.kmInicial:0;const vis=(j.eventos||[]).filter(e=>e.tipo==="chegada").length;totKm+=perc;totVis+=vis;
        return[fmtDate(j.criadaEm),tecNome(j.tecnicoId),byId("veiculos",j.veiculoId)?.placa||"—",j.kmInicial?.toLocaleString("pt-BR")||"—",j.kmFinal?j.kmFinal.toLocaleString("pt-BR"):"—",perc?km(perc):"—",vis,dur(j)];});
      return{titulo:"Relatório de jornadas",
        colunas:["Data","Técnico","Veículo","KM inicial","KM final","Percorrido","Visitas","Duração"],
        linhas,totais:[{l:"Jornadas",n:r.length},{l:"KM percorrido",n:km(totKm)},{l:"Visitas",n:totVis},{l:"Encerradas",n:r.filter(j=>j.status==="encerrada").length}]};
    },
    abastecimentos(){
      let r=DB.abastecimentos.filter(ativo).filter(a=>per(a.dataHora||a.criadoEm));
      if(st.veiculo)r=r.filter(a=>a.veiculoId===st.veiculo);
      r.sort((a,b)=>new Date(a.dataHora)-new Date(b.dataHora));
      let totL=0,totV=0;
      const linhas=r.map(a=>{totL+=a.litros;totV+=a.valorTotal;return[fmtDate(a.dataHora),byId("veiculos",a.veiculoId)?.placa||"—",a.posto||"—",a.combustivel||"—",a.litros,money(a.valorTotal),money(a.precoLitro),a.docFiscal||"—"];});
      return{titulo:"Relatório de abastecimentos",
        colunas:["Data","Veículo","Posto","Combustível","Litros","Valor total","R$/L","Documento fiscal"],
        linhas,totais:[{l:"Registros",n:r.length},{l:"Litros",n:totL.toFixed(1)},{l:"Valor total",n:money(totV)},{l:"Preço médio",n:money(totL?totV/totL:0)}]};
    },
    preventivas(){
      let r=DB.preventivas.filter(ativo);
      if(st.veiculo)r=r.filter(p=>p.veiculoId===st.veiculo);
      const linhas=r.map(p=>{const s=preventivaStatus(p);const regra=[p.regraKm?km(p.regraKm):"",p.regraMeses?p.regraMeses+" meses":""].filter(Boolean).join(" ou ");
        return[byId("veiculos",p.veiculoId)?.placa||"—",p.tipo,regra,p.ultData?fmtDate(p.ultData):"—",[isFinite(s.kmRest)?km(s.kmRest):"",isFinite(s.diasRest)?s.diasRest+" d":""].filter(Boolean).join(" / "),s.label];});
      return{titulo:"Relatório de preventivas de veículos",
        colunas:["Veículo","Serviço","Regra","Última execução","Restante","Status"],
        linhas,totais:[{l:"Itens",n:r.length},{l:"Vencidas",n:r.filter(p=>preventivaStatus(p).venc).length},{l:"Próximas",n:r.filter(p=>{const s=preventivaStatus(p);return!s.venc&&s.prox;}).length}]};
    },
    prontuario(){
      const e=byId("equipamentos",st.equip);
      if(!e)return{erro:"Selecione um equipamento para gerar o laudo."};
      let h=DB.manutencoes.filter(ativo).filter(m=>m.equipamentoId===e.id&&per(m.criadaEm)).sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      const linhas=h.map(m=>{const testes=Object.entries(m.testes||{}).map(([k,val])=>(DB.camposTecnicos.find(c=>c.id===k)?.nome||k)+": "+val).join("; ");
        return[fmtDate(m.criadaEm),m.numeroBlingRef||"—",cliNome(m.clienteId),m.servico||m.problema||"—",testes||"—",(m.pecas||[]).map(p=>(byId("produtos",p.produtoId)?.descricao||"?")+" x"+p.qtd).join("; ")||"—",m.finalizacao||"—"];});
      return{titulo:"Prontuário / laudo técnico do equipamento",
        subtitulo:`NS ${e.ns} · ${e.modelo} · ${e.fabricante} · cliente atual ${cliNome(e.clienteId)} · status ${e.status}`,
        colunas:["Data","OS","Cliente","Serviço realizado","Testes","Peças","Finalização"],
        linhas,assinar:true,
        totais:[{l:"Manutenções",n:h.length},{l:"1ª no período",n:h[0]?fmtDate(h[0].criadaEm):"—"},{l:"Última",n:h.length?fmtDate(h[h.length-1].criadaEm):"—"},{l:"Peças trocadas",n:h.reduce((s,m)=>s+(m.pecas||[]).reduce((x,p)=>x+p.qtd,0),0)}]};
    },
    cliente(){
      const c=byId("clientes",st.cliente);
      if(!c)return{erro:"Selecione um cliente."};
      let h=DB.manutencoes.filter(ativo).filter(m=>m.clienteId===c.id&&per(m.criadaEm)).sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      const eqs=DB.equipamentos.filter(e=>ativo(e)&&e.clienteId===c.id);
      return{titulo:"Histórico do cliente",
        subtitulo:`${c.razao} · ${c.doc} · ${RELACAO[c.relacao]||"—"} · ${eqs.length} equipamento(s)`,
        colunas:["Data","NS","OS","Tipo","Serviço","Finalização"],
        linhas:h.map(m=>[fmtDate(m.criadaEm),byId("equipamentos",m.equipamentoId)?.ns||"—",m.numeroBlingRef||"—",TIPOS_ATEND[m.tipoAtendimento]||"—",m.servico||m.problema||"—",m.finalizacao||"—"]),
        assinar:false,
        totais:[{l:"Manutenções",n:h.length},{l:"Equipamentos",n:eqs.length},{l:"OS no período",n:new Set(h.map(m=>m.numeroBlingRef)).size}]};
    }
  };

  function filtrosTxt(){
    const p=[];
    if(usaPeriodo())p.push("Período "+fmtDate(st.de)+" a "+fmtDate(st.ate));
    if(st.cliente)p.push("Cliente: "+cliNome(st.cliente));
    if(st.tecnico)p.push("Técnico: "+tecNome(st.tecnico));
    if(st.tipoAtend)p.push("Tipo: "+TIPOS_ATEND[st.tipoAtend]);
    if(st.fin)p.push("Finalização: "+st.fin);
    if(st.veiculo)p.push("Veículo: "+(byId("veiculos",st.veiculo)?.placa||""));
    return p.join(" · ")||"Sem filtros adicionais";
  }
  function csvText(r){
    return String.fromCharCode(0xFEFF)+[r.colunas,...r.linhas].map(row=>row.map(cell=>{
      const s=String(cell).replace(/"/g,'""');return /[";\n\r]/.test(s)?`"${s}"`:s;
    }).join(";")).join("\r\n");
  }
  function selField(id,lab,opts,val){
    return `<label class="f">${lab}<select id="${id}">${opts.map(([k,t])=>`<option value="${esc(k)}"${String(val)===String(k)?" selected":""}>${esc(t)}</option>`).join("")}</select></label>`;
  }
  function filtroHTML(){
    const f=REL_DEFS[st.tipo].filtros;const parts=[];
    if(f.includes("periodo"))parts.push(`<label class="f">De<input type="date" id="fde" value="${st.de}"></label>`,`<label class="f">Até<input type="date" id="fate" value="${st.ate}"></label>`);
    if(f.includes("cliente"))parts.push(selField("fcli","Cliente",[["","Todos"],...DB.clientes.filter(ativo).map(c=>[c.id,c.fantasia||c.razao])],st.cliente));
    if(f.includes("tecnico"))parts.push(selField("ftec","Técnico",[["","Todos"],...DB.tecnicos.filter(ativo).map(t=>[t.id,t.nome])],st.tecnico));
    if(f.includes("tipo"))parts.push(selField("ftip","Tipo de atendimento",[["","Todos"],...Object.entries(TIPOS_ATEND)],st.tipoAtend));
    if(f.includes("status"))parts.push(selField("ffin","Finalização",[["","Todas"],...FINALIZACOES.map(x=>[x,x])],st.fin));
    if(f.includes("statusOS"))parts.push(selField("fsos","Status da OS",[["","Todos"],["aberta","Aberta"],["em_atendimento","Em atendimento"],["aguardando_peca","Aguardando peça"],["aguardando_retorno","Aguardando retorno"],["encerrada","Encerrada"]],st.statusOS));
    if(f.includes("veiculo"))parts.push(selField("fvei","Veículo",[["","Todos"],...DB.veiculos.filter(ativo).map(x=>[x.id,x.placa+" · "+x.marcaModelo])],st.veiculo));
    if(f.includes("equipamento"))parts.push(selField("feq","Equipamento / NS",[["","Selecione…"],...DB.equipamentos.filter(ativo).map(e=>[e.id,e.ns+" · "+e.modelo])],st.equip));
    return parts.join("");
  }
  function readFilters(){
    const g=id=>v.querySelector("#"+id);
    if(g("fde"))st.de=g("fde").value;
    if(g("fate"))st.ate=g("fate").value;
    if(g("fcli"))st.cliente=g("fcli").value;
    if(g("ftec"))st.tecnico=g("ftec").value;
    if(g("ftip"))st.tipoAtend=g("ftip").value;
    if(g("ffin"))st.fin=g("ffin").value;
    if(g("fsos"))st.statusOS=g("fsos").value;
    if(g("fvei"))st.veiculo=g("fvei").value;
    if(g("feq"))st.equip=g("feq").value;
  }
  function docHTML(r){
    return `<div class="repdoc">
      <div class="rephead">
        <div><div class="org">GeraCampo</div><div class="small muted">Assistência técnica &amp; manutenção de geradores de cloro</div></div>
        <div class="meta">Emitido em ${fmtDT(nowISO())}<br>Perfil: ${esc(perfilNome())}${usaPeriodo()?"<br>Período: "+fmtDate(st.de)+" a "+fmtDate(st.ate):""}</div>
      </div>
      <div class="repttl">${esc(r.titulo)}</div>
      <div class="repsub">${esc(r.subtitulo||filtrosTxt())}</div>
      <div class="reptotals">${r.totais.map(t=>`<div class="reptot"><div class="l">${esc(t.l)}</div><div class="n">${esc(t.n)}</div></div>`).join("")}</div>
      <div class="tblwrap"><table class="tbl"><thead><tr>${r.colunas.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${r.linhas.length?r.linhas.map(ln=>`<tr>${ln.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${r.colunas.length}" class="muted">Nenhum registro para o filtro selecionado.</td></tr>`}</tbody></table></div>
      ${r.assinar?`<div class="repsign"><div>Técnico responsável</div><div>Responsável pelo cliente</div></div>`:""}
      <div class="repfoot"><span>${r.linhas.length} registro(s) · fonte: base local GeraCampo</span><span>Documento gerado automaticamente pelo GeraCampo</span></div>
    </div>`;
  }
  function gerar(){
    readFilters();
    const r=BUILDERS[st.tipo]();
    const out=v.querySelector("#repout");
    if(r.erro){ultimo=null;out.innerHTML=`<div class="alertbox"><span>!</span><div>${esc(r.erro)}</div></div>`;return;}
    ultimo=r;
    out.innerHTML=docHTML(r);
    audit("Relatório",REL_DEFS[st.tipo].nome,"",filtrosTxt());
  }

  v.innerHTML=`<div class="pagehead"><h1>Relatórios</h1><p>Documentos filtráveis para impressão, PDF ou exportação. Mesma base do restante do app — sem retrabalho de digitação.</p></div>
  <div class="card pad noprint" style="margin-bottom:18px">
    <div class="formgrid">
      <label class="f">Relatório
        <select id="rtipo">${Object.entries(REL_DEFS).map(([k,d])=>`<option value="${k}"${k===st.tipo?" selected":""}>${d.nome}</option>`).join("")}</select></label>
      <div id="rfiltros" style="display:contents"></div>
    </div>
    <div class="actionbar" style="margin-top:14px">
      <button class="btn primary" id="rgerar">Gerar relatório</button>
      <button class="btn" id="rprint">⎙ Imprimir / PDF</button>
      <button class="btn" id="rcsv">⇩ Exportar CSV</button>
    </div>
    <p class="small muted" style="margin:10px 0 0">Dica: em <b>Imprimir</b>, escolha “Salvar como PDF”. No app publicado, o CSV é copiado para a área de transferência (cole no Excel/Sheets).</p>
  </div>
  <div id="repout"></div>`;

  const drawFiltros=()=>{v.querySelector("#rfiltros").innerHTML=filtroHTML();};
  drawFiltros();
  v.querySelector("#rtipo").onchange=e=>{readFilters();st.tipo=e.target.value;drawFiltros();v.querySelector("#repout").innerHTML="";ultimo=null;};
  v.querySelector("#rgerar").onclick=gerar;
  v.querySelector("#rprint").onclick=()=>{if(!ultimo)gerar();setTimeout(()=>window.print(),80);};
  v.querySelector("#rcsv").onclick=async()=>{
    if(!ultimo)gerar();
    if(!ultimo)return;
    const txt=csvText(ultimo);
    const fname=st.tipo+"_"+st.ate+".csv";
    // 1) capacidade de download do artefato publicado
    try{
      const downloads=window.claude&&claude.use?await claude.use("downloads"):null;
      if(downloads){await downloads.save({filename:fname,data:txt});toast("CSV salvo.");return;}
    }catch(e){if(e&&e.code==="declined")return;}
    // 2) download direto (arquivo local / navegador)
    let baixou=false;
    try{
      const blob=new Blob([txt],{type:"text/csv;charset=utf-8"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;
      document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href);},0);baixou=true;
    }catch(e){}
    // 3) sempre disponibiliza para copiar
    if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});
    modal({title:"Exportar CSV",wide:true,body:`
      <p class="small muted">Arquivo <b>${esc(fname)}</b>. ${baixou?"Se o download não aparecer, ":""}copie o conteúdo abaixo e cole no Excel ou Google Sheets.</p>
      <textarea style="min-height:220px;font-family:var(--mono);font-size:12px" readonly id="csvta">${esc(txt)}</textarea>`,
      footer:`<button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" id="csvcopy">Copiar tudo</button>`});
    $("#csvta").select();
    $("#csvcopy").onclick=()=>{$("#csvta").select();try{document.execCommand("copy");}catch(e){}navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{});toast("CSV copiado.");};
  };
  gerar();
};

/* ============ FLUXO MACRO ============ */
ROUTES.fluxo=(v)=>{
  const steps=[
    "Cliente / produto / OS no Bling",
    "OS Bling → Cliente → Equipamento/NS → Classificação do atendimento",
    "Jornada → Veículo → KM → Deslocamento → Chegada",
    "Atendimento → Diagnóstico → Serviço → Testes → Medições → Peças → Fotos",
    "Finalização → Status → Retorno / Peça / Preventiva",
    "Histórico do equipamento + Histórico do cliente + Indicadores gerenciais"
  ];
  v.innerHTML=`<div class="pagehead"><h1>Fluxo macro</h1><p>O caminho de ponta a ponta. Cada etapa alimenta a próxima; o histórico e os indicadores são consequência, não retrabalho.</p></div>
  <div class="card pad" style="max-width:640px">
    <div class="flowdiag">
      ${steps.map((s,ix)=>`<div class="step">${esc(s)}</div>${ix<steps.length-1?'<div class="arr">↓</div>':""}`).join("")}
    </div>
  </div>
  <div class="card pad" style="margin-top:16px">
    <h3 style="margin-bottom:10px">Decisões que a estrutura garante</h3>
    <ul class="small" style="line-height:1.9;margin:0;padding-left:18px">
      <li>Não duplicar OS do Bling nem histórico de manutenção.</li>
      <li>NS é único e permanente; equipamento muda de cliente sem perder histórico.</li>
      <li>Equipamento substituído mantém o NS antigo intacto e relacionado ao novo.</li>
      <li>Cliente pode ter, ao mesmo tempo, equipamentos locados e próprios.</li>
      <li>Natureza do atendimento e situação da cobrança são campos distintos.</li>
      <li>Exclusão só por administrador e com auditoria (soft delete).</li>
      <li>Técnico não repete dados permanentes do equipamento a cada visita.</li>
      <li>Campos técnicos extensíveis; chegada ao cliente pode ser automática.</li>
      <li>Jornada com vários clientes por dia; dois técnicos podem dividir o veículo.</li>
      <li>QR Code de abastecimento com fallback manual; arquitetura aberta a telemetria (Arduino/ESP32).</li>
    </ul>
  </div>`;
};

function tecnicoModal(t){
  modal({title:t?"Editar técnico":"Novo técnico",body:`<div class="stack">
    <label class="f">Nome <span class="rq">*</span><input id="tn" value="${esc(t?.nome||"")}"></label>
    <label class="f">Perfil de acesso<select id="tp">${Object.entries(PERFIS).map(([k,x])=>`<option value="${k}"${t&&t.perfil===k?" selected":""}>${x.nome}</option>`).join("")}</select></label>
  </div>`,footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="oktec">Salvar</button>`});
  $("#oktec").onclick=()=>{
    const nome=$("#tn").value.trim();if(!nome)return toast("Informe o nome.");
    const perfil=$("#tp").value;
    if(t){t.nome=nome;t.perfil=perfil;audit("Edição","Técnico",t.id,nome);}
    else{const n={id:uid("tec"),nome,perfil};DB.tecnicos.push(n);audit("Criação","Técnico",n.id,nome);}
    persist();closeModal();toast("Técnico salvo.");router();
  };
}

/* ============ CONFIGURAÇÕES ============ */
ROUTES.config=(v)=>{
  v.innerHTML=`<div class="pagehead"><h1>Configurações</h1><p>Campos técnicos e listas do sistema. Adicionar campo não altera a estrutura do app — o cadastro do equipamento e o registro de manutenção passam a exibi-lo.</p></div>
  <div class="panel" style="margin-bottom:16px"><div class="ph"><h3>Campos técnicos do equipamento</h3>${can("editar")?`<button class="btn sm" id="addCT">+ Campo</button>`:""}</div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Nome</th><th>Tipo</th><th>Obrigatório</th><th></th></tr></thead><tbody>
    ${DB.camposTecnicos.filter(ativo).map(c=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.tipo)}</td><td>${c.obrig?'<span class="pill accent">sim</span>':"não"}</td>
    <td>${can("editar")?`<button class="btn sm danger" data-rmct="${c.id}">Remover</button>`:""}</td></tr>`).join("")}
    </tbody></table></div>
  </div>
  <div class="panel" style="margin-bottom:16px"><div class="ph"><h3>Técnicos</h3>${can("editar")?`<button class="btn sm" id="addTec">+ Técnico</button>`:""}</div>
    <div class="list">${DB.tecnicos.filter(ativo).map(t=>`<div class="item"><span class="avatar">${esc((t.nome[0]||"?").toUpperCase())}</span>
      <div><div class="t">${esc(t.nome)}</div><div class="d">${esc(PERFIS[t.perfil]?.nome||t.perfil)}</div></div><span class="sp"></span>
      ${can("editar")?`<button class="btn sm" data-edtec="${t.id}">Editar</button><button class="btn sm danger" data-rmtec="${t.id}">Excluir</button>`:""}</div>`).join("")||'<div class="emptyst small">Nenhum técnico.</div>'}</div>
  </div>
  <div class="detailgrid two">
    <div class="card pad"><h3 style="margin-bottom:8px">Técnico ativo neste aparelho</h3>
      <label class="f">Usado ao iniciar jornada
        <select id="tecAtual">${DB.tecnicos.filter(ativo).map(t=>`<option value="${t.id}"${t.id===VIEWER.tecnicoId?" selected":""}>${esc(t.nome)}</option>`).join("")}</select></label>
      <p class="small muted" style="margin-top:8px">Escolha local — não sincroniza.</p>
    </div>
    <div class="card pad"><h3 style="margin-bottom:8px">Base de dados</h3>
      <p class="small" id="syncinfo" style="margin:0 0 6px"></p>
      <p class="small muted">Base de teste com registros fictícios (NS TESTE-001/002/003). Perfil e técnico ativo são escolhidos por dispositivo e não sincronizam.</p>
      <div class="actionbar" style="margin-top:12px">
        <button class="btn sm" id="export">Exportar JSON</button>
        <button class="btn sm danger" id="reset">Restaurar base de teste</button>
      </div>
    </div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="ph"><h3>Conexão com Supabase (opcional)</h3><span class="small muted" id="supastatus"></span></div>
    <div class="pb" style="padding:16px">
      <p class="small muted" style="margin:0 0 12px">Liga o app a um projeto Supabase para os dados serem compartilhados em tempo real entre todos que abrem o link — em qualquer host (GitHub Pages, etc.), sem login. As chaves ficam só neste navegador; não vão para o GitHub. A chave <b>publishable / anon</b> é pública por natureza — use apenas para testes fechados.</p>
      <div class="formgrid">
        <label class="f full">URL do projeto<input id="supaurl" placeholder="https://xxxxxxxx.supabase.co"></label>
        <label class="f full">Chave publishable (ou anon)<input id="supakey" placeholder="sb_publishable_...  ou  eyJhbGciOi..."></label>
      </div>
      <div class="actionbar" style="margin-top:12px">
        <button class="btn primary" id="supaconnect">Conectar e recarregar</button>
        <button class="btn danger" id="supadisc">Desconectar</button>
      </div>
      <p class="small muted" style="margin:12px 0 0">SQL para criar a tabela (rode uma vez no <i>SQL Editor</i> do Supabase):</p>
      <pre style="background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;font-size:11px;overflow-x:auto;white-space:pre">create table geracampo_estado (
  col text primary key,
  items jsonb not null default '[]',
  updated_at timestamptz default now(),
  updated_by text
);
alter table geracampo_estado enable row level security;
create policy "acesso de teste" on geracampo_estado
  for all using (true) with check (true);
grant all on table geracampo_estado to anon, authenticated;
alter publication supabase_realtime add table geracampo_estado;</pre>
    </div>
  </div>`;
  const si=v.querySelector("#syncinfo");
  si.innerHTML=backendAtivo()==="supabase"?`<b style="color:var(--good)">Supabase conectado.</b> Dados compartilhados em tempo real${SYNC.ts?" · "+fmtTime(SYNC.ts):""}. As fotos ficam no aparelho de quem as tira.`
    :cloud?`<b style="color:var(--good)">Base compartilhada (claude.ai) ativa.</b> ${SYNC.ts?"última sincronização "+fmtTime(SYNC.ts):""}`
    :LOCALONLY?"Arquivo local — dados só neste navegador."
    :SYNC.mode==="conectando"?"Conectando…"
    :"Sem base compartilhada — dados só neste navegador. Configure o Supabase abaixo para compartilhar.";
  const cfg=getSupaCfg();
  if(cfg){v.querySelector("#supaurl").value=cfg.url||"";v.querySelector("#supakey").value=cfg.key||"";}
  v.querySelector("#supastatus").textContent=supa?"conectado":cfg?"configurado":"não configurado";
  v.querySelector("#supaconnect").onclick=()=>{
    let url=v.querySelector("#supaurl").value.trim();
    const key=v.querySelector("#supakey").value.trim();
    const mm=url.match(/https:\/\/[a-z0-9-]+\.supabase\.co/i);
    if(mm)url=mm[0];else return toast("URL inválida — use https://xxxx.supabase.co (sem /rest/v1).");
    if(key.length<20)return toast("Cole a chave completa (sb_publishable_... ou eyJ...).");
    setSupaCfg({url,key});toast("Conectando ao Supabase…");setTimeout(()=>location.reload(),400);
  };
  v.querySelector("#supadisc").onclick=()=>{if(confirm("Desconectar do Supabase? O app volta ao modo local neste dispositivo (os dados permanecem no Supabase)."))
    {setSupaCfg(null);setTimeout(()=>location.reload(),200);}};
  v.querySelector("#tecAtual").onchange=e=>{VIEWER.tecnicoId=e.target.value;saveViewer();toast("Técnico ativo (neste dispositivo) alterado.");};
  v.querySelector("#addCT")&&(v.querySelector("#addCT").onclick=()=>{
    modal({title:"Novo campo técnico",body:`<div class="stack">
      <label class="f">Nome<input id="cn"></label>
      <label class="f">Tipo<select id="ct"><option value="texto">Texto</option><option value="numero">Número</option></select></label>
      <label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="co" style="width:auto"> Obrigatório</label>
    </div>`,footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="ok">Adicionar</button>`});
    $("#ok").onclick=()=>{if(!$("#cn").value.trim())return toast("Informe o nome.");DB.camposTecnicos.push({id:uid("ct"),nome:$("#cn").value.trim(),tipo:$("#ct").value,obrig:$("#co").checked});audit("Criação","Campo técnico","");persist();closeModal();router();};
  });
  v.querySelectorAll("[data-rmct]").forEach(b=>b.onclick=()=>{const c=byId("camposTecnicos",b.dataset.rmct);c.excluido={ts:nowISO(),usuario:perfilNome(),motivo:"removido em configurações"};audit("Exclusão","Campo técnico",c.id);persist();router();});
  v.querySelector("#addTec")&&(v.querySelector("#addTec").onclick=()=>tecnicoModal(null));
  v.querySelectorAll("[data-edtec]").forEach(b=>b.onclick=()=>tecnicoModal(byId("tecnicos",b.dataset.edtec)));
  v.querySelectorAll("[data-rmtec]").forEach(b=>b.onclick=()=>{
    if(DB.tecnicos.filter(ativo).length<=1)return toast("Deixe ao menos um técnico ativo.");
    excluir("tecnicos",b.dataset.rmtec,"Técnico",()=>{
      if(VIEWER.tecnicoId===b.dataset.rmtec){const t=DB.tecnicos.find(ativo);if(t){VIEWER.tecnicoId=t.id;saveViewer();}}
      router();
    },"editar");
  });
  v.querySelector("#export").onclick=()=>{toast("JSON no console.");console.log(JSON.stringify(DB,null,2));};
  v.querySelector("#reset").onclick=()=>{if(confirm(backendAtivo()?"Restaurar a base de teste? Isso substitui os dados de TODOS que usam o link.":"Restaurar a base de teste? Os dados atuais serão perdidos."))
    {DB=seed();normalizeDB();audit("Restauração","Base de teste","");persist();toast("Base restaurada.");location.hash="#/painel";router();}};
};

/* ============ AUDITORIA ============ */
ROUTES.auditoria=(v)=>{
  const excl=[];["clientes","equipamentos","veiculos","tecnicos","produtos","solicitacoesPeca","camposTecnicos"].forEach(a=>DB[a].filter(x=>x.excluido).forEach(x=>excl.push({a,x})));
  v.innerHTML=`<div class="pagehead"><h1>Auditoria</h1><p>Toda exclusão administrativa registra usuário, data/hora e motivo. Preferência por exclusão lógica em vez de apagar históricos.</p></div>
  <div class="detailgrid two">
    <div class="panel"><div class="ph"><h3>Trilha de auditoria</h3><span class="small muted">${DB.auditoria.length} evento(s)</span></div>
      <div class="tblwrap" style="max-height:520px;overflow:auto"><table class="tbl"><thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Entidade</th><th>Detalhe</th></tr></thead><tbody>
      ${DB.auditoria.slice(0,200).map(a=>`<tr><td class="small mono">${fmtDT(a.ts)}</td><td class="small">${esc(a.usuario)}</td><td><span class="pill ${a.acao==="Exclusão"?"crit":a.acao==="Encerramento"?"good":""}">${esc(a.acao)}</span></td><td class="small">${esc(a.entidade)}</td><td class="small muted">${esc(a.detalhe||"")}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">Sem eventos ainda.</td></tr>'}
      </tbody></table></div>
    </div>
    <div class="panel"><div class="ph"><h3>Registros excluídos (soft delete)</h3></div>
      <div class="list">${excl.map(({a,x})=>`<div class="item"><div><div class="t">${esc(x.razao||x.ns||x.placa||x.nome||x.descricao||x.produtoNome||x.id)}</div>
      <div class="d">${esc(a)} · ${esc(x.excluido.usuario)} · ${fmtDT(x.excluido.ts)}</div>
      <div class="small muted">${esc(x.excluido.motivo)}</div></div>
      <span class="sp"></span>${can("excluir")?`<button class="btn sm" data-restore="${a}:${x.id}">Restaurar</button>`:""}</div>`).join("")||'<div class="emptyst small">Nenhum registro excluído.</div>'}
      </div>
    </div>
  </div>`;
  v.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{
    const [a,id]=b.dataset.restore.split(":");const x=byId(a,id);delete x.excluido;audit("Restauração",a,id);persist();toast("Registro restaurado.");router();
  });
};

/* ---------- PWA: manifesto + ícones gerados em runtime ---------- */
function installPWA(){
  try{
    const bolt='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="104" fill="#0b5566"/><path d="M300 70 150 300h108l-16 142 150-190h-104l12-182Z" fill="#dff1f6"/></svg>';
    const svgIcon="data:image/svg+xml,"+encodeURIComponent(bolt);
    let pngIcon=svgIcon;
    try{
      const cv=document.createElement("canvas");cv.width=cv.height=192;const c=cv.getContext("2d");
      c.fillStyle="#0b5566";c.fillRect(0,0,192,192);
      c.fillStyle="#dff1f6";c.scale(192/512,192/512);
      c.fill(new Path2D("M300 70 150 300h108l-16 142 150-190h-104l12-182Z"));
      pngIcon=cv.toDataURL("image/png");
    }catch(e){}
    const manifest={name:"GeraCampo",short_name:"GeraCampo",description:"Manutenção de geradores e operação de campo",
      start_url:".",scope:".",display:"standalone",orientation:"portrait",
      background_color:"#0e7490",theme_color:"#0e7490",
      icons:[{src:pngIcon,sizes:"192x192",type:"image/png",purpose:"any"},{src:svgIcon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
    const l=document.createElement("link");l.rel="manifest";
    l.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
    document.head.appendChild(l);
    const al=document.createElement("link");al.rel="apple-touch-icon";al.href=pngIcon;document.head.appendChild(al);
    const fav=document.createElement("link");fav.rel="icon";fav.href=svgIcon;document.head.appendChild(fav);
  }catch(e){}
}

/* ---------- boot ---------- */
installPWA();
renderNav();renderTabs();renderRole();
$("#userbtn").onclick=()=>trocarTecnico();
$("#backbtn").onclick=()=>{if(history.length>1)history.back();else location.hash="#/mais";};
const THEMEKEY="geracampo_theme";
try{const t=localStorage.getItem(THEMEKEY);if(t)document.documentElement.dataset.theme=t;}catch(e){}
function applyThemeColor(){
  const dark=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);
  let mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=dark?"#0b1214":"#0e7490";
}
applyThemeColor();
$("#themebtn").onclick=()=>{
  const cur=document.documentElement.dataset.theme;
  const nxt=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  document.documentElement.dataset.theme=nxt;try{localStorage.setItem(THEMEKEY,nxt);}catch(e){}
  applyThemeColor();
};
router();
initRemote();
if(VIEWER_FRESH&&DB.tecnicos.filter(ativo).length>1)setTimeout(trocarTecnico,300);
</script>
