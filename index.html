<title>Banheza Assist</title>
<meta name="description" content="Banheza Assist — app de assistência técnica e manutenção de campo: ordens de serviço, jornada, veículos e estoque.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002820">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Banheza Assist">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Banheza Design System — tema Assist (verde) */
  --green-950:#002018; --green-900:#002820; --green-800:#003020; --green-700:#003828;
  --green-500:#008048; --green-400:#00c868; --green-300:#3ed87f; --green-200:#58e888; --green-100:#d5f7e3;
  --n-50:#f5f7fa; --n-100:#e9edf3; --n-200:#d6dde7; --n-400:#8a97a8; --n-500:#5d6a7e; --n-700:#2a3247; --n-900:#001030;
  --ground:var(--n-50); --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e4e9f1;
  --ink:var(--n-900); --ink-2:var(--n-700); --ink-3:var(--n-500); --line:var(--n-200); --line-2:#e6eaf1;
  --accent:#00c868; --accent-deep:#008048; --accent-soft:#d5f7e3; --on-accent:#002018;
  --brand-dark:#002820; --brand-lime:#58e888;
  --grad-assist:linear-gradient(180deg,#002820 0%,#003828 55%,#008048 100%);
  --grad-mark-green:linear-gradient(155deg,#58e888 0%,#00c868 45%,#008048 100%);
  --good:#0b6b3c; --good-soft:#d5f7e3; --warn:#8a5c00; --warn-soft:#fdf1d8; --crit:#a3251e; --crit-soft:#fbe3e1;
  --info:#0050d1; --info-soft:#d6f4fd;
  --radius:20px; --radius-sm:14px; --radius-chip:10px;
  --shadow:0 2px 6px rgba(0,16,48,.08);
  --shadow-md:0 8px 20px rgba(0,16,48,.10);
  --shadow-lg:0 18px 40px rgba(0,16,48,.14);
  --shadow-accent:0 12px 28px rgba(0,128,72,.26);
  --focus-ring:0 0 0 3px rgba(0,144,248,.18);
  --font:"Montserrat",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --display:"Exo 2",var(--font); --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#071a12; --surface:#0e241a; --surface-2:#143026; --surface-3:#1c3d30;
  --ink:#e9f3ee; --ink-2:#adc4ba; --ink-3:#7e968b; --line:#274236; --line-2:#1d3329;
  --accent:#3ed87f; --accent-deep:#00c868; --accent-soft:#0f3527; --on-accent:#002018;
  --brand-lime:#7ef0a0;
  --good:#4ec27d; --good-soft:#0f3527; --warn:#e0a24a; --warn-soft:#3a2c14; --crit:#e8756b; --crit-soft:#3a1d1c;
  --info:#7ab7ff; --info-soft:#132a44;
  --shadow:0 2px 8px rgba(0,0,0,.4); --shadow-md:0 10px 26px rgba(0,0,0,.5); --shadow-lg:0 18px 44px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#071a12; --surface:#0e241a; --surface-2:#143026; --surface-3:#1c3d30;
  --ink:#e9f3ee; --ink-2:#adc4ba; --ink-3:#7e968b; --line:#274236; --line-2:#1d3329;
  --accent:#3ed87f; --accent-deep:#00c868; --accent-soft:#0f3527; --on-accent:#002018;
  --brand-lime:#7ef0a0;
  --good:#4ec27d; --good-soft:#0f3527; --warn:#e0a24a; --warn-soft:#3a2c14; --crit:#e8756b; --crit-soft:#3a1d1c;
  --info:#7ab7ff; --info-soft:#132a44;
  --shadow:0 2px 8px rgba(0,0,0,.4); --shadow-md:0 10px 26px rgba(0,0,0,.5); --shadow-lg:0 18px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink-2);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em;color:var(--ink);font-weight:600}
a{color:var(--info)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
[hidden]{display:none!important}

/* shell — mobile-first: app bar em cima, tab bar embaixo */
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.side{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px}
.brand .mark{width:30px;flex:none}
.brand .mark img,.brand .mark svg{display:block;width:100%;height:auto}
.brand b{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.15em;text-indent:.15em;text-transform:uppercase;color:var(--ink);line-height:1.1;display:block}
.brand b i{font-style:normal;font-weight:600;font-size:9px;letter-spacing:.3em;text-indent:.3em;color:var(--accent-deep);display:block;margin-top:2px}
.brand span{display:block;font-size:10px;color:var(--ink-3);letter-spacing:.03em;margin-top:4px}
.nav{padding:6px 10px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px;margin-bottom:1px}
.nav a .ic{width:17px;height:17px;flex:none;opacity:.85}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.nav a.on .ic{opacity:1}
.nav a>span{flex:1;min-width:0}
.nav a.lk{opacity:.6}
.nav a .lkic{width:13px;height:13px;flex:none;opacity:.75;stroke-width:2}
.protag{display:inline-flex;align-items:center;gap:4px;font-family:var(--sans,inherit);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep);background:var(--accent-soft);border-radius:100px;padding:2px 7px;vertical-align:middle}
.maistile.lk{opacity:.72}
.maistile.lk b{display:flex;align-items:center;gap:6px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);padding:16px 10px 5px;font-weight:600}
.side .foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 12px;padding-top:calc(9px + env(safe-area-inset-top))}
.topbar .crumb{flex:1;min-width:0;font-weight:700;font-family:var(--display);font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.userchip{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:100px;padding:5px 11px 5px 5px;color:var(--ink);min-height:38px;flex:none;max-width:11em}
.userchip .uav{width:26px;height:26px;border-radius:50%;background:var(--grad-mark-green);color:var(--green-950);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11px;flex:none}
.userchip .uname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userchip:active{background:var(--surface-3)}
@media(max-width:360px){.userchip .uname{display:none}.userchip{padding:5px}}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:var(--radius-chip);width:38px;height:38px;display:grid;place-items:center;flex:none}
#backbtn{display:none}
.app.hasback #backbtn{display:grid}
.wrap{padding:16px 14px calc(88px + env(safe-area-inset-bottom));width:100%;max-width:680px;margin:0 auto}
.menutoggle{display:none!important}

/* tab bar (celular) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 14px -6px rgba(0,16,48,.18)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;color:var(--ink-3);text-decoration:none;font-size:10.5px;font-weight:500;letter-spacing:.01em;min-height:56px;justify-content:center}
.tabbar a .ic{width:23px;height:23px;stroke-width:1.9}
.tabbar a.on{color:var(--accent-deep);font-weight:600}
.tabbar a.on .ic{stroke-width:2.5}
.tabbar a:active{background:var(--surface-2)}

/* grade de atalhos da tela "Mais" */
.maisgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.maistile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.maistile .ic{width:22px;height:22px;color:var(--accent-deep)}
.maistile b{font-family:var(--display);font-size:13.5px;font-weight:600}
.maistile span{font-size:11px;color:var(--ink-3)}
.maistile:active{background:var(--surface-2)}

/* generic */
.row{display:flex;gap:12px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.pagehead{margin-bottom:18px}
.pagehead h1{font-size:22px;letter-spacing:-.01em}
.pagehead p{margin:6px 0 0;color:var(--ink-3);max-width:64ch;font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);border-radius:var(--radius-sm);padding:11px 18px;font-weight:600;font-size:14px;letter-spacing:.01em;text-decoration:none;min-height:44px;line-height:1.1;transition:background-color .18s,border-color .18s,box-shadow .18s,transform .12s}
.btn:hover{background:var(--surface-2);border-color:var(--n-300,#b9c4d2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-accent)}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep);transform:translateY(-1px)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);min-height:36px;padding:8px 10px;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);background:var(--surface)}
.btn.sm{padding:7px 13px;font-size:12.5px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
@media(min-width:960px){.btn{font-size:13px;min-height:38px;padding:8px 15px}.btn.sm{min-height:30px;padding:5px 11px;font-size:12px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:20px}
.card h3{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel>.ph{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel>.ph h3{font-size:13.5px}
.panel>.pb{padding:6px 0}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);font-weight:600;line-height:1.25}
.kpi .val{font-family:var(--display);font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.02em;color:var(--ink)}
.kpi .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi.warn{border-color:var(--warn-soft)} .kpi.warn .val{color:var(--warn)}
.kpi.crit{border-color:var(--crit-soft)} .kpi.crit .val{color:var(--crit)}
.kpi.good .val{color:var(--good)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit;min-height:56px}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item:active{background:var(--surface-3)}
.item .t{font-weight:600;font-size:14px;color:var(--ink)}
.item .d{font-size:12px;color:var(--ink-3)}
.item .sp{flex:1}
.avatar{width:36px;height:36px;border-radius:var(--radius-chip);background:var(--grad-mark-green);color:var(--green-950);display:grid;place-items:center;font-weight:700;font-family:var(--display);flex:none;font-size:13px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;min-height:22px;border-radius:100px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap;letter-spacing:.02em}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent-deep)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}

label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
label.f .rq{color:var(--crit)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;width:100%;min-height:44px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--info);box-shadow:var(--focus-ring)}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--ink-3) 50%),linear-gradient(-45deg,transparent 49%,var(--ink-3) 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input[type=file]{padding:9px;font-size:13px}
input[type=checkbox]{min-height:0}
@media(min-width:960px){input,select,textarea{font-size:13.5px;min-height:0;padding:8px 10px}}
.formgrid{display:grid;grid-template-columns:1fr;gap:13px}
@media(min-width:600px){.formgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.formgrid .full{grid-column:1/-1}
.searchbar{position:relative;flex:1;min-width:160px}
.searchbar input{padding-left:34px}
.searchbar .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;font-size:15px}

.chips{display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{font-size:12.5px;padding:7px 14px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);font-weight:500;white-space:nowrap;min-height:34px;transition:background-color .18s,color .18s,border-color .18s}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}

.detailgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.detailgrid.two{grid-template-columns:1.4fr 1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:500}
.kv dd{margin:0;font-weight:500;text-align:right}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 15px}
.tl::before{content:"";position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tl .when{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.tl .what{font-weight:600;font-size:13px;margin-top:1px}

.flowdiag{display:flex;flex-direction:column;gap:0;font-family:var(--display);font-weight:600}
.flowdiag .step{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px}
.flowdiag .arr{align-self:center;color:var(--accent);padding:3px 0;font-size:14px}

.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:74px;height:74px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--line)}
.photogroup{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;width:100%;margin-top:4px}

.modal-bg{position:fixed;inset:0;background:rgba(8,16,18,.5);display:grid;place-items:end center;z-index:60}
.modal{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;border-bottom:0;animation:sheetup .22s ease}
.modal .mh{padding:15px 18px 13px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mh::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:34px;height:4px;border-radius:2px;background:var(--line)}
.modal .mh h3{font-size:16px}
.modal .mb{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal .mf{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);display:flex;flex-direction:column-reverse;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.modal .mf .btn{width:100%}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:640px){
  .modal-bg{place-items:center;padding:18px}
  .modal{border-radius:var(--radius);border-bottom:1px solid var(--line);max-height:88vh;animation:none}
  .modal .mh::before{display:none}
  .modal .mf{flex-direction:row;justify-content:flex-end}
  .modal .mf .btn{width:auto}
}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:100px;font-size:13px;font-weight:500;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center}
@media(min-width:960px){.toast{bottom:24px}}

/* leitor de QR / código de barras */
.scanwrap{position:fixed;inset:0;z-index:120;background:rgba(6,20,14,.72);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
.scanbox{background:var(--surface);border-radius:16px;width:100%;max-width:420px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -18px rgba(0,0,0,.55)}
.scanhead{display:flex;align-items:center;justify-content:space-between}
.scanhead b{font-family:var(--display);font-size:16px}
.scanvid{position:relative;border-radius:12px;overflow:hidden;background:#0c1a14;aspect-ratio:1/1}
.scanvid video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:14%;border:3px solid var(--brand-lime,#83c932);border-radius:14px;box-shadow:0 0 0 100vmax rgba(6,20,14,.35);pointer-events:none}
.scanactions{display:flex;gap:8px}
.scanactions .btn{flex:1}
.scanactions .btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.emptyst{text-align:center;padding:40px 20px;color:var(--ink-3)}
.bignums{display:flex;gap:8px}
.actionbar{display:flex;gap:8px;flex-wrap:wrap}
.actionbar .btn{flex:1 1 auto}
@media(min-width:600px){.actionbar .btn{flex:0 0 auto}}

.stepper{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}

/* reduz a foto antes de guardar (economia p/ sincronização e armazenamento) */
function compressImg(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=900,sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      try{cb(cv.toDataURL("image/jpeg",0.55));}catch(e){cb(rd.result);}
    };
    img.onerror=()=>cb(rd.result);
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- leitor de QR Code / código de barras (câmera) ---------- */
let zxingLibP=null;
function loadZXing(){
  if(window.ZXing&&window.ZXing.BrowserMultiFormatReader)return Promise.resolve(true);
  if(zxingLibP)return zxingLibP;
  zxingLibP=new Promise(res=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload=()=>res(!!(window.ZXing&&window.ZXing.BrowserMultiFormatReader));
    s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
  return zxingLibP;
}
function abrirScanner({titulo="Ler QR Code",dica="Aponte a câmera para o QR Code ou código de barras.",onLer}={}){
  const ov=document.createElement("div");ov.className="scanwrap";ov.id="scanwrap";
  ov.innerHTML=`<div class="scanbox">
    <div class="scanhead"><b>${esc(titulo)}</b><button class="iconbtn" id="scanx" aria-label="Fechar">✕</button></div>
    <div class="scanvid"><video id="scanvideo" playsinline muted></video><div class="scanframe"></div></div>
    <p class="small muted" id="scanmsg">${esc(dica)}</p>
    <div class="scanactions">
      <button class="btn sm" id="scantorch" hidden>💡 Lanterna</button>
      <button class="btn sm" id="scancancel">Cancelar</button>
    </div></div>`;
  document.body.appendChild(ov);
  let stream=null,stopFn=null,rafId=null,done=false;
  const video=ov.querySelector("#scanvideo"), msg=ov.querySelector("#scanmsg");
  const encerrar=()=>{
    done=true;
    if(rafId)cancelAnimationFrame(rafId);
    try{stopFn&&stopFn();}catch(e){}
    try{stream&&stream.getTracks().forEach(t=>t.stop());}catch(e){}
    ov.remove();
  };
  const sucesso=txt=>{ if(done)return; encerrar(); if(onLer)onLer(String(txt||"").trim()); };
  ov.querySelector("#scanx").onclick=encerrar;
  ov.querySelector("#scancancel").onclick=encerrar;
  ov.addEventListener("mousedown",e=>{if(e.target===ov)encerrar();});
  (async()=>{
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    }catch(e){
      msg.textContent="Não foi possível abrir a câmera. Autorize o acesso nas configurações do navegador e tente de novo.";
      return;
    }
    video.srcObject=stream;try{await video.play();}catch(e){}
    const track=stream.getVideoTracks()[0];
    let caps={};try{caps=track.getCapabilities?track.getCapabilities():{};}catch(e){}
    if(caps.torch){
      const tb=ov.querySelector("#scantorch");tb.hidden=false;let on=false;
      tb.onclick=()=>{on=!on;tb.classList.toggle("on",on);track.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});};
    }
    if("BarcodeDetector" in window){
      try{
        const fmts=await window.BarcodeDetector.getSupportedFormats();
        const det=new window.BarcodeDetector(fmts&&fmts.length?{formats:fmts}:undefined);
        const tick=async()=>{
          if(done)return;
          try{const codes=await det.detect(video);if(codes&&codes.length&&codes[0].rawValue)return sucesso(codes[0].rawValue);}catch(e){}
          rafId=requestAnimationFrame(tick);
        };
        tick();return;
      }catch(e){}
    }
    msg.textContent="Preparando o leitor…";
    const ok=await loadZXing();
    if(done)return;
    if(!ok){msg.textContent="Sem leitor disponível neste aparelho — digite os dados manualmente.";return;}
    msg.textContent=dica;
    try{
      const reader=new window.ZXing.BrowserMultiFormatReader();
      stopFn=()=>{try{reader.reset();}catch(e){}};
      reader.decodeFromStream(stream,video,(result)=>{ if(result&&!done)sucesso(result.getText()); });
    }catch(e){
      try{
        const reader=new window.ZXing.BrowserMultiFormatReader();
        stopFn=()=>{try{reader.reset();}catch(e){}};
        reader.decodeFromVideoDevice(undefined,video,(result)=>{ if(result&&!done)sucesso(result.getText()); });
      }catch(e2){ msg.textContent="Não foi possível iniciar o leitor. Digite os dados manualmente."; }
    }
  })();
}

/* ---------- importação de OS a partir de PDF ---------- */
let pdfLibP=null;
function loadPdfLib(){
  if(window.pdfjsLib)return Promise.resolve(true);
  if(pdfLibP)return pdfLibP;
  pdfLibP=new Promise(res=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}catch(e){}res(!!window.pdfjsLib);};
    s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
  return pdfLibP;
}
async function extrairTextoPDF(file){
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let txt="";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const c=await page.getTextContent();
    txt+=c.items.map(i=>i.str).join(" ")+"\n";
  }
  return txt.trim();
}
function parseOsPdf(txt){

function dataUrlParaBlob(u){

function persist(){
  persistLocal();
  if(MODO_DEMO||!supa||!PERFIL)return;
  lastLocalWrite=Date.now();SYNC.mode="pending";updateSync();
  clearTimeout(flushT);flushT=setTimeout(flush,600);
}
async function flush(){
  if(MODO_DEMO||!supa||!PERFIL)return;
  const emp=PERFIL.empresa_id, jobs=[];
  for(const c of COLS_DADOS){
    const tab=TAB[c], agora=new Map((DB[c]||[]).map(r=>[r.id,r]));
    for(const [id,r] of agora){
      const j=JSON.stringify(r);
      if(snap[c]&&snap[c].get(id)===j)continue;
      jobs.push({t:tab,op:"up",row:{id,empresa_id:emp,dados:regParaDados(r),atualizado_em:nowISO()}});
    }
    if(snap[c])for(const id of snap[c].keys())if(!agora.has(id))jobs.push({t:tab,op:"del",id});
  }
  if(JSON.stringify(CFG())!==snap.__cfg)
    jobs.push({t:"config_empresa",op:"cfg",row:{empresa_id:emp,dados:{...CFG()},atualizado_em:nowISO()}});
  const novosAud=DB.auditoria.filter(a=>a._novo);
  if(!jobs.length&&!novosAud.length){SYNC.mode="ok";SYNC.ts=Date.now();updateSync();return;}
  let erro=null;
  for(const jb of jobs){
    let r;
    if(jb.op==="del")r=await supa.from(jb.t).delete().eq("id",jb.id);
    else if(jb.op==="cfg")r=await supa.from(jb.t).upsert(jb.row,{onConflict:"empresa_id"});
    else r=await supa.from(jb.t).upsert(jb.row);
    if(r&&r.error){erro=r.error;break;}
  }
  for(const a of novosAud){
    const r=await supa.from("auditoria").insert({empresa_id:emp,usuario_id:PERFIL.id,usuario_nome:a.usuario,acao:a.acao,entidade:a.entidade,entidade_id:a.entidadeId,detalhe:a.detalhe});
    if(!r.error)delete a._novo;
  }
  if(erro){
    console.warn("flush erro:",erro);
    SYNC.mode="err";updateSync();
    toast(/policy|permission|denied|row-level/i.test(erro.message||"")?"Sem permissão para essa alteração.":"Erro ao salvar: "+(erro.message||erro));
    try{await carregarTudo();renderNav();router();}catch(e){}
    return;
  }
  SYNC.mode="ok";SYNC.ts=Date.now();updateSync();carregarSnap();
}
function rerenderRT(){
  SYNC.mode="ok";SYNC.ts=Date.now();updateSync();
  if(document.getElementById("modalbg"))return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  renderNav();router();
}
function aplicarRT(c,p){
  if(Date.now()-lastLocalWrite<2000)return;
  DB[c]=DB[c]||[];
  if(p.eventType==="DELETE"){const id=(p.old||{}).id;DB[c]=DB[c].filter(r=>r.id!==id);if(snap[c])snap[c].delete(id);}
  else{const rec=linhaParaReg(p.new);const i=DB[c].findIndex(r=>r.id===rec.id);if(i>=0)DB[c][i]=rec;else DB[c].unshift(rec);if(snap[c])snap[c].set(rec.id,JSON.stringify(rec));}
  persistLocal();rerenderRT();
}
function assinarRealtime(){
  const ch=supa.channel("gc-"+Math.random().toString(36).slice(2));
  for(const c of COLS_DADOS)
    ch.on("postgres_changes",{event:"*",schema:"public",table:TAB[c]},p=>aplicarRT(c,p));
  ch.on("postgres_changes",{event:"*",schema:"public",table:"config_empresa"},p=>{
    if(p.new&&p.new.dados){DB.configs=[{id:"main",...p.new.dados}];snap.__cfg=JSON.stringify(CFG());rerenderRT();}
  });
  ch.on("postgres_changes",{event:"*",schema:"public",table:"perfis"},()=>{
    supa.from("perfis").select("id,nome,papel,ativo").then(({data})=>{
      if(!data)return;
      DB.tecnicos=data.map(x=>({id:x.id,nome:x.nome,papel:x.papel,excluido:x.ativo?undefined:{}}));
      const meu=data.find(x=>x.id===PERFIL.id);
      if(meu){if(!meu.ativo){logout();return;}PERFIL.nome=meu.nome;PERFIL.papel=meu.papel;}
      rerenderRT();
    });
  });
  ch.on("postgres_changes",{event:"INSERT",schema:"public",table:"auditoria"},p=>{
    const a=p.new;if(a&&!DB.auditoria.some(x=>x.id===String(a.id)))
      DB.auditoria.unshift({id:String(a.id),ts:a.ts,usuario:a.usuario_nome,acao:a.acao,entidade:a.entidade,entidadeId:a.entidade_id,detalhe:a.detalhe});
  });
  ch.on("postgres_changes",{event:"*",schema:"public",table:"empresas"},p=>{ if(p.new){EMPRESA=p.new;rerenderRT();} });
  ch.on("postgres_changes",{event:"*",schema:"public",table:"convites"},()=>{
    supa.from("convites").select("*").order("criado_em",{ascending:false}).then(({data})=>{if(data){DB.convites=data;rerenderRT();}});
  });
  ch.subscribe();
}

function preventivaStatus(pv){
  const v=byId("veiculos",pv.veiculoId);if(!v)return{label:"—",cls:""};
  const kmRest=pv.regraKm?(pv.ultKm+pv.regraKm)-v.kmAtual:Infinity;
  const diasRest=pv.regraMeses?daysBetween(new Date(),new Date(new Date(pv.ultData).setMonth(new Date(pv.ultData).getMonth()+pv.regraMeses))):Infinity;
  const venc=kmRest<=0||diasRest<=0;
  const prox=kmRest<=(pv.regraKm?pv.regraKm*0.15:0)||diasRest<=21;
  return{kmRest,diasRest,venc,prox,label:venc?"Vencida":prox?"Próxima":"Em dia",cls:venc?"crit":prox?"warn":"good"};
}

  const btn=$("#loginBtn");btn.disabled=true;btn.textContent="Criando…";

  try{ r=await supa.auth.signUp({email,password:pass,options:{data:{nome,codigo}}}); }
  catch(e){ r={error:{message:String(e)}}; }
  btn.disabled=false;btn.textContent="Criar conta";
  if(r.error){
    return err(/already registered|already exists/i.test(r.error.message)?"Já existe uma conta com esse e-mail — entre em vez de criar.":(r.error.message||"Não foi possível criar a conta."));
  }
  if(r.data.session){ try{ await entrar(r.data.session); }catch(e){ err("Conta criada, mas houve um erro ao carregar: "+(e.message||e)); } return; }
  // precisa confirmar e-mail
  LOGIN_MODO="entrar";atualizarLoginModo();
  $("#loginOk").textContent="Conta criada. Confirme pelo link que enviamos ao seu e-mail e depois entre aqui.";
  $("#loginOk").hidden=false;$("#loginPass").value="";
}

async function entrar(session){
  for(let i=0;i<8;i++){ // o perfil é criado por trigger logo após o signUp — pode levar um instante
    var {data:p,error}=await supa.from("perfis").select("*").eq("id",session.user.id).maybeSingle();
    if(error)throw error;
    if(p)break;
    await new Promise(r=>setTimeout(r,350));
  }
  if(!p){await supa.auth.signOut();return mostrarLogin("Não consegui carregar seu perfil. Tente entrar de novo em alguns segundos.");}
  if(!p.ativo||!p.empresa_id){
    await supa.auth.signOut();
    return mostrarLogin(!p.empresa_id
      ? "Código de convite inválido ou vencido. Peça um novo convite ao administrador da empresa."
      : "Seu acesso está desativado. Fale com o administrador da sua empresa.");
  }
  PERFIL={...p,email:session.user.email};VIEWER.userId=p.id;saveViewer();
  SYNC.mode="conectando";updateSync();
  await carregarTudo();
  esconderLogin();dispensarSplash();renderNav();renderRole();
  assinarRealtime();
  SYNC.mode="ok";SYNC.ts=Date.now();updateSync();
  if(precisaOnboarding()){ router(); abrirOnboarding(); return; }
  if(RETORNO_PAGAMENTO&&planoEfetivo()!=="pro"){location.hash="#/assinar";}
  else if(!location.hash||location.hash==="#/"||location.hash==="#/mais")location.hash="#/painel";
  router();
  toast("Bem-vindo, "+p.nome.split(/\s+/)[0]+".");
}

/* ---------- modal ---------- */
function modal({title,body,footer,wide}){
  closeModal();
  const bg=document.createElement("div");bg.className="modal-bg";bg.id="modalbg";
  bg.innerHTML=`<div class="modal" style="${wide?'max-width:760px':''}"><div class="mh"><h3>${esc(title)}</h3><button class="iconbtn" id="modalx" aria-label="Fechar">✕</button></div><div class="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:""}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener("mousedown",e=>{if(e.target===bg)closeModal();});
  $("#modalx").onclick=closeModal;
  return bg;
}

function excluir(arr,id,label,after){
  if(!can("excluir",arr)){toast(SO_ADMIN_EXCLUI.includes(arr)?"Somente o administrador pode excluir "+label.toLowerCase()+".":"Sem permissão para excluir.");return;}
  const wrapId=uid("mot");
  modal({title:"Excluir "+label,body:`
    <p class="small muted">A exclusão é lógica (soft delete). O registro sai das listas mas continua na auditoria e pode ser restaurado.</p>
    <label class="f">Motivo da exclusão <span class="rq">*</span>
      <textarea id="${wrapId}" placeholder="Descreva o motivo"></textarea></label>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" id="cfx">Excluir</button>`});
  $("#cfx").onclick=()=>{
    const motivo=$("#"+wrapId).value.trim();
    if(!motivo){toast("Informe o motivo.");return;}
    const reg=byId(arr,id);reg.excluido={ts:nowISO(),usuario:auditUser(),motivo};
    audit("Exclusão",label,id,motivo);persist();closeModal();toast(label+" excluído.");after&&after();
  };
}

function clienteForm(v,c){

      <select id="relacao">${Object.entries(RELACAO).map(([k,val])=>`<option value="${k}"${e.relacao===k?" selected":""}>${val}</option>`).join("")}</select></label>
  </div>
  <h3 style="margin:18px 0 4px">Visita técnica</h3>
  <p class="small muted" style="margin:0 0 12px">Rotina de visita deste cliente — usada para lembrar dos atendimentos preventivos.</p>
  <div class="formgrid">
    <label class="f">Periodicidade
      <select id="visitaPeriodo">${Object.entries(VISITA_PERIODO).map(([k,val])=>`<option value="${k}"${(e.visitaPeriodo||"")===k?" selected":""}>${val}</option>`).join("")}</select></label>

    <label class="f full">Melhor dia / horário / acesso<input id="visitaObs" value="${esc(e.visitaObs||"")}" placeholder="Ex.: terças de manhã · falar com a portaria"></label>
  </div>

  if(CLI_PREFILL&&!c){preencherClienteForm(v,CLI_PREFILL);CLI_PREFILL=null;}
  const pIn=v.querySelector("#cliPdfInput");
  v.querySelector("#cliPdf")&&(v.querySelector("#cliPdf").onclick=()=>{pIn.value="";pIn.click();});
  pIn&&(pIn.onchange=async ev=>{
    const file=ev.target.files[0];if(!file)return;
    if(file.size>8*1024*1024)return toast("PDF muito grande (máx. 8 MB).");
    toast("Lendo o PDF…");
    if(!await loadPdfLib())return toast("Não foi possível carregar o leitor de PDF.");
    let texto="";
    try{texto=await extrairTextoPDF(file);}catch(err){return toast("Não consegui ler este PDF (pode ser um scan sem texto).");}
    if(!texto)return toast("O PDF não tem texto selecionável. Preencha manualmente.");
    const r=parseOsPdf(texto);
    const dig=s=>String(s||"").replace(/\D/g,"");
    const jaExiste=r.clienteDoc&&DB.clientes.find(x=>ativo(x)&&dig(x.doc)===dig(r.clienteDoc));
    if(jaExiste)return toast("Esse cliente já está cadastrado: "+cliNome(jaExiste.id));
    preencherClienteForm(v,r);
    toast(r.clienteNome||r.clienteDoc?"Dados do cliente preenchidos pelo PDF — confira e salve.":"Não encontrei dados de cliente nesse PDF.");
  });
  v.querySelector("#save").onclick=()=>{
    const g=id=>v.querySelector("#"+id).value.trim();
    if(!g("razao")||!g("doc"))return toast("Razão social e CPF/CNPJ são obrigatórios.");
    const data={razao:g("razao"),fantasia:g("fantasia"),doc:g("doc"),tel:g("tel"),email:g("email"),endereco:g("endereco"),cidade:g("cidade"),contatos:g("contatos"),blingId:g("blingId"),relacao:v.querySelector("#relacao").value,
      visitaPeriodo:v.querySelector("#visitaPeriodo").value,visitaProxima:g("visitaProxima")||null,visitaObs:g("visitaObs"),obs:g("obs")};
    if(c){Object.assign(c,data);audit("Edição","Cliente",c.id);}
    else{const n={id:uid("cli"),criadoEm:nowISO(),...data};DB.clientes.unshift(n);audit("Criação","Cliente",n.id);c=n;}
    persist();toast("Cliente salvo.");location.hash="#/clientes/"+c.id;
  };
}

ROUTES.equipamentos=(v,rest)=>{

  let q="",fstatus="";
  const draw=()=>{
    let list=DB.equipamentos.filter(ativo);
    if(fstatus)list=list.filter(e=>e.status===fstatus);

    v.querySelector("#elist").innerHTML=list.map(e=>`

      <span class="sp"></span>${e.classAtend?tipoAtendPill(e.classAtend):""}<span class="pill ${e.status==="Ativo"?"good":e.status==="Retirado"||e.status==="Descartado"?"crit":""}">${esc(e.status)}</span></a>`).join("")||'<div class="emptyst">Nenhum equipamento.</div>';
  };

    ${can("criar")?`<a class="btn primary" href="#/equipamentos/novo">+ Cadastrar NS</a>`:""}</div>
  <div class="row" style="margin-bottom:12px"><div class="searchbar"><span class="ic">⌕</span><input id="q" placeholder="Buscar por NS, modelo, cliente…"></div></div>
  <div class="chips" style="margin-bottom:14px"><button class="chip on" data-s="">Todos</button>${STATUS_EQUIP.map(s=>`<button class="chip" data-s="${s}">${s}</button>`).join("")}</div>
  <div class="panel"><div class="list" id="elist"></div></div>`;
  v.querySelector("#q").oninput=e=>{q=e.target.value;draw();};
  v.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{v.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));ch.classList.add("on");fstatus=ch.dataset.s;draw();});
  draw();

function transferirEquip(e){
  modal({title:"Transferir equipamento de cliente",body:`
    <p class="small muted">O NS permanece o mesmo. O período com o cliente atual é fechado e um novo período é aberto. O histórico técnico acompanha o NS.</p>
    <label class="f">Novo cliente
      <select id="ncli">${DB.clientes.filter(ativo).map(c=>`<option value="${c.id}"${c.id===e.clienteId?" disabled":""}>${esc(c.fantasia||c.razao)}</option>`).join("")}</select></label>
    <label class="f" style="margin-top:10px">Novo local de instalação<input id="nloc" value="${esc(e.local||"")}"></label>
    <label class="f" style="margin-top:10px">Setor / piscina<input id="nset" value="${esc(e.setor||"")}"></label>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="ok">Transferir</button>`});
  $("#ok").onclick=()=>{
    const nc=$("#ncli").value;if(nc===e.clienteId)return toast("Selecione outro cliente.");
    const inst=(e.instalacoes||[]);const cur=inst.find(x=>!x.fim);if(cur)cur.fim=nowISO();
    inst.push({clienteId:nc,inicio:nowISO(),fim:null});
    e.instalacoes=inst;e.clienteId=nc;e.local=$("#nloc").value.trim();e.setor=$("#nset").value.trim();
    audit("Transferência","Equipamento",e.id,"Novo cliente: "+cliNome(nc));persist();closeModal();toast("Equipamento transferido.");router();
  };
}

function equipForm(v,e){
  const x=e||{camposValores:{}};
  v.innerHTML=`<a class="btn ghost sm" href="#/equipamentos">← Cancelar</a>
  <div class="pagehead"><h1>${e?"Editar "+esc(eqLabel().toLowerCase()):"Cadastrar "+esc(eqLabel())}</h1><p>Cadastro único. Características permanentes ficam aqui; o técnico não repete isso a cada visita.</p></div>
  <div class="card pad"><div class="formgrid">
    <label class="f">NS (número de série) <span class="rq">*</span><input id="ns" class="mono" value="${esc(x.ns||"")}"${e?" ":""}></label>
    <label class="f">Modelo<input id="modelo" value="${esc(x.modelo||"")}"></label>
    <label class="f">Fabricante<input id="fabricante" value="${esc(x.fabricante||"")}"></label>
    <label class="f">Data de fabricação<input id="dataFab" type="date" value="${esc((x.dataFab||"").slice(0,10))}"></label>
    <label class="f">Data de instalação<input id="dataInstal" type="date" value="${esc((x.dataInstal||"").slice(0,10))}"></label>
    <label class="f">Status<select id="status">${STATUS_EQUIP.map(s=>`<option${x.status===s?" selected":""}>${s}</option>`).join("")}</select></label>
    <label class="f">Cliente atual<select id="clienteId">${DB.clientes.filter(ativo).map(c=>`<option value="${c.id}"${x.clienteId===c.id?" selected":""}>${esc(c.fantasia||c.razao)}</option>`).join("")}</select></label>
    <label class="f">Tipo de vínculo<select id="vinculo"><option value="locado"${x.vinculo==="locado"?" selected":""}>locado</option><option value="proprio"${x.vinculo==="proprio"?" selected":""}>próprio</option><option value="outro"${x.vinculo==="outro"?" selected":""}>outro</option></select></label>
    <label class="f">Classificação de atendimento<select id="classAtend"><option value="">—</option>${Object.entries(TIPOS_ATEND).map(([k,val])=>`<option value="${k}"${x.classAtend===k?" selected":""}>${val}</option>`).join("")}</select></label>
    <label class="f">Local de instalação<input id="local" value="${esc(x.local||"")}"></label>
    <label class="f">Endereço / localização<input id="endereco" value="${esc(x.endereco||"")}"></label>
    <label class="f">${esc(setorLabel())}<input id="setor" value="${esc(x.setor||"")}"></label>
    <label class="f full">Observações de instalação<textarea id="obsInstal">${esc(x.obsInstal||"")}</textarea></label>
  </div>
  <h3 style="margin:18px 0 4px">Características técnicas</h3>
  <p class="small muted" style="margin:0 0 12px">Campos configuráveis em <a href="#/config">Configurações</a>.</p>
  <div class="formgrid">${DB.camposTecnicos.filter(ativo).map(cf=>`
    <label class="f">${esc(cf.nome)}${cf.obrig?' <span class="rq">*</span>':""}
      <input data-cf="${cf.id}" ${cf.tipo==="numero"?'type="number" step="any"':""} value="${esc(x.camposValores?.[cf.id]||"")}"></label>`).join("")}</div>
  <div class="mf" style="border:0;padding:16px 0 0"><button class="btn" onclick="location.hash='#/equipamentos'">Cancelar</button><button class="btn primary" id="save">Salvar</button></div></div>`;
  v.querySelector("#save").onclick=()=>{
    const g=id=>v.querySelector("#"+id).value.trim();
    if(!g("ns"))return toast("NS é obrigatório.");
    if(!e&&DB.equipamentos.some(q=>q.ns===g("ns")))return toast("NS já cadastrado.");
    const camposValores={};v.querySelectorAll("[data-cf]").forEach(inp=>camposValores[inp.dataset.cf]=inp.value.trim());
    for(const cf of DB.camposTecnicos.filter(c=>ativo(c)&&c.obrig))if(!camposValores[cf.id])return toast("Campo obrigatório: "+cf.nome);
    const data={ns:g("ns"),modelo:g("modelo"),fabricante:g("fabricante"),dataFab:g("dataFab"),dataInstal:g("dataInstal"),status:v.querySelector("#status").value,clienteId:v.querySelector("#clienteId").value,vinculo:v.querySelector("#vinculo").value,classAtend:v.querySelector("#classAtend").value,local:g("local"),endereco:g("endereco"),setor:g("setor"),obsInstal:g("obsInstal"),camposValores};
    if(e){Object.assign(e,data);audit("Edição","Equipamento",e.id);persist();location.hash="#/equipamentos/"+e.id;}
    else{const n={id:uid("eq"),criadoEm:nowISO(),...data,instalacoes:[{clienteId:data.clienteId,inicio:data.dataInstal||nowISO(),fim:null}]};DB.equipamentos.unshift(n);audit("Criação","Equipamento",n.id);persist();location.hash="#/equipamentos/"+n.id;}
    toast("Equipamento salvo.");
  };
}

/* ============ ORDENS DE SERVIÇO ============ */
ROUTES.os=(v,rest)=>{
  if(rest[0])return osDetalhe(v,rest[0]);
  let f="todas";
  const draw=()=>{
    let list=DB.ordens.filter(ativo);
    if(f!=="todas")list=list.filter(o=>o.status===f);
    v.querySelector("#oslist").innerHTML=list.map(o=>`
      <a class="item" href="#/os/${o.id}"><span class="avatar">OS</span>
      <div><div class="t">${esc(o.numeroBling)} · ${esc(cliNome(o.clienteId))}</div><div class="d">${esc(o.descricao)} ${o.equipamentoId?"· "+esc(eqNome(o.equipamentoId)):""}</div></div>
      <span class="sp"></span>${o.origem==="pdf"?'<span class="pill">PDF</span>':""}${o.tipoAtendimento?tipoAtendPill(o.tipoAtendimento):""}${osStatusPill(o.status)}</a>`).join("")||'<div class="emptyst">Nenhuma OS.</div>';
  };
  v.innerHTML=`<div class="pagehead between"><div><h1>Ordens de Serviço</h1><p>Cadastre a OS manualmente ou <b>importe o PDF da OS</b> (o app lê número, cliente e descrição). O número é só referência enquanto não há integração automática.</p></div>
    ${can("criar")?`<div class="actionbar"><button class="btn primary" id="novaOS">+ Nova OS</button><button class="btn" id="importPdf">Importar OS (PDF)</button><button class="btn ghost" id="import">Gerar OS de exemplo</button><input type="file" id="pdfInput" accept="application/pdf" hidden></div>`:""}</div>
  <div class="chips" style="margin-bottom:14px">
    ${[["todas","Todas"],["aberta","Abertas"],["em_atendimento","Em atendimento"],["aguardando_peca","Aguardando peça"],["aguardando_retorno","Aguardando retorno"],["encerrada","Encerradas"]].map(([k,l],ix)=>`<button class="chip${ix===0?" on":""}" data-f="${k}">${l}</button>`).join("")}
  </div>
  <div class="panel"><div class="list" id="oslist"></div></div>`;
  v.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{v.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");f=c.dataset.f;draw();});
  const nextNum=()=>{
    const nums=DB.ordens.map(o=>parseInt(String(o.numeroBling).replace(/\D/g,""),10)).filter(n=>!isNaN(n));
    return "OS-"+((nums.length?Math.max(...nums):24800)+1);
  };
  v.querySelector("#novaOS")&&(v.querySelector("#novaOS").onclick=()=>{
    const cli=DB.clientes.filter(ativo);
    if(!cli.length){modal({title:"Nova OS",body:'<div class="alertbox"><span>!</span><div>Cadastre ao menos um cliente antes de abrir uma OS.</div></div>',footer:`<button class="btn" onclick="closeModal()">Fechar</button><a class="btn primary" href="#/clientes/novo" onclick="closeModal()">Novo cliente</a>`});return;}
    modal({title:"Nova Ordem de Serviço",body:`
      <p class="small muted">Cadastro manual (substitui a importação do Bling durante os testes).</p>
      <div class="formgrid">
        <label class="f">Número da OS <span class="rq">*</span><input id="onum" class="mono" value="${esc(nextNum())}"></label>
        <label class="f">Data de abertura<input id="odata" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
        <label class="f full">Cliente <span class="rq">*</span><select id="ocli">${cli.map(c=>`<option value="${c.id}">${esc(c.fantasia||c.razao)} · ${esc(c.doc)}</option>`).join("")}</select></label>
        <label class="f full">Descrição / problema relatado<textarea id="odesc" placeholder="O que o cliente relatou"></textarea></label>
        <label class="f full">Situação da cobrança<select id="osc">${SIT_COBRANCA.map(s=>`<option${s==="Não se aplica"?" selected":""}>${s}</option>`).join("")}</select></label>
      </div>`,
      footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="okOS">Criar OS</button>`});
    $("#okOS").onclick=()=>{
      const num=$("#onum").value.trim();
      if(!num)return toast("Informe o número da OS.");
      if(DB.ordens.some(o=>ativo(o)&&o.numeroBling.toLowerCase()===num.toLowerCase()))return toast("Já existe uma OS com esse número.");
      const dt=$("#odata").value?new Date($("#odata").value+"T09:00:00").toISOString():nowISO();
      const n={id:uid("os"),numeroBling:num,criadaEm:dt,clienteId:$("#ocli").value,descricao:$("#odesc").value.trim()||"(sem descrição)",status:"aberta",equipamentoId:null,tipoAtendimento:null,situacaoCobranca:$("#osc").value,origem:"manual"};
      DB.ordens.unshift(n);audit("Criação","OS",n.id,"cadastro manual");persist();closeModal();toast("OS "+num+" criada.");location.hash="#/os/"+n.id;
    };
  });
  const pdfIn=v.querySelector("#pdfInput");
  v.querySelector("#importPdf")&&(v.querySelector("#importPdf").onclick=()=>{pdfIn.value="";pdfIn.click();});
  pdfIn&&(pdfIn.onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.size>8*1024*1024)return toast("PDF muito grande (máx. 8 MB).");
    toast("Lendo o PDF…");
    const ok=await loadPdfLib();
    if(!ok)return toast("Não foi possível carregar o leitor de PDF. Tente de novo com internet.");
    let texto="";
    try{texto=await extrairTextoPDF(file);}catch(err){console.warn(err);return toast("Não consegui ler este PDF. Ele pode ser uma imagem escaneada (sem texto).");}
    if(!texto)return toast("O PDF não tem texto selecionável (parece um scan). Cadastre a OS manualmente.");
    const rd=new FileReader();
    rd.onload=()=>osImportModal(parseOsPdf(texto),file.name,rd.result);
    rd.readAsDataURL(file);
  });
  v.querySelector("#import")&&(v.querySelector("#import").onclick=()=>{
    const cli=DB.clientes.filter(ativo);if(!cli.length)return toast("Cadastre um cliente primeiro.");
    const c=cli[Math.floor(Math.random()*cli.length)];
    const exemplos=["Cliente relata baixa produção de cloro.","Alarme de fluxo intermitente.","Equipamento sem ligar.","Vazamento na célula.","Ruído anormal na bomba.","Revisão preventiva agendada."];
    const n={id:uid("os"),numeroBling:nextNum(),criadaEm:nowISO(),clienteId:c.id,descricao:exemplos[Math.floor(Math.random()*exemplos.length)],status:"aberta",equipamentoId:null,tipoAtendimento:null,situacaoCobranca:"Não se aplica",origem:"exemplo"};
    DB.ordens.unshift(n);audit("Criação","OS",n.id,"OS de exemplo");persist();toast("OS "+n.numeroBling+" criada.");draw();
  });
  draw();
};
function osImportModal(r,fileName,dataUrl){
  const cli=DB.clientes.filter(ativo);
  const match=clienteDoPdf(r);
  const nextNum=()=>{const nums=DB.ordens.map(o=>parseInt(String(o.numeroBling).replace(/\D/g,""),10)).filter(n=>!isNaN(n));return "OS-"+((nums.length?Math.max(...nums):24800)+1);};
  const dataISO=(()=>{const m=(r.data||"").match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:new Date().toISOString().slice(0,10);})();
  const detectado=[r.numero&&`nº ${r.numero}`,r.clienteNome&&`cliente "${r.clienteNome}"`,r.clienteDoc,r.data].filter(Boolean).join(" · ");
  modal({title:"Importar OS do PDF",wide:true,body:`
    <p class="small muted" style="margin:0 0 4px">Arquivo: <b>${esc(fileName)}</b></p>
    <p class="small ${match?"":"muted"}" style="margin:0 0 12px">${match?`Cliente reconhecido: <b>${esc(cliNome(match.id))}</b>.`:(detectado?`Detectado no PDF: ${esc(detectado)}. Confira os campos abaixo.`:"Não consegui detectar os campos automaticamente — preencha abaixo.")}</p>
    <div class="formgrid">
      <label class="f">Número da OS <span class="rq">*</span><input id="inum" class="mono" value="${esc(r.numero?("OS-"+r.numero).replace("OS-OS-","OS-"):nextNum())}"></label>
      <label class="f">Data de abertura<input id="idata" type="date" value="${dataISO}"></label>
      <label class="f full">Cliente <span class="rq">*</span><select id="icli">${cli.length?"":'<option value="">— nenhum cliente cadastrado —</option>'}${cli.map(c=>`<option value="${c.id}"${match&&match.id===c.id?" selected":""}>${esc(c.fantasia||c.razao)} · ${esc(c.doc)}</option>`).join("")}</select>
        ${!match&&(r.clienteNome||r.clienteDoc)?`<span class="small muted">PDF diz: <b>${esc(r.clienteNome||"")}</b> ${esc(r.clienteDoc||"")} — <a href="#" id="cadCliPdf">cadastrar este cliente do PDF</a>.</span>`:""}</label>
      <label class="f full">Descrição / problema relatado<textarea id="idesc" style="min-height:90px">${esc(r.descricao||"")}</textarea></label>
      <label class="f full">Situação da cobrança<select id="isc">${SIT_COBRANCA.map(s=>`<option${s==="Não se aplica"?" selected":""}>${s}</option>`).join("")}</select></label>
    </div>
    <details style="margin-top:12px"><summary class="small muted" style="cursor:pointer">Ver o texto lido do PDF</summary>
      <textarea readonly style="min-height:150px;font-size:11px;margin-top:8px">${esc(r.bruto||"")}</textarea></details>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="okImp">Criar OS</button>`});
  $("#cadCliPdf")&&($("#cadCliPdf").onclick=ev=>{ev.preventDefault();CLI_PREFILL=r;closeModal();location.hash="#/clientes/novo";});
  $("#okImp").onclick=()=>{
    const num=$("#inum").value.trim();
    if(!$("#icli").value)return toast("Selecione um cliente (ou cadastre o cliente do PDF pelo link acima).");
    if(!num)return toast("Informe o número da OS.");
    if(DB.ordens.some(o=>ativo(o)&&o.numeroBling.toLowerCase()===num.toLowerCase()))return toast("Já existe uma OS com esse número.");
    const dt=$("#idata").value?new Date($("#idata").value+"T09:00:00").toISOString():nowISO();
    const n={id:uid("os"),numeroBling:num,criadaEm:dt,clienteId:$("#icli").value,descricao:$("#idesc").value.trim()||"(sem descrição)",status:"aberta",equipamentoId:null,tipoAtendimento:null,situacaoCobranca:$("#isc").value,origem:"pdf",arquivoPdf:fileName,textoImportado:(r.bruto||"").slice(0,4000)};
    DB.ordens.unshift(n);
    if(dataUrl&&dataUrl.length<6*1024*1024){try{saveFotoLocal("ospdf_"+n.id,dataUrl);}catch(e){}}
    audit("Importação","OS",n.id,"PDF: "+fileName);persist();closeModal();toast("OS "+num+" importada do PDF.");location.hash="#/os/"+n.id;
  };
}
function osDetalhe(v,id){
  const o=byId("ordens",id);if(!o||!ativo(o))return v.innerHTML='<div class="alertbox crit">OS não encontrada.</div>';
  const mnt=DB.manutencoes.find(m=>ativo(m)&&m.osId===id);
  const eqsCli=DB.equipamentos.filter(e=>ativo(e)&&e.clienteId===o.clienteId);
  const j=jornadaAberta();
  const osExt=CFG().osExterna||"";
  v.innerHTML=`<a class="btn ghost sm" href="#/os">← Ordens de Serviço</a>
  <div class="pagehead between"><div><h1>${esc(o.numeroBling)}</h1><p>${esc(cliNome(o.clienteId))} · aberta ${fmtDate(o.criadaEm)} · ${osStatusPill(o.status)}</p></div>
    <div class="actionbar">
      ${can("editar")?`<button class="btn sm" id="edos">Editar</button>`:""}
      ${can("excluir","ordens")?`<button class="btn sm danger" id="delos">Excluir</button>`:""}
    </div></div>
  <div class="alertbox info" style="margin-bottom:16px"><span>ℹ</span><div>${
    o.origem==="pdf"?`OS importada do PDF <b>${esc(o.arquivoPdf||"")}</b>. Os campos foram lidos automaticamente — confira antes de atender.${getFotoLocal("ospdf_"+o.id)?' <a href="#" id="verpdf">Abrir PDF original</a>':""}`
    :o.origem==="manual"||o.origem==="exemplo"?`OS cadastrada manualmente${osExt?" (sem integração "+esc(osExt)+")":""}. O número <b>${esc(o.numeroBling)}</b> é apenas referência.`
    :`OS oficial${osExt?" no "+esc(osExt):" no sistema externo"}. O app não cria uma segunda OS — apenas relaciona o histórico técnico a <b>${esc(o.numeroBling)}</b>.`}</div></div>
  <div class="detailgrid two">
    <div class="stack">
      <div class="panel"><div class="ph"><h3>Vínculo técnico</h3></div><div class="pb" style="padding:16px">
        <div class="stepper">
          <span class="s ${o.equipamentoId?"done":"on"}">1 · Equipamento/NS</span>
          <span class="s ${o.tipoAtendimento?"done":o.equipamentoId?"on":""}">2 · Tipo de atendimento</span>
          <span class="s ${mnt?"done":o.tipoAtendimento?"on":""}">3 · Iniciar atendimento</span>
        </div>
        <div class="formgrid">
          <label class="f">Cliente da OS<input value="${esc(cliNome(o.clienteId))}" disabled></label>
          <label class="f">Equipamento / NS
            <select id="eq"${!can("criar")?" disabled":""}><option value="">Selecionar…</option>${eqsCli.map(e=>`<option value="${e.id}"${o.equipamentoId===e.id?" selected":""}>${esc(e.ns)} · ${esc(e.modelo)}</option>`).join("")}</select></label>
          <label class="f">Tipo de atendimento
            <select id="ta"${!can("criar")?" disabled":""}><option value="">Selecionar…</option>${Object.entries(TIPOS_ATEND).map(([k,val])=>`<option value="${k}"${o.tipoAtendimento===k?" selected":""}>${val}</option>`).join("")}</select></label>
          <label class="f">Situação da cobrança
            <select id="sc"${!can("criar")?" disabled":""}>${SIT_COBRANCA.map(s=>`<option${o.situacaoCobranca===s?" selected":""}>${s}</option>`).join("")}</select></label>
        </div>
        <div id="nseqalert"></div>
        <div class="actionbar" style="margin-top:14px">
          ${can("criar")?`<button class="btn" id="savevinc">Salvar vínculo</button>`:""}
          ${can("criar")&&!mnt?`<button class="btn primary" id="iniciar">Iniciar atendimento →</button>`:""}
          ${mnt?`<a class="btn primary" href="#/manutencoes/${mnt.id}">Abrir manutenção</a>`:""}
        </div>
        ${!j&&can("criar")?`<p class="small muted" style="margin-top:8px">Sem jornada aberta — <a href="#/jornada">inicie a jornada</a> antes de iniciar o atendimento.</p>`:""}
      </div></div>
      ${mnt?`<div class="panel"><div class="ph"><h3>Manutenção vinculada</h3></div><div class="list">
        <a class="item" href="#/manutencoes/${mnt.id}"><div><div class="t">${esc(mnt.servico||mnt.problema||"Registro de manutenção")}</div><div class="d">${esc(tecNome(mnt.tecnicoId))} · ${fmtDT(mnt.criadaEm)}</div></div><span class="sp"></span><span class="pill ${mnt.status==="encerrada"?"good":"warn"}">${esc(mnt.finalizacao||"Em aberto")}</span></a>
      </div></div>`:""}
    </div>
    <div class="card pad"><h3 style="margin-bottom:10px">OS (Bling)</h3>
      <dl class="kv"><dt>Número</dt><dd class="mono">${esc(o.numeroBling)}</dd><dt>Cliente</dt><dd>${esc(cliNome(o.clienteId))}</dd><dt>Aberta em</dt><dd>${fmtDate(o.criadaEm)}</dd><dt>Status</dt><dd>${o.status}</dd></dl>
      <p class="small" style="margin-top:10px">${esc(o.descricao)}</p>
    </div>
  </div>`;
  const vp=v.querySelector("#verpdf");
  if(vp)vp.onclick=e=>{e.preventDefault();try{const u=URL.createObjectURL(dataUrlParaBlob(getFotoLocal("ospdf_"+o.id)));window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),60000);}catch(err){toast("Não foi possível abrir o PDF.");}};
  const eqSel=v.querySelector("#eq");
  const checkNs=()=>{
    const al=v.querySelector("#nseqalert");
    if(eqSel&&!eqSel.value&&eqsCli.length===0)al.innerHTML='<div class="alertbox" style="margin-top:12px"><span>!</span><div>Equipamento ainda não cadastrado para este cliente. <a href="#/equipamentos/novo">Cadastrar NS</a>.</div></div>';
    else al.innerHTML="";
  };
  checkNs();eqSel&&(eqSel.onchange=checkNs);
  v.querySelector("#savevinc")&&(v.querySelector("#savevinc").onclick=()=>{
    o.equipamentoId=eqSel.value||null;o.tipoAtendimento=v.querySelector("#ta").value||null;o.situacaoCobranca=v.querySelector("#sc").value;
    audit("Edição","OS",o.id,"vínculo técnico");persist();toast("Vínculo salvo.");router();
  });
  v.querySelector("#iniciar")&&(v.querySelector("#iniciar").onclick=()=>{
    if(!eqSel.value)return toast("Selecione o equipamento/NS.");
    if(!v.querySelector("#ta").value)return toast("Confirme o tipo de atendimento.");
    if(!j)return toast("Inicie a jornada primeiro.");
    o.equipamentoId=eqSel.value;o.tipoAtendimento=v.querySelector("#ta").value;o.situacaoCobranca=v.querySelector("#sc").value;o.status="em_atendimento";
    const m={id:uid("mnt"),criadaEm:nowISO(),osId:o.id,numeroBlingRef:o.numeroBling,clienteId:o.clienteId,equipamentoId:o.equipamentoId,tecnicoId:j.tecnicoId||VIEWER.userId,veiculoId:j.veiculoId,jornadaId:j.id,tipoAtendimento:o.tipoAtendimento,problema:o.descricao||"",diagnostico:"",servico:"",testes:{},medicoes:{},pecas:[],fotos:[],obs:"",finalizacao:"",proximaAcao:"nenhuma",proximaData:null,status:"aberta",horaInicio:nowISO()};
    DB.manutencoes.unshift(m);
    j.eventos=j.eventos||[];j.eventos.push({tipo:"atend_inicio",ts:nowISO(),ref:o.numeroBling});
    audit("Criação","Manutenção",m.id,"OS "+o.numeroBling);persist();location.hash="#/manutencoes/"+m.id;
  });
  v.querySelector("#edos")&&(v.querySelector("#edos").onclick=()=>osForm(o));
  v.querySelector("#delos")&&(v.querySelector("#delos").onclick=()=>excluir("ordens",id,"Ordem de Serviço",()=>location.hash="#/os"));
}
function osForm(o){
  modal({title:"Editar OS",body:`<div class="formgrid">
    <label class="f">Número da OS<input id="on" class="mono" value="${esc(o.numeroBling)}"></label>

  </div>`,footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="oksavos">Salvar</button>`});
  $("#oksavos").onclick=()=>{

    if(DB.ordens.some(x=>x.id!==o.id&&ativo(x)&&x.numeroBling.toLowerCase()===num.toLowerCase()))return toast("Já existe OS com esse número.");

  };
}

/* ============ MANUTENÇÕES ============ */
ROUTES.manutencoes=(v,rest)=>{
  if(rest[0])return mntDetalhe(v,rest[0]);
  let vis="equipamento",q="";
  const draw=()=>{
    let list=DB.manutencoes.filter(ativo).sort((a,b)=>new Date(b.criadaEm)-new Date(a.criadaEm));
    if(q)list=list.filter(m=>[eqNome(m.equipamentoId),cliNome(m.clienteId),m.numeroBlingRef,m.problema,m.servico].join(" ").toLowerCase().includes(q.toLowerCase()));
    v.querySelector("#mlist").innerHTML=list.map(m=>`
      <a class="item" href="#/manutencoes/${m.id}"><span class="avatar">${vis==="cliente"?esc(cliNome(m.clienteId)[0]):"NS"}</span>
      <div><div class="t">${vis==="cliente"?esc(cliNome(m.clienteId)):esc(eqNome(m.equipamentoId))}</div>
      <div class="d">${vis==="cliente"?esc(eqNome(m.equipamentoId)):esc(cliNome(m.clienteId))} · OS ${esc(m.numeroBlingRef||"—")} · ${fmtDate(m.criadaEm)}</div></div>
      <span class="sp"></span>${tipoAtendPill(m.tipoAtendimento)}<span class="pill ${m.status==="encerrada"?"good":"warn"}">${esc(m.finalizacao||"Em aberto")}</span></a>`).join("")||'<div class="emptyst">Nenhuma manutenção.</div>';
  };
  v.innerHTML=`<div class="pagehead"><h1>Manutenções</h1><p>Existe um único evento de manutenção. A mesma lista pode ser lida pela ótica do equipamento (só aquele NS) ou do cliente (todos os equipamentos). Nunca duplicado.</p></div>
  <div class="between" style="margin-bottom:12px">
    <div class="chips"><button class="chip on" data-v="equipamento">Ótica do equipamento</button><button class="chip" data-v="cliente">Ótica do cliente</button></div>
    <div class="searchbar" style="max-width:280px"><span class="ic">⌕</span><input id="q" placeholder="Buscar…"></div>
  </div>
  <div class="panel"><div class="list" id="mlist"></div></div>`;
  v.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{v.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");vis=c.dataset.v;draw();});
  v.querySelector("#q").oninput=e=>{q=e.target.value;draw();};
  draw();
};
function relatorioManutencaoTexto(m){
  const eq=byId("equipamentos",m.equipamentoId);
  const L=[];
  L.push("RELATÓRIO DE MANUTENÇÃO");
  L.push("");
  L.push("Cliente: "+cliNome(m.clienteId));
  L.push("Equipamento: NS "+(eq?.ns||"—")+(eq?.modelo?" — "+eq.modelo:""));
  if(m.numeroBlingRef)L.push("OS: "+m.numeroBlingRef);
  L.push("Data: "+fmtDate(m.criadaEm));
  L.push("Técnico: "+tecNome(m.tecnicoId));
  if(m.equipe&&m.equipe.length)L.push("Equipe de apoio: "+tecNomes(m.equipe));
  L.push("Tipo de atendimento: "+(TIPOS_ATEND[m.tipoAtendimento]||"—"));
  L.push("");
  L.push("Problema relatado: "+(m.problema||"—"));
  L.push("Diagnóstico: "+(m.diagnostico||"—"));
  L.push("Serviço realizado: "+(m.servico||"—"));
  const testes=Object.entries(m.testes||{}).filter(([,x])=>x).map(([k,x])=>"  - "+((DB.camposTecnicos.find(c=>c.id===k)||{}).nome||k)+": "+x)
    .concat((m.testesExtra||[]).filter(t=>t.valor).map(t=>"  - "+t.nome+": "+t.valor));
  if(testes.length){L.push("","Testes:");L.push(...testes);}
  const med=Object.entries(m.medicoes||{}).filter(([,x])=>x).map(([k,x])=>"  - "+k+": "+x);
  if(med.length){L.push("","Medições:");L.push(...med);}
  const pc=(m.pecas||[]).map(p=>"  - "+((byId("produtos",p.produtoId)||{}).descricao||"Peça")+" (x"+p.qtd+")");
  if(pc.length){L.push("","Peças/materiais utilizados:");L.push(...pc);}
  if(m.obs)L.push("","Observações: "+m.obs);
  L.push("");
  L.push("Finalização: "+(m.finalizacao||"—"));
  if(m.proximaAcao&&m.proximaAcao!=="nenhuma")L.push("Próxima ação: "+(PROX_ACOES[m.proximaAcao]||m.proximaAcao)+(m.proximaData?" — "+fmtDate(m.proximaData):""));
  L.push("","—","Relatório gerado pelo Banheza Assist.");
  return L.join("\n");
}
function emailManutencao(m){
  const cli=byId("clientes",m.clienteId),eq=byId("equipamentos",m.equipamentoId);
  const assunto="Relatório de manutenção"+(eq?.ns?" — NS "+eq.ns:"")+(m.numeroBlingRef?" — OS "+m.numeroBlingRef:"");
  const corpo=relatorioManutencaoTexto(m);
  modal({title:"Enviar relatório por e-mail",wide:true,body:`
    <label class="f">Para (e-mail do cliente)<input id="mailto" type="email" value="${esc(cli?.email||"")}" placeholder="cliente@exemplo.com"></label>
    <p class="small muted" style="margin:12px 0 4px">Prévia — abre o app de e-mail do celular com tudo preenchido; é só revisar e enviar.</p>
    <textarea readonly style="min-height:220px;font-size:12px" id="mailprev">${esc(assunto)}\n\n${esc(corpo)}</textarea>`,
    footer:`<button class="btn" onclick="closeModal()">Fechar</button><button class="btn" id="mailcopy">Copiar texto</button><button class="btn primary" id="mailgo">Abrir e-mail</button>`});
  $("#mailgo").onclick=()=>{
    const dest=$("#mailto").value.trim();
    const href="mailto:"+encodeURIComponent(dest)+"?subject="+encodeURIComponent(assunto)+"&body="+encodeURIComponent(corpo);
    audit("E-mail","Manutenção",m.id,"relatório para "+(dest||"cliente"));persist();
    location.href=href;closeModal();
  };
  $("#mailcopy").onclick=()=>{const t=$("#mailprev");t.select();try{document.execCommand("copy");}catch(e){}navigator.clipboard&&navigator.clipboard.writeText(assunto+"\n\n"+corpo).catch(()=>{});toast("Texto copiado.");};
}

        <div class="formgrid" id="medicoes">
          ${[...new Set([...medDefs,...Object.keys(m.medicoes||{})])].map(k=>`<label class="f">${esc(k)}<input data-m="${esc(k)}" ${readonly?"disabled":""} value="${esc(m.medicoes?.[k]||"")}"></label>`).join("")}
        </div>`:""}

        </div>

      <div class="card pad">

          <dt>Tipo</dt><dd>${esc(TIPOS_ATEND[m.tipoAtendimento]||"—")}</dd>
          <dt>Técnico</dt><dd>${esc(tecNome(m.tecnicoId))}</dd>

      <td class="tnum">${p.qtd}</td>
      <td>${p.baixa==="automatica"?'<span class="pill">automática</span>':p.aprovada?'<span class="pill good">aprovada</span>':'<span class="pill warn">aguarda aprovação</span>'}</td>
      <td>${!readonly?`${p.baixa==="aprovacao"&&!p.aprovada&&can("editar")?`<button class="btn sm" data-aprova="${ix}">Aprovar</button> `:""}<button class="btn sm danger" data-rmpeca="${ix}">×</button>`:""}</td></tr>`;
    }).join("")||'<tr><td colspan="4" class="muted">Nenhuma peça.</td></tr>';
    v.querySelectorAll("[data-rmpeca]").forEach(b=>b.onclick=()=>{m.pecas.splice(+b.dataset.rmpeca,1);persist();renderPecas();});
    v.querySelectorAll("[data-aprova]").forEach(b=>b.onclick=()=>{const p=m.pecas[+b.dataset.aprova];p.aprovada=true;const pr=byId("produtos",p.produtoId);if(pr)pr.estoque=Math.max(0,pr.estoque-p.qtd);audit("Aprovação","Peça",m.id,pr?.descricao);persist();renderPecas();toast("Baixa aprovada.");});
  };
  renderPecas();

  // fotos render
  const renderFotos=()=>{
    const groups={antes:[],durante:[],depois:[]};
    (m.fotos||[]).forEach((f,ix)=>groups[f.grupo||"durante"].push({...f,ix}));
    v.querySelector("#fotos").innerHTML=Object.entries(groups).map(([g,arr])=>arr.length?`<div class="photogroup">${g}</div>`+arr.map(f=>{

      const cell=d?`<img src="${d}" alt="${g}">`:`<div style="width:74px;height:74px;border-radius:var(--radius-sm);border:1px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:10px;color:var(--ink-3)">foto em outro<br>dispositivo</div>`;

    }).join(""):"").join("")||'<span class="small muted">Sem fotos.</span>';

  };
  renderExtra();

  if(!readonly){
    const collect=()=>{
      m.problema=v.querySelector("#problema").value.trim();
      m.diagnostico=v.querySelector("#diagnostico").value.trim();
      m.servico=v.querySelector("#servico").value.trim();
      m.obs=v.querySelector("#obs").value.trim();

      m.proximaAcao=v.querySelector("#proximaAcao").value;
      m.proximaData=v.querySelector("#proximaData").value||null;
      m.equipe=[...v.querySelectorAll("[data-eq]:checked")].map(i=>i.dataset.eq);
    };
    v.querySelectorAll("[data-eq]").forEach(i=>i.onchange=()=>{
      m.equipe=[...v.querySelectorAll("[data-eq]:checked")].map(x=>x.dataset.eq);
      audit("Edição","Manutenção",m.id,"equipe: "+(tecNomes(m.equipe)||"—"));persist();
    });

    };
    v.querySelector("#addPeca").onclick=()=>addPecaModal(m,renderPecas);

      });
    });
    v.querySelector("#salvarRasc").onclick=()=>{collect();m.status="aberta";persist();audit("Edição","Manutenção",m.id,"rascunho");toast("Rascunho salvo.");};
    v.querySelector("#encerrar").onclick=()=>{
      collect();
      if(!m.finalizacao)return toast("Selecione o status de finalização.");
      m.status="encerrada";m.horaFim=nowISO();
      // baixa automática de peças
      (m.pecas||[]).forEach(p=>{if(p.baixa==="automatica"&&!p.baixado){const pr=byId("produtos",p.produtoId);if(pr)pr.estoque=Math.max(0,pr.estoque-p.qtd);p.baixado=true;}});
      // atualiza OS
      const o=byId("ordens",m.osId);
      if(o){
        if(m.finalizacao==="Aguardando peça"){o.status="aguardando_peca";criarSolicitacaoAguardandoPeca(m);}
        else if(m.finalizacao==="Necessita retorno"||m.proximaAcao==="retorno")o.status="aguardando_retorno";
        else if(m.finalizacao==="Aguardando cliente")o.status="aguardando_retorno";
        else o.status="encerrada";
      }
      // jornada evento
      const j=byId("jornadas",m.jornadaId);if(j){j.eventos=j.eventos||[];j.eventos.push({tipo:"atend_fim",ts:nowISO(),ref:m.numeroBlingRef});}
      audit("Encerramento","Manutenção",m.id,m.finalizacao);persist();toast("Atendimento encerrado.");router();
    };
  }
  v.querySelector("#reabrir")&&(v.querySelector("#reabrir").onclick=()=>{m.status="aberta";const o=byId("ordens",m.osId);if(o)o.status="em_atendimento";audit("Reabertura","Manutenção",m.id);persist();router();});
  v.querySelector("#emailrel").onclick=()=>emailManutencao(m);
  v.querySelector("#delmnt")&&(v.querySelector("#delmnt").onclick=()=>excluir("manutencoes",id,"Manutenção",()=>location.hash="#/manutencoes"));
  // hint
  const fh=v.querySelector("#finalHint");
  const upd=()=>{const val=v.querySelector("#finalizacao")?.value;if(val==="Aguardando peça")fh.innerHTML='<div class="alertbox" style="margin-top:10px"><span>!</span><div>A OS ficará <b>Aguardando peça</b> e uma solicitação de peça será aberta.</div></div>';else fh.innerHTML="";};
  v.querySelector("#finalizacao")&&(v.querySelector("#finalizacao").onchange=upd,upd());
}

      <label class="f" style="max-width:110px">Quantidade<input id="pqtd" type="number" value="1" min="1"></label>
      <label class="f">Baixa de estoque<select id="pbaixa"><option value="automatica">Automática</option><option value="aprovacao">Mediante aprovação</option></select></label>
    </div>
    <p class="small muted" id="psel">Selecione um produto.</p>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="okpeca" disabled>Adicionar</button>`});
  let sel=null;
  const drawP=q=>{
    const list=DB.produtos.filter(ativo).filter(p=>!q||[p.codigo,p.descricao,p.referencia,p.barras].join(" ").toLowerCase().includes(q.toLowerCase()));
    $("#plist").innerHTML=list.map(p=>`<button class="item" style="width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2)" data-p="${p.id}">
      <div><div class="t">${esc(p.descricao)}</div><div class="d mono">${esc(p.codigo)} · ref ${esc(p.referencia)} · barras ${esc(p.barras)}</div></div>
      <span class="sp"></span><span class="pill ${p.estoque<=p.minimo?"crit":"good"}">estoque ${p.estoque}</span></button>`).join("")||'<div class="emptyst small">Nada encontrado.</div>';
    $("#plist").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
      sel=byId("produtos",b.dataset.p);
      $("#plist").querySelectorAll("[data-p]").forEach(x=>x.style.background="");b.style.background="var(--accent-soft)";
      $("#okpeca").disabled=false;
      $("#psel").innerHTML=`Selecionado: <b>${esc(sel.descricao)}</b> · estoque atual ${sel.estoque}`+(sel.estoque<=0?' · <span style="color:var(--crit)">sem estoque — registro permitido, gera solicitação</span>':"");
    });
  };
  drawP("");
  $("#pq").oninput=e=>drawP(e.target.value);
  $("#pscan").onclick=()=>abrirScanner({titulo:"Ler código de barras",dica:"Aponte para o código de barras da peça.",onLer:txt=>{
    if(!txt)return toast("Nada foi lido.");
    $("#pq").value=txt;drawP(txt);
    const achou=DB.produtos.filter(ativo).filter(p=>[p.codigo,p.referencia,p.barras].join(" ").toLowerCase().includes(txt.toLowerCase()));
    toast(achou.length?"Código lido — "+achou.length+" resultado(s).":"Código "+txt+" — nenhum produto com esse código.");
  }});
  $("#okpeca").onclick=()=>{
    const qtd=Math.max(1,+$("#pqtd").value||1);const baixa=$("#pbaixa").value;
    m.pecas=m.pecas||[];m.pecas.push({produtoId:sel.id,qtd,baixa,aprovada:baixa==="automatica"});
    if(baixa==="automatica"&&sel.estoque>0){/* baixa efetiva no encerramento */}
    if(sel.estoque<=0){DB.solicitacoesPeca.unshift({id:uid("sol"),criadaEm:nowISO(),produtoNome:sel.descricao,qtd,osRef:m.numeroBlingRef,equipamentoId:m.equipamentoId,motivo:"Sem estoque durante o atendimento.",status:"pendente"});toast("Peça sem estoque — solicitação aberta.");}
    audit("Uso de peça","Manutenção",m.id,sel.descricao+" x"+qtd);persist();closeModal();cb();
  };
}
function criarSolicitacaoAguardandoPeca(m){
  if(DB.solicitacoesPeca.some(s=>ativo(s)&&s.osRef===m.numeroBlingRef&&s.status==="pendente"))return;
  DB.solicitacoesPeca.unshift({id:uid("sol"),criadaEm:nowISO(),produtoNome:"(a definir — atendimento encerrado como Aguardando peça)",qtd:1,osRef:m.numeroBlingRef,equipamentoId:m.equipamentoId,motivo:"Manutenção encerrada aguardando peça.",status:"pendente"});
}

let WJ=null; // estado do assistente de início de jornada
ROUTES.jornada=(v,rest)=>{
  if(rest[0])return jornadaDetalhe(v,rest[0]);

    <p class="small muted" style="margin:6px 0 18px">Comece o dia registrando de onde você saiu, o veículo e o KM.</p>

  </div>

      <a class="item" href="#/jornada/${j.id}"><div><div class="t">${fmtDate(j.criadaEm)} · ${esc(veiNome(j.veiculoId))}</div>
      <div class="d">${km((j.kmFinal||0)-(j.kmInicial||0))} · ${(j.eventos||[]).filter(e=>e.tipo==="chegada").length} visitas</div></div>
      <span class="sp"></span><span class="pill good">encerrada</span></a>`).join("")||'<div class="emptyst small">Nenhuma jornada anterior.</div>'}</div>

  v.querySelector("#abrirWiz").onclick=()=>{
    WJ={passo:1,origem:"",tecnicoId:VIEWER.userId,papel:"",equipe:[],veiculoId:"",kmInicial:"",fotoFile:null};
