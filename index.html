const WIZ_PASSOS=["Local de partida","Técnico","Função","Veículo e KM","Confirmar"];
function wizardJornada(v){
  const w=WJ, tecs=DB.tecnicos.filter(ativo), veics=DB.veiculos.filter(x=>ativo(x)&&x.situacao==="Ativo");
  let body="";
  if(w.passo===1){
    body=`<p class="wizq">De onde você está saindo agora?</p><div class="wizopts">
      <button class="wizopt${w.origem==="empresa"?" sel":""}" data-o="empresa">Saí da empresa<span class="k">Passo pela empresa antes do 1º cliente</span></button>
      <button class="wizopt${w.origem==="residencia"?" sel":""}" data-o="residencia">Saí de casa<span class="k">Vou direto ao 1º cliente</span></button></div>`;
  } else if(w.passo===2){
    body=`<p class="wizq">Quem é o técnico responsável?</p><div class="wizopts">${tecs.map(t=>`<button class="wizopt${w.tecnicoId===t.id?" sel":""}" data-t="${t.id}">${esc(t.nome)}<span class="k">${esc(PAPEIS[t.papel]?.nome||t.papel||"")}</span></button>`).join("")}</div>`;
  } else if(w.passo===3){
    const outros=tecs.filter(t=>t.id!==w.tecnicoId);
    body=`<p class="wizq">Qual a função nesta viagem?</p><div class="wizopts">
      <button class="wizopt${w.papel==="motorista"?" sel":""}" data-p="motorista">Motorista<span class="k">Dirige o veículo</span></button>
      <button class="wizopt${w.papel==="passageiro"?" sel":""}" data-p="passageiro">Passageiro / técnico<span class="k">Vai como técnico, não dirige</span></button></div>
      ${outros.length?`<p class="wizq" style="margin-top:22px;font-size:16px">Foi outro técnico junto?</p><div class="wizopts">${outros.map(t=>`<button class="wizopt${w.equipe.includes(t.id)?" sel":""}" data-eq="${t.id}">${esc(t.nome)}<span class="k">${w.equipe.includes(t.id)?"Na equipe desta jornada — toque p/ tirar":"Toque para incluir"}</span></button>`).join("")}</div>`:""}`;
  } else if(w.passo===4){
    body=`<p class="wizq">Qual veículo e o KM de agora?</p>
      <div class="wizopts" style="margin-bottom:14px">${veics.map(x=>`<button class="wizopt${w.veiculoId===x.id?" sel":""}" data-v="${x.id}">${esc(x.placa)} · ${esc(x.marcaModelo)}<span class="k">Último KM registrado: ${km(x.kmAtual)}</span></button>`).join("")||'<div class="emptyst small">Nenhum veículo ativo cadastrado.</div>'}</div>
      <label class="f">KM no painel agora<input id="wizKm" type="number" inputmode="numeric" value="${esc(w.kmInicial)}" placeholder="Ex: 84520"></label>
      <label class="f" style="margin-top:12px">Foto do painel (opcional)<input id="wizFoto" type="file" accept="image/*"></label>`;
  } else {
    const t=byId("tecnicos",w.tecnicoId), x=byId("veiculos",w.veiculoId);
    body=`<p class="wizq">Confira antes de iniciar</p><div class="wizsummary">
      <div class="r"><span>Saída</span><b>${w.origem==="empresa"?"Da empresa":"De casa (direto ao cliente)"}</b></div>
      <div class="r"><span>Técnico</span><b>${esc(t?.nome||"—")}</b></div>
      <div class="r"><span>Função</span><b>${w.papel==="motorista"?"Motorista":"Passageiro / técnico"}</b></div>
      ${w.equipe.length?`<div class="r"><span>Equipe junto</span><b>${esc(tecNomes(w.equipe))}</b></div>`:""}
      <div class="r"><span>Veículo</span><b>${esc(x?x.placa+" · "+x.marcaModelo:"—")}</b></div>
      <div class="r"><span>KM inicial</span><b>${w.kmInicial?(+w.kmInicial).toLocaleString("pt-BR"):"—"}</b></div></div>
      <p class="small muted" style="margin-top:10px">Ao iniciar, você já escolhe a OS do primeiro atendimento.</p>`;
  }
  const pode = w.passo===1?!!w.origem : w.passo===2?!!w.tecnicoId : w.passo===3?!!w.papel : w.passo===4?(!!w.veiculoId&&+w.kmInicial>0) : true;
  v.innerHTML=`<div class="pagehead between"><h1>Iniciar jornada</h1><button class="btn ghost sm" id="wizCancel">Cancelar</button></div>
    <div class="card pad">
      <div class="wizprog">Passo ${w.passo} de 5 · ${WIZ_PASSOS[w.passo-1]}</div>
      ${body}
      <div class="wiznav">
        <button class="btn" id="wizBack"${w.passo===1?" disabled":""}>Voltar</button>
        ${w.passo<5?`<button class="btn primary" id="wizNext"${pode?"":" disabled"}>Continuar</button>`:`<button class="btn primary" id="wizFinish">Iniciar jornada</button>`}
      </div>
    </div>`;
  const re=()=>wizardJornada(v);
  v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{w.origem=b.dataset.o;re();});
  v.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{w.tecnicoId=b.dataset.t;w.equipe=w.equipe.filter(id=>id!==b.dataset.t);re();});
  v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{w.papel=b.dataset.p;re();});
  v.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>{const id=b.dataset.eq;w.equipe=w.equipe.includes(id)?w.equipe.filter(x=>x!==id):[...w.equipe,id];re();});
  v.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const x=byId("veiculos",b.dataset.v);w.veiculoId=b.dataset.v;if(x&&!(+w.kmInicial>0))w.kmInicial=x.kmAtual;re();});
  const kmIn=v.querySelector("#wizKm");if(kmIn)kmIn.oninput=e=>{w.kmInicial=e.target.value;const n=v.querySelector("#wizNext");if(n)n.disabled=!(w.veiculoId&&+w.kmInicial>0);};
  const foto=v.querySelector("#wizFoto");if(foto)foto.onchange=e=>{w.fotoFile=e.target.files[0]||null;};
  v.querySelector("#wizCancel").onclick=()=>{WJ=null;router();};
  v.querySelector("#wizBack").onclick=()=>{ if(w.passo>1){w.passo--;re();} };
  const nx=v.querySelector("#wizNext");if(nx)nx.onclick=()=>{ if(pode){w.passo++;re();} };
  const fn=v.querySelector("#wizFinish");if(fn)fn.onclick=()=>{
    const j={id:uid("jor"),criadaEm:nowISO(),tecnicoId:w.tecnicoId,papel:w.papel,equipe:w.equipe.slice(),veiculoId:w.veiculoId,kmInicial:+w.kmInicial,kmFinal:null,origem:w.origem,status:"aberta",eventos:[{tipo:"login",ts:nowISO()}]};
    const go=()=>{DB.jornadas.unshift(j);audit("Início","Jornada",j.id);WJ=null;persist();toast("Jornada iniciada. Escolha a OS do primeiro atendimento.");location.hash="#/os";};
    if(w.fotoFile)compressImg(w.fotoFile,d=>{saveFotoLocal("painel_"+j.id,d);j.fotoPainelId="painel_"+j.id;go();});
    else go();
  };
}
const EVT_LABEL={login:"Login / início da jornada",desloc_inicio:"Início de deslocamento",chegada:"Chegada ao cliente",atend_inicio:"Início do atendimento",atend_fim:"Fim do atendimento",almoco_inicio:"Início do almoço",almoco_fim:"Fim do almoço",retorno:"Retorno à empresa",encerramento:"Encerramento da jornada",pausa:"Pausa"};
function jornadaDetalhe(v,id){
  const j=byId("jornadas",id);if(!j||!ativo(j))return v.innerHTML='<div class="alertbox crit">Jornada não encontrada.</div>';
  const aberta=j.status==="aberta";
  const vei=byId("veiculos",j.veiculoId);
  const mnts=DB.manutencoes.filter(m=>ativo(m)&&m.jornadaId===id);
  const evs=(j.eventos||[]);
  const last=evs[evs.length-1]?.tipo;
  const emAlmoco=last==="almoco_inicio";
  const add=(tipo,extra)=>{j.eventos.push({tipo,ts:nowISO(),...(extra||{})});audit("Evento","Jornada",id,EVT_LABEL[tipo]);persist();router();};
  v.innerHTML=`<div class="between" style="margin-bottom:6px"><a class="btn ghost sm" href="#/jornada">← Jornada</a>

  <div class="pagehead between"><div><h1>Jornada · ${fmtDate(j.criadaEm)}</h1>
    <p>${esc(veiNome(j.veiculoId))} · ${esc(tecNome(j.tecnicoId))} (${esc(j.papel||"—")})${j.equipe&&j.equipe.length?" + "+esc(tecNomes(j.equipe)):""} · origem ${esc(j.origem)}</p></div>
    <div>${aberta?'<span class="pill warn"><span class="dot"></span>em andamento</span>':'<span class="pill good">encerrada</span>'}</div></div>
  <div class="kpis" style="margin-bottom:18px">
    <div class="kpi"><div class="lab">KM inicial</div><div class="val tnum" style="font-size:20px">${j.kmInicial?.toLocaleString("pt-BR")||"—"}</div></div>
    <div class="kpi"><div class="lab">KM final</div><div class="val tnum" style="font-size:20px">${j.kmFinal?j.kmFinal.toLocaleString("pt-BR"):"—"}</div></div>
    <div class="kpi"><div class="lab">Percorrido</div><div class="val tnum" style="font-size:20px">${j.kmFinal?km(j.kmFinal-j.kmInicial):"—"}</div></div>
    <div class="kpi"><div class="lab">Visitas</div><div class="val tnum">${evs.filter(e=>e.tipo==="chegada").length}</div></div>
  </div>
  ${aberta?`<div class="card pad" style="margin-bottom:16px">
    <h3 style="margin-bottom:6px">Ações</h3>
    <p class="small muted" style="margin:0 0 12px">A chegada ao cliente é preferencialmente automática por evento/localização — o botão manual é contingência.</p>
    <div class="actionbar">
      <button class="btn" data-ev="desloc_inicio">Iniciar deslocamento</button>
      <button class="btn" data-ev="chegada">Registrar chegada (manual)</button>
      <button class="btn" data-ev="${emAlmoco?"almoco_fim":"almoco_inicio"}">${emAlmoco?"Fim do almoço":"Início do almoço"}</button>
      <button class="btn" data-ev="retorno">Retorno à empresa</button>
      <a class="btn primary" href="#/os">Selecionar OS / atender →</a>
    </div>
    <hr style="border:0;border-top:1px solid var(--line-2);margin:14px 0">
    <div class="row" style="align-items:flex-end">
      <label class="f" style="max-width:150px">KM final<input id="kmf" type="number" value="${vei?.kmAtual||""}"></label>
      <button class="btn primary" id="encerrarJ">Encerrar jornada</button>
    </div>
  </div>`:""}
  <div class="detailgrid two">
    <div class="panel"><div class="ph"><h3>Controle de horários</h3></div><div class="pb" style="padding:14px 16px">
      ${evs.length?`<div class="timeline">${evs.map(e=>`<div class="tl"><div class="when">${fmtTime(e.ts)}</div><div class="what">${esc(EVT_LABEL[e.tipo]||e.tipo)}${e.ref?` · <span class="mono">${esc(e.ref)}</span>`:""}</div></div>`).join("")}</div>`:'<div class="emptyst small">Sem eventos.</div>'}
      ${j.fotoPainelId&&getFotoLocal(j.fotoPainelId)?`<div style="margin-top:12px"><div class="photogroup">Painel</div><img src="${getFotoLocal(j.fotoPainelId)}" alt="Foto do painel" style="max-width:180px;border-radius:var(--radius-sm);border:1px solid var(--line)"></div>`:""}
    </div></div>
    <div class="panel"><div class="ph"><h3>Atendimentos da jornada</h3></div>
      <div class="list">${mnts.map(m=>`<a class="item" href="#/manutencoes/${m.id}"><div><div class="t">${esc(eqNome(m.equipamentoId))}</div><div class="d">${esc(cliNome(m.clienteId))} · OS ${esc(m.numeroBlingRef||"—")}</div></div><span class="sp"></span><span class="pill ${m.status==="encerrada"?"good":"warn"}">${esc(m.finalizacao||"em aberto")}</span></a>`).join("")||'<div class="emptyst small">Nenhum atendimento ainda.</div>'}</div>
    </div>
  </div>`;
  v.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>add(b.dataset.ev));
  v.querySelector("#deljor")&&(v.querySelector("#deljor").onclick=()=>excluir("jornadas",id,"Jornada",()=>location.hash="#/jornada"));
  v.querySelector("#encerrarJ")&&(v.querySelector("#encerrarJ").onclick=()=>{
    const kmf=+v.querySelector("#kmf").value;
    if(!kmf||kmf<j.kmInicial)return toast("KM final inválido.");
    if(mnts.some(m=>m.status!=="encerrada"))return toast("Há atendimento em aberto nesta jornada.");
    j.kmFinal=kmf;j.status="encerrada";j.eventos.push({tipo:"encerramento",ts:nowISO()});
    if(vei)vei.kmAtual=kmf;
    audit("Encerramento","Jornada",id,km(kmf-j.kmInicial));persist();toast("Jornada encerrada.");router();
  });
}

    <div id="dcomb" style="margin-top:12px">
      <div class="formgrid">
        <label class="f">Posto<input id="d_posto" value="${esc(d.posto||"")}"></label>
        <label class="f">Combustível<select id="d_comb">${["Gasolina","Etanol","Diesel","GNV"].map(c=>`<option${d.combustivel===c?" selected":""}>${c}</option>`).join("")}</select></label>

    </div>
    <div class="formgrid" style="margin-top:12px">
      <label class="f">Data / hora<input id="d_dh" type="datetime-local" value="${esc((d.dataHora||"").slice(0,16))}"></label>
      <label class="f">Valor total <span class="rq">*</span><input id="d_v" type="number" step="any" value="${esc(d.valorTotal??"")}"></label>
      <label class="f">Documento fiscal (opcional)<input id="d_doc" value="${esc(d.docFiscal||"")}"></label>

      <label class="f">Jornada (opcional)<select id="d_jor"><option value="">— nenhuma —</option>${DB.jornadas.filter(ativo).slice(0,12).map(j=>`<option value="${j.id}"${d.jornadaId===j.id?" selected":""}>${fmtDate(j.criadaEm)} · ${esc(byId("veiculos",j.veiculoId)?.placa||"")}</option>`).join("")}</select></label>
    </div>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="dok">Salvar</button>`});
  const sync=()=>{const c=$("#dcat").value;$("#dcomb").hidden=c!=="combustivel";$("#dger").hidden=c==="combustivel";};
  $("#dcat").onchange=sync;sync();
  const recalc=()=>{const l=+$("#d_l").value,p=+$("#d_p").value;if(l&&p)$("#d_v").value=(l*p).toFixed(2);};
  $("#d_l").oninput=recalc;$("#d_p").oninput=recalc;
  $("#dscan").onclick=()=>abrirScanner({
    titulo:"Ler QR Code da nota",
    dica:"Aponte para o QR Code da nota fiscal (NFC-e / cupom).",
    onLer:txt=>{
      if(!txt)return toast("Nada foi lido.");
      const chave=(txt.replace(/\D/g,"").match(/\d{44}/)||[])[0];
      $("#d_doc").value=chave||(txt.length>120?txt.slice(0,120)+"…":txt);
      if(chave){
        const aa=chave.slice(2,4),mm=chave.slice(4,6);
        if(+mm>=1&&+mm<=12&&!$("#d_dh").value)$("#d_dh").value=`20${aa}-${mm}-01T12:00`;
        toast("Chave da nota lida. Confira o valor e a data antes de salvar.");

  });
  $("#dok").onclick=()=>{
    const cat=$("#dcat").value,valor=+$("#d_v").value||0;

    else{base.descricao=$("#d_desc").value.trim()||CAT_DESPESA[cat].nome;base.posto="";base.litros=0;base.precoLitro=0;base.combustivel="";}
    if(d.id){Object.assign(d,base);audit("Edição","Despesa",d.id,CAT_DESPESA[cat].nome);}
    else{const n={id:uid("desp"),criadoEm:nowISO(),...base};DB.abastecimentos.unshift(n);audit("Criação","Despesa",n.id,CAT_DESPESA[cat].nome);}
    persist();closeModal();toast("Despesa salva.");router();
  };
}

  const kmTotal=DB.jornadas.filter(j=>ativo(j)&&j.kmFinal).reduce((s,j)=>s+(j.kmFinal-j.kmInicial),0);
  const custoPecas=DB.manutencoes.filter(ativo).flatMap(m=>m.pecas||[]).reduce((s,p)=>s+(byId("produtos",p.produtoId)?.custo||0)*p.qtd,0);
  const desp=DB.abastecimentos.filter(ativo);
  const custoComb=desp.filter(a=>(a.categoria||"combustivel")==="combustivel").reduce((s,a)=>s+(+a.valorTotal||0),0);
  const custoDesp=desp.reduce((s,a)=>s+(+a.valorTotal||0),0);
  const despPorCat={};desp.forEach(a=>{const c=a.categoria||"combustivel";despPorCat[c]=(despPorCat[c]||0)+(+a.valorTotal||0);});
  const maxDesp=Math.max(1,...Object.values(despPorCat));
  v.innerHTML=`<div class="pagehead"><h1>Indicadores</h1><p>Painel gerencial: veículo, KM, despesas, visitas, clientes, OS, equipamentos, peças e tempo.</p></div>
  <div class="kpis" style="margin-bottom:20px">
    <div class="kpi"><div class="lab">Manutenções (mês)</div><div class="val tnum">${i.mntMes.length}</div></div>
    <div class="kpi"><div class="lab">KM rodado (total)</div><div class="val tnum" style="font-size:20px">${km(kmTotal)}</div></div>
    <div class="kpi"><div class="lab">Custo de peças</div><div class="val" style="font-size:17px">${money(custoPecas)}</div></div>
    <div class="kpi"><div class="lab">Combustível</div><div class="val" style="font-size:17px">${money(custoComb)}</div></div>
    <div class="kpi"><div class="lab">Despesas (total)</div><div class="val" style="font-size:17px">${money(custoDesp)}</div></div>
    <div class="kpi ${i.estCrit.length?"crit":"good"}"><div class="lab">Estoque crítico</div><div class="val tnum">${i.estCrit.length}</div></div>
    <div class="kpi ${i.prevVenc.length?"crit":"good"}"><div class="lab">Preventivas vencidas</div><div class="val tnum">${i.prevVenc.length}</div></div>
  </div>
  <div class="card pad" style="margin-bottom:16px"><h3 style="margin-bottom:14px">Despesas por categoria</h3>
    ${Object.entries(despPorCat).sort((a,b)=>b[1]-a[1]).map(([k,val])=>`<div style="margin-bottom:10px"><div class="between small"><span>${esc(catDespNome(k))}</span><span class="tnum">${money(val)}</span></div>
    <div style="height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${val/maxDesp*100}%;background:var(--accent)"></div></div></div>`).join("")||'<p class="muted small">Nenhuma despesa registrada.</p>'}
  </div>
  <div class="detailgrid two">
    <div class="card pad"><h3 style="margin-bottom:14px">Manutenções por natureza do atendimento</h3>
      ${Object.entries(porTipo).map(([k,n])=>`<div style="margin-bottom:10px"><div class="between small"><span>${esc(TIPOS_ATEND[k]||k)}</span><span class="tnum">${n}</span></div>
      <div style="height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${n/maxTipo*100}%;background:var(--accent)"></div></div></div>`).join("")||'<p class="muted small">Sem dados.</p>'}
      <p class="small muted" style="margin-top:10px">Locação, assistência técnica, garantia e cortesia contabilizados separadamente.</p>
    </div>
    <div class="stack">
      <div class="card pad"><h3 style="margin-bottom:12px">Manutenções por mês</h3>
        <div style="display:flex;gap:10px;align-items:flex-end;height:120px">
          ${Object.entries(porMes).map(([k,n])=>{const mx=Math.max(...Object.values(porMes));return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end">
          <span class="small tnum">${n}</span><div style="width:100%;background:var(--accent-deep);border-radius:4px 4px 0 0;height:${n/mx*90}px"></div><span class="small muted">${esc(k)}</span></div>`;}).join("")}
        </div>
      </div>
      <div class="card pad"><h3 style="margin-bottom:10px">OS por status</h3>
        <dl class="kv">
          <dt>Abertas</dt><dd class="tnum">${i.osAbertas.length}</dd>
          <dt>Aguardando peça</dt><dd class="tnum">${i.osPeca.length}</dd>
          <dt>Aguardando retorno</dt><dd class="tnum">${i.osRetorno.length}</dd>
          <dt>Encerradas</dt><dd class="tnum">${DB.ordens.filter(o=>ativo(o)&&o.status==="encerrada").length}</dd>
        </dl>
      </div>
      <div class="card pad"><h3 style="margin-bottom:10px">Produtividade por técnico</h3>
        <dl class="kv">${DB.tecnicos.map(t=>`<dt>${esc(t.nome)}</dt><dd class="tnum">${DB.manutencoes.filter(m=>ativo(m)&&m.tecnicoId===t.id).length} mnt.</dd>`).join("")}</dl>
      </div>
    </div>
  </div>`;
};

/* ============ RELATÓRIOS ============ */
const REL_DEFS={
  manutencoes:{nome:"Manutenções por período",desc:"Todas as manutenções do período, com técnico, peças e custo.",filtros:["periodo","cliente","tecnico","tipo","status"]},
  os:{nome:"Ordens de Serviço",desc:"Situação e cobrança de cada ordem de serviço.",filtros:["periodo","cliente","statusOS"]},
  pecas:{nome:"Peças utilizadas e custo",desc:"Quanto foi gasto em peças, por período.",filtros:["periodo","cliente"]},
  jornadas:{nome:"Jornadas, KM e tempo",desc:"KM rodado, tempo e visitas por técnico.",filtros:["periodo","tecnico","veiculo"]},
  despesas:{nome:"Gastos & despesas",desc:"Combustível, alimentação, pedágio e outros gastos.",filtros:["periodo","veiculo"]},
  preventivas:{nome:"Preventivas de veículos",desc:"Vencimento das preventivas da frota.",filtros:["veiculo"]},
  atendimento:{nome:"Relatório de atendimento",desc:"Laudo de uma visita — sem custos, pronto para entregar.",filtros:["cliente","manutencao"],publico:"cliente"},
  prontuario:{nome:"Prontuário do equipamento",desc:"Histórico técnico completo de um equipamento.",filtros:["equipamento","periodo"],publico:"cliente"},
  cliente:{nome:"Histórico do cliente",desc:"Tudo o que foi feito para um cliente no período.",filtros:["cliente","periodo"],publico:"cliente"}
};
ROUTES.relatorios=(v)=>{
  const hoje=new Date();
  const st={
    tipo:"manutencoes",
    de:new Date(hoje.getFullYear(),0,1).toISOString().slice(0,10),
    ate:hoje.toISOString().slice(0,10),
    cliente:"",tecnico:"",tipoAtend:"",fin:"",statusOS:"",veiculo:"",equip:"",manut:""
  };
  let ultimo=null;

  const per=d=>{if(!d)return false;const x=String(d).slice(0,10);return x>=st.de&&x<=st.ate;};
  const usaPeriodo=()=>REL_DEFS[st.tipo].filtros.includes("periodo");
  const custoMnt=m=>(m.pecas||[]).reduce((s,p)=>s+(byId("produtos",p.produtoId)?.custo||0)*p.qtd,0);
  const dur=j=>{const e=j.eventos||[];const a=e[0]?.ts,b=(e.find(x=>x.tipo==="encerramento")||e[e.length-1])?.ts;if(!a||!b)return"—";const min=Math.round((new Date(b)-new Date(a))/60000);return(min/60|0)+"h"+String(min%60).padStart(2,"0");};

  const BUILDERS={
    manutencoes(){
      let r=DB.manutencoes.filter(ativo).filter(m=>per(m.criadaEm));
      if(st.cliente)r=r.filter(m=>m.clienteId===st.cliente);
      if(st.tecnico)r=r.filter(m=>m.tecnicoId===st.tecnico||(m.equipe||[]).includes(st.tecnico));
      if(st.tipoAtend)r=r.filter(m=>m.tipoAtendimento===st.tipoAtend);
      if(st.fin)r=r.filter(m=>m.finalizacao===st.fin);
      r.sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      const pt={};r.forEach(m=>pt[m.tipoAtendimento]=(pt[m.tipoAtendimento]||0)+1);
      return{titulo:"Relatório de manutenções",
        colunas:["Data","OS","Cliente","NS","Tipo","Técnico","Equipe","Finalização","Qtd peças","Custo peças"],
        linhas:r.map(m=>[fmtDate(m.criadaEm),m.numeroBlingRef||"—",cliNome(m.clienteId),byId("equipamentos",m.equipamentoId)?.ns||"—",TIPOS_ATEND[m.tipoAtendimento]||"—",tecNome(m.tecnicoId),tecNomes(m.equipe)||"—",m.finalizacao||"Em aberto",(m.pecas||[]).reduce((s,p)=>s+p.qtd,0),money(custoMnt(m))]),
        totais:[{l:"Manutenções",n:r.length},{l:"Encerradas",n:r.filter(m=>m.status==="encerrada").length},{l:"Locação / Assistência",n:(pt.locacao||0)+" / "+(pt.assistencia||0)},{l:"Custo de peças",n:money(r.reduce((s,m)=>s+custoMnt(m),0))}]};
    },
    os(){
      let r=DB.ordens.filter(ativo).filter(o=>per(o.criadaEm));
      if(st.cliente)r=r.filter(o=>o.clienteId===st.cliente);
      if(st.statusOS)r=r.filter(o=>o.status===st.statusOS);
      r.sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      const c=s=>r.filter(o=>o.status===s).length;
      return{titulo:"Relatório de Ordens de Serviço",
        colunas:["Número (Bling)","Aberta em","Cliente","Equipamento","Tipo","Situação cobrança","Status"],
        linhas:r.map(o=>[o.numeroBling,fmtDate(o.criadaEm),cliNome(o.clienteId),o.equipamentoId?eqNome(o.equipamentoId):"—",TIPOS_ATEND[o.tipoAtendimento]||"—",o.situacaoCobranca||"—",({aberta:"Aberta",em_atendimento:"Em atendimento",aguardando_peca:"Aguardando peça",aguardando_retorno:"Aguardando retorno",encerrada:"Encerrada"})[o.status]]),
        totais:[{l:"Total",n:r.length},{l:"Abertas",n:c("aberta")},{l:"Aguardando peça",n:c("aguardando_peca")},{l:"Encerradas",n:c("encerrada")}]};
    },
    pecas(){
      let ms=DB.manutencoes.filter(ativo).filter(m=>per(m.criadaEm));
      if(st.cliente)ms=ms.filter(m=>m.clienteId===st.cliente);
      const uso={};
      ms.forEach(m=>(m.pecas||[]).forEach(p=>{uso[p.produtoId]=uso[p.produtoId]||{qtd:0,ocor:0};uso[p.produtoId].qtd+=p.qtd;uso[p.produtoId].ocor++;}));
      const ents=Object.entries(uso).sort((a,b)=>b[1].qtd-a[1].qtd);
      let totQtd=0,totCusto=0;
      const linhas=ents.map(([pid,u])=>{const pr=byId("produtos",pid);const ct=(pr?.custo||0)*u.qtd;totQtd+=u.qtd;totCusto+=ct;return[pr?.descricao||"—",pr?.codigo||"—",u.qtd,u.ocor,money(pr?.custo||0),money(ct)];});
      return{titulo:"Relatório de peças utilizadas",
        colunas:["Produto","Código","Qtd total","Nº manutenções","Custo unitário","Custo total"],
        linhas,totais:[{l:"Itens distintos",n:ents.length},{l:"Peças (qtd)",n:totQtd},{l:"Custo total",n:money(totCusto)}]};
    },
    jornadas(){
      let r=DB.jornadas.filter(ativo).filter(j=>per(j.criadaEm));
      if(st.tecnico)r=r.filter(j=>j.tecnicoId===st.tecnico||(j.equipe||[]).includes(st.tecnico));
      if(st.veiculo)r=r.filter(j=>j.veiculoId===st.veiculo);
      r.sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      let totKm=0,totVis=0;
      const linhas=r.map(j=>{const perc=j.kmFinal?j.kmFinal-j.kmInicial:0;const vis=(j.eventos||[]).filter(e=>e.tipo==="chegada").length;totKm+=perc;totVis+=vis;
        return[fmtDate(j.criadaEm),tecNome(j.tecnicoId)+(j.equipe&&j.equipe.length?" + "+tecNomes(j.equipe):""),byId("veiculos",j.veiculoId)?.placa||"—",j.kmInicial?.toLocaleString("pt-BR")||"—",j.kmFinal?j.kmFinal.toLocaleString("pt-BR"):"—",perc?km(perc):"—",vis,dur(j)];});
      return{titulo:"Relatório de jornadas",
        colunas:["Data","Técnico / equipe","Veículo","KM inicial","KM final","Percorrido","Visitas","Duração"],
        linhas,totais:[{l:"Jornadas",n:r.length},{l:"KM percorrido",n:km(totKm)},{l:"Visitas",n:totVis},{l:"Encerradas",n:r.filter(j=>j.status==="encerrada").length}]};
    },
    despesas(){
      let r=DB.abastecimentos.filter(ativo).filter(a=>per(a.dataHora||a.criadoEm));
      if(st.veiculo)r=r.filter(a=>a.veiculoId===st.veiculo);
      r.sort((a,b)=>new Date(a.dataHora)-new Date(b.dataHora));
      let totL=0,totV=0;const porCat={};
      const linhas=r.map(a=>{const c=a.categoria||"combustivel";totL+=(+a.litros||0);totV+=(+a.valorTotal||0);porCat[c]=(porCat[c]||0)+(+a.valorTotal||0);
        return[fmtDate(a.dataHora),catDespNome(c),a.descricao||a.posto||"—",byId("veiculos",a.veiculoId)?.placa||"—",c==="combustivel"&&a.litros?a.litros:"",money(a.valorTotal),a.docFiscal||"—"];});
      const catTot=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,val])=>catDespNome(k).split(" ")[0]+" "+money(val)).join(" · ");
      return{titulo:"Relatório de gastos & despesas",
        colunas:["Data","Categoria","Descrição","Veículo","Litros","Valor","Documento"],
        linhas,totais:[{l:"Lançamentos",n:r.length},{l:"Total",n:money(totV)},{l:"Combustível (L)",n:totL.toFixed(1)},{l:"Maiores categorias",n:catTot||"—"}]};
    },
    preventivas(){
      let r=DB.preventivas.filter(ativo);
      if(st.veiculo)r=r.filter(p=>p.veiculoId===st.veiculo);
      const linhas=r.map(p=>{const s=preventivaStatus(p);const regra=[p.regraKm?km(p.regraKm):"",p.regraMeses?p.regraMeses+" meses":""].filter(Boolean).join(" ou ");
        return[byId("veiculos",p.veiculoId)?.placa||"—",p.tipo,regra,p.ultData?fmtDate(p.ultData):"—",[isFinite(s.kmRest)?km(s.kmRest):"",isFinite(s.diasRest)?s.diasRest+" d":""].filter(Boolean).join(" / "),s.label];});
      return{titulo:"Relatório de preventivas de veículos",
        colunas:["Veículo","Serviço","Regra","Última execução","Restante","Status"],
        linhas,totais:[{l:"Itens",n:r.length},{l:"Vencidas",n:r.filter(p=>preventivaStatus(p).venc).length},{l:"Próximas",n:r.filter(p=>{const s=preventivaStatus(p);return!s.venc&&s.prox;}).length}]};
    },
    atendimento(){
      const m=byId("manutencoes",st.manut);
      if(!m)return{erro:"Selecione o atendimento (visita) para gerar o relatório."};
      const eq=byId("equipamentos",m.equipamentoId);
      const testes=Object.entries(m.testes||{}).filter(([,x])=>x).map(([k,x])=>(DB.camposTecnicos.find(c=>c.id===k)?.nome||k)+": "+x)
        .concat((m.testesExtra||[]).filter(t=>t.valor).map(t=>t.nome+": "+t.valor));
      const med=Object.entries(m.medicoes||{}).filter(([,x])=>x).map(([k,x])=>k+": "+x);
      const pc=(m.pecas||[]).map(p=>(byId("produtos",p.produtoId)?.descricao||"Peça")+" (x"+p.qtd+")");
      const linhas=[
        ["Cliente",cliNome(m.clienteId)],
        [eqLabel(),eqNome(m.equipamentoId)+(eq?.fabricante?" · "+eq.fabricante:"")],
        [CFG().setorLabel||"Setor atendido",eq?.setor||"—"],
        ["Data do atendimento",fmtDate(m.criadaEm)],
        ["Técnico responsável",tecNome(m.tecnicoId)+(m.equipe&&m.equipe.length?" + "+tecNomes(m.equipe):"")],
        ["Tipo de atendimento",TIPOS_ATEND[m.tipoAtendimento]||"—"],
        ["Problema relatado",m.problema||"—"],
        ["Diagnóstico",m.diagnostico||"—"],
        ["Serviço realizado",m.servico||"—"],
        ["Testes realizados",testes.join("; ")||"—"],
        ["Medições",med.join("; ")||"—"],
        ["Peças/materiais utilizados",pc.join("; ")||"—"],
        ["Observações",m.obs||"—"],
        ["Situação",m.finalizacao||"Em aberto"],
        ["Próxima ação",m.proximaAcao&&m.proximaAcao!=="nenhuma"?(PROX_ACOES[m.proximaAcao]||m.proximaAcao)+(m.proximaData?" — "+fmtDate(m.proximaData):""):"—"]
      ];
      return{titulo:"Relatório de atendimento",
        subtitulo:"OS "+(m.numeroBlingRef||"—")+" · "+cliNome(m.clienteId)+" · "+eqNome(m.equipamentoId),
        colunas:["Item","Detalhe"],linhas,assinar:true,
        totais:[{l:"OS",n:m.numeroBlingRef||"—"},{l:"Data",n:fmtDate(m.criadaEm)},{l:"Situação",n:m.finalizacao||"Em aberto"}]};
    },
    prontuario(){
      const e=byId("equipamentos",st.equip);
      if(!e)return{erro:"Selecione um equipamento para gerar o laudo."};
      let h=DB.manutencoes.filter(ativo).filter(m=>m.equipamentoId===e.id&&per(m.criadaEm)).sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      const linhas=h.map(m=>{const testes=Object.entries(m.testes||{}).map(([k,val])=>(DB.camposTecnicos.find(c=>c.id===k)?.nome||k)+": "+val).join("; ");
        return[fmtDate(m.criadaEm),m.numeroBlingRef||"—",cliNome(m.clienteId),m.servico||m.problema||"—",testes||"—",(m.pecas||[]).map(p=>(byId("produtos",p.produtoId)?.descricao||"?")+" x"+p.qtd).join("; ")||"—",m.finalizacao||"—"];});
      return{titulo:"Prontuário / laudo técnico do equipamento",
        subtitulo:`NS ${e.ns} · ${e.modelo} · ${e.fabricante} · cliente atual ${cliNome(e.clienteId)} · status ${e.status}`,
        colunas:["Data","OS","Cliente","Serviço realizado","Testes","Peças","Finalização"],
        linhas,assinar:true,
        totais:[{l:"Manutenções",n:h.length},{l:"1ª no período",n:h[0]?fmtDate(h[0].criadaEm):"—"},{l:"Última",n:h.length?fmtDate(h[h.length-1].criadaEm):"—"},{l:"Peças trocadas",n:h.reduce((s,m)=>s+(m.pecas||[]).reduce((x,p)=>x+p.qtd,0),0)}]};
    },
    cliente(){
      const c=byId("clientes",st.cliente);
      if(!c)return{erro:"Selecione um cliente."};
      let h=DB.manutencoes.filter(ativo).filter(m=>m.clienteId===c.id&&per(m.criadaEm)).sort((a,b)=>new Date(a.criadaEm)-new Date(b.criadaEm));
      const eqs=DB.equipamentos.filter(e=>ativo(e)&&e.clienteId===c.id);
      return{titulo:"Histórico do cliente",
        subtitulo:`${c.razao} · ${c.doc} · ${RELACAO[c.relacao]||"—"} · ${eqs.length} equipamento(s)`,
        colunas:["Data","NS","OS","Tipo","Serviço","Finalização"],
        linhas:h.map(m=>[fmtDate(m.criadaEm),byId("equipamentos",m.equipamentoId)?.ns||"—",m.numeroBlingRef||"—",TIPOS_ATEND[m.tipoAtendimento]||"—",m.servico||m.problema||"—",m.finalizacao||"—"]),
        assinar:false,
        totais:[{l:"Manutenções",n:h.length},{l:"Equipamentos",n:eqs.length},{l:"OS no período",n:new Set(h.map(m=>m.numeroBlingRef)).size}]};
    }
  };

  function filtrosTxt(){
    const p=[];
    if(usaPeriodo())p.push("Período "+fmtDate(st.de)+" a "+fmtDate(st.ate));
    if(st.cliente)p.push("Cliente: "+cliNome(st.cliente));
    if(st.tecnico)p.push("Técnico: "+tecNome(st.tecnico));
    if(st.tipoAtend)p.push("Tipo: "+TIPOS_ATEND[st.tipoAtend]);
    if(st.fin)p.push("Finalização: "+st.fin);
    if(st.veiculo)p.push("Veículo: "+(byId("veiculos",st.veiculo)?.placa||""));
    return p.join(" · ")||"Sem filtros adicionais";
  }
  function csvText(r){
    return String.fromCharCode(0xFEFF)+[r.colunas,...r.linhas].map(row=>row.map(cell=>{
      const s=String(cell).replace(/"/g,'""');return /[";\n\r]/.test(s)?`"${s}"`:s;
    }).join(";")).join("\r\n");
  }
  function selField(id,lab,opts,val){
    return `<label class="f">${lab}<select id="${id}">${opts.map(([k,t])=>`<option value="${esc(k)}"${String(val)===String(k)?" selected":""}>${esc(t)}</option>`).join("")}</select></label>`;
  }
  function filtroHTML(){
    const f=REL_DEFS[st.tipo].filtros;const parts=[];
    if(f.includes("periodo"))parts.push(`<label class="f">De<input type="date" id="fde" value="${st.de}"></label>`,`<label class="f">Até<input type="date" id="fate" value="${st.ate}"></label>`);
    if(f.includes("cliente"))parts.push(selField("fcli","Cliente",[["","Todos"],...DB.clientes.filter(ativo).map(c=>[c.id,c.fantasia||c.razao])],st.cliente));
    if(f.includes("tecnico"))parts.push(selField("ftec","Técnico",[["","Todos"],...DB.tecnicos.filter(ativo).map(t=>[t.id,t.nome])],st.tecnico));
    if(f.includes("tipo"))parts.push(selField("ftip","Tipo de atendimento",[["","Todos"],...Object.entries(TIPOS_ATEND)],st.tipoAtend));
    if(f.includes("status"))parts.push(selField("ffin","Finalização",[["","Todas"],...FINALIZACOES.map(x=>[x,x])],st.fin));
    if(f.includes("statusOS"))parts.push(selField("fsos","Status da OS",[["","Todos"],["aberta","Aberta"],["em_atendimento","Em atendimento"],["aguardando_peca","Aguardando peça"],["aguardando_retorno","Aguardando retorno"],["encerrada","Encerrada"]],st.statusOS));
    if(f.includes("veiculo"))parts.push(selField("fvei","Veículo",[["","Todos"],...DB.veiculos.filter(ativo).map(x=>[x.id,x.placa+" · "+x.marcaModelo])],st.veiculo));
    if(f.includes("equipamento"))parts.push(selField("feq","Equipamento / NS",[["","Selecione…"],...DB.equipamentos.filter(ativo).map(e=>[e.id,e.ns+" · "+e.modelo])],st.equip));
    if(f.includes("manutencao")){
      let ms=DB.manutencoes.filter(ativo);
      if(st.cliente)ms=ms.filter(m=>m.clienteId===st.cliente);
      ms=ms.sort((a,b)=>new Date(b.criadaEm)-new Date(a.criadaEm));
      parts.push(selField("fmnt","Atendimento / visita",[["","Selecione…"],...ms.map(m=>[m.id,fmtDate(m.criadaEm)+" · "+(m.numeroBlingRef||"s/ OS")+" · "+cliNome(m.clienteId)+" · "+eqNome(m.equipamentoId)])],st.manut));
    }
    return parts.join("");
  }
  function readFilters(){
    const g=id=>v.querySelector("#"+id);
    if(g("fde"))st.de=g("fde").value;
    if(g("fate"))st.ate=g("fate").value;
    if(g("fcli"))st.cliente=g("fcli").value;
    if(g("ftec"))st.tecnico=g("ftec").value;
    if(g("ftip"))st.tipoAtend=g("ftip").value;
    if(g("ffin"))st.fin=g("ffin").value;
    if(g("fsos"))st.statusOS=g("fsos").value;
    if(g("fvei"))st.veiculo=g("fvei").value;
    if(g("feq"))st.equip=g("feq").value;
    if(g("fmnt"))st.manut=g("fmnt").value;
  }
  function empresaCab(){
    const c=CFG();
    const nome=(c.empresa&&c.empresa!=="Minha Empresa")?c.empresa:"Banheza Assist";
    const l=[];
    if(c.razaoSocial&&c.razaoSocial!==nome)l.push(esc(c.razaoSocial));
    const doc=[c.cnpj?"CNPJ "+esc(c.cnpj):"",c.ie?"IE "+esc(c.ie):""].filter(Boolean).join(" · ");
    if(doc)l.push(doc);
    if(c.enderecoEmpresa)l.push(esc(c.enderecoEmpresa));
    const ct=[c.telefoneEmpresa?esc(c.telefoneEmpresa):"",c.emailEmpresa?esc(c.emailEmpresa):""].filter(Boolean).join(" · ");
    if(ct)l.push(ct);
    if(!l.length)l.push("Assistência técnica &amp; manutenção de campo");
    return `<div class="org">${esc(nome)}</div><div class="orgdados">${l.join("<br>")}</div>`;
  }
  function docHTML(r){
    return `<div class="repdoc">
      <div class="rephead">
        <div>${empresaCab()}</div>
        <div class="meta">Emitido em ${fmtDT(nowISO())}<br>Perfil: ${esc(perfilNome())}${usaPeriodo()?"<br>Período: "+fmtDate(st.de)+" a "+fmtDate(st.ate):""}</div>
      </div>
      <div class="repttl">${esc(r.titulo)}</div>
      <div class="repsub">${esc(r.subtitulo||filtrosTxt())}</div>
      <div class="reptotals">${r.totais.map(t=>`<div class="reptot"><div class="l">${esc(t.l)}</div><div class="n">${esc(t.n)}</div></div>`).join("")}</div>
      <div class="tblwrap"><table class="tbl"><thead><tr>${r.colunas.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${r.linhas.length?r.linhas.map(ln=>`<tr>${ln.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${r.colunas.length}" class="muted">Nenhum registro para o filtro selecionado.</td></tr>`}</tbody></table></div>
      ${r.assinar?`<div class="repsign"><div>Técnico responsável</div><div>Responsável pelo cliente</div></div>`:""}
      <div class="repfoot"><span>${r.linhas.length} registro(s)</span><span>${REL_DEFS[st.tipo].publico==="cliente"?"Documento para entrega ao cliente":"Uso interno"} · gerado pelo Banheza Assist</span></div>
    </div>`;
  }
  function gerar(){
    readFilters();
    const r=BUILDERS[st.tipo]();
    const out=v.querySelector("#repout");
    if(r.erro){ultimo=null;out.innerHTML=`<div class="alertbox"><span>!</span><div>${esc(r.erro)}</div></div>`;return;}
    ultimo=r;
    out.innerHTML=docHTML(r);
    audit("Relatório",REL_DEFS[st.tipo].nome,"",filtrosTxt());
  }

  const optBtn=([k,d])=>`<button type="button" class="repopt${k===st.tipo?" sel":""}" data-rt="${k}">${esc(d.nome)}<span class="k">${esc(d.desc||"")}</span></button>`;

  v.innerHTML=`<div class="pagehead"><h1>Relatórios</h1><p>Documentos filtráveis para impressão, PDF ou exportação. Mesma base do restante do app — sem retrabalho de digitação.</p></div>

  <div class="panel repgroup interno noprint">
    <div class="ph"><h3>Uso interno — gestão da empresa</h3><span class="pill">Não enviar ao cliente</span></div>
    <div class="repgrid">${Object.entries(REL_DEFS).filter(([,d])=>!d.publico).map(optBtn).join("")}</div>
  </div>

  <div class="panel repgroup cliente noprint">
    <div class="ph"><h3>Pode enviar ao cliente</h3><span class="pill good">Sem custos internos</span></div>
    <div class="repgrid">${Object.entries(REL_DEFS).filter(([,d])=>d.publico==="cliente").map(optBtn).join("")}</div>
  </div>

  <div class="card pad noprint" style="margin-bottom:18px">
    <div class="formgrid" id="rfiltros"></div>
    <div class="actionbar" style="margin-top:14px">
      <button class="btn primary" id="rgerar">Gerar relatório</button>
      <button class="btn" id="rprint">⎙ Imprimir / PDF</button>
      <button class="btn" id="rcsv">⇩ Exportar CSV</button>
    </div>
    <p class="small muted" style="margin:10px 0 0">Dica: em <b>Imprimir</b>, escolha “Salvar como PDF”. No app publicado, o CSV é copiado para a área de transferência (cole no Excel/Sheets).</p>
  </div>
  <div id="repout"></div>`;

  const drawFiltros=()=>{
    v.querySelector("#rfiltros").innerHTML=filtroHTML();
    const cliSel=v.querySelector("#fcli");
    if(cliSel&&REL_DEFS[st.tipo].filtros.includes("manutencao"))cliSel.onchange=()=>{st.cliente=cliSel.value;st.manut="";drawFiltros();};
  };
  drawFiltros();
  v.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{
    if(b.dataset.rt===st.tipo)return;
    readFilters();st.tipo=b.dataset.rt;
    v.querySelectorAll("[data-rt]").forEach(x=>x.classList.toggle("sel",x.dataset.rt===st.tipo));
    drawFiltros();v.querySelector("#repout").innerHTML="";ultimo=null;
  });
  v.querySelector("#rgerar").onclick=gerar;
  v.querySelector("#rprint").onclick=()=>{if(!ultimo)gerar();setTimeout(()=>window.print(),80);};
  v.querySelector("#rcsv").onclick=async()=>{
    if(!ultimo)gerar();
    if(!ultimo)return;
    const txt=csvText(ultimo);
    const fname=st.tipo+"_"+st.ate+".csv";
    // 1) capacidade de download do artefato publicado
    try{
      const downloads=window.claude&&claude.use?await claude.use("downloads"):null;
      if(downloads){await downloads.save({filename:fname,data:txt});toast("CSV salvo.");return;}
    }catch(e){if(e&&e.code==="declined")return;}
    // 2) download direto (arquivo local / navegador)
    let baixou=false;
    try{
      const blob=new Blob([txt],{type:"text/csv;charset=utf-8"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;
      document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href);},0);baixou=true;
    }catch(e){}
    // 3) sempre disponibiliza para copiar
    if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});
    modal({title:"Exportar CSV",wide:true,body:`
      <p class="small muted">Arquivo <b>${esc(fname)}</b>. ${baixou?"Se o download não aparecer, ":""}copie o conteúdo abaixo e cole no Excel ou Google Sheets.</p>
      <textarea style="min-height:220px;font-family:var(--mono);font-size:12px" readonly id="csvta">${esc(txt)}</textarea>`,
      footer:`<button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" id="csvcopy">Copiar tudo</button>`});
    $("#csvta").select();
    $("#csvcopy").onclick=()=>{$("#csvta").select();try{document.execCommand("copy");}catch(e){}navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{});toast("CSV copiado.");};
  };
  gerar();
};

/* ============ FLUXO MACRO ============ */
ROUTES.fluxo=(v)=>{
  const steps=[
    "Cliente / produto / OS no Bling",
    "OS Bling → Cliente → Equipamento/NS → Classificação do atendimento",
    "Jornada → Veículo → KM → Deslocamento → Chegada",
    "Atendimento → Diagnóstico → Serviço → Testes → Medições → Peças → Fotos",
    "Finalização → Status → Retorno / Peça / Preventiva",
    "Histórico do equipamento + Histórico do cliente + Indicadores gerenciais"
  ];
  v.innerHTML=`<div class="pagehead"><h1>Fluxo macro</h1><p>O caminho de ponta a ponta. Cada etapa alimenta a próxima; o histórico e os indicadores são consequência, não retrabalho.</p></div>
  <div class="card pad" style="max-width:640px">
    <div class="flowdiag">
      ${steps.map((s,ix)=>`<div class="step">${esc(s)}</div>${ix<steps.length-1?'<div class="arr">↓</div>':""}`).join("")}
    </div>
  </div>
  <div class="card pad" style="margin-top:16px">
    <h3 style="margin-bottom:10px">Decisões que a estrutura garante</h3>
    <ul class="small" style="line-height:1.9;margin:0;padding-left:18px">
      <li>Não duplicar OS do Bling nem histórico de manutenção.</li>
      <li>NS é único e permanente; equipamento muda de cliente sem perder histórico.</li>
      <li>Equipamento substituído mantém o NS antigo intacto e relacionado ao novo.</li>
      <li>Cliente pode ter, ao mesmo tempo, equipamentos locados e próprios.</li>
      <li>Natureza do atendimento e situação da cobrança são campos distintos.</li>
      <li>Exclusão só por administrador e com auditoria (soft delete).</li>
      <li>Técnico não repete dados permanentes do equipamento a cada visita.</li>
      <li>Campos técnicos extensíveis; chegada ao cliente pode ser automática.</li>
      <li>Jornada com vários clientes por dia; dois técnicos podem dividir o veículo.</li>
      <li>Leitura da nota fiscal (QR Code / código de barras) pela câmera, com preenchimento manual como alternativa.</li>
    </ul>
  </div>`;
};

function gerarCodigoConvite(){
  const s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="BZ-";
  for(let i=0;i<6;i++)c+=s[Math.floor(Math.random()*s.length)];
  return c;
}
async function conviteModal(){
  if(MODO_DEMO)return toast("Indisponível no modo demonstração.");
  if(!ehAdmin())return toast("Só o administrador convida.");
  modal({title:"Convidar para a equipe",body:`
    <p class="small muted" style="margin:0 0 12px">Gere um código, passe para a pessoa, e ela se cadastra sozinha com e‑mail e senha.</p>
    <div class="formgrid">
      <label class="f">Nível de acesso<select id="cvPapel"><option value="tecnico">Técnico</option><option value="admin">Administrador</option></select></label>
      <label class="f">Validade<select id="cvExp"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="0">Sem prazo</option></select></label>
      <label class="f">Quantas pessoas podem usar<select id="cvUsos"><option value="1" selected>1 pessoa</option><option value="5">até 5</option><option value="20">até 20</option></select></label>
    </div>
    <div id="cvResult" style="margin-top:14px"></div>`,
    footer:`<button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" id="cvGerar">Gerar convite</button>`});
  $("#cvGerar").onclick=async()=>{
    const papel=$("#cvPapel").value, dias=+$("#cvExp").value, usos=+$("#cvUsos").value;
    const codigo=gerarCodigoConvite();
    const row={codigo,empresa_id:PERFIL.empresa_id,papel,usos_max:usos,usos:0,ativo:true,
      expira_em:dias?new Date(Date.now()+dias*86400000).toISOString():null};
    const {error}=await supa.from("convites").insert(row);
    if(error)return toast(/policy|permission/i.test(error.message)?"Só administrador convida.":(error.message||"Erro ao gerar."));
    DB.convites.unshift(row);audit("Criação","Convite",codigo,PAPEIS[papel]?.nome||papel);
    const link=location.origin+location.pathname+"?convite="+codigo;
    $("#cvResult").innerHTML=`<div class="card pad" style="background:var(--surface-2)">
      <div class="small muted">Código</div><div class="mono" style="font-size:20px;font-weight:700;letter-spacing:.06em">${esc(codigo)}</div>
      <div class="small muted" style="margin-top:10px">Link direto</div><div class="small mono" style="word-break:break-all">${esc(link)}</div>
      <div class="actionbar" style="margin-top:12px"><button class="btn sm" id="cvCopyCode">Copiar código</button><button class="btn sm" id="cvCopyLink">Copiar link</button></div></div>`;
    const cp=(txt,msg)=>{(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(msg)).catch(()=>prompt("Copie:",txt));};
    $("#cvCopyCode").onclick=()=>cp(codigo,"Código copiado.");
    $("#cvCopyLink").onclick=()=>cp(link,"Link copiado.");
    persist();
  };
}
function usuarioModal(t){
  if(MODO_DEMO)return toast("Indisponível no modo demonstração.");
  if(!t)return conviteModal();
  modal({title:"Editar usuário",body:`<div class="stack">
    <label class="f">Nome <span class="rq">*</span><input id="un" value="${esc(t.nome||"")}"></label>
    <label class="f">Nível de acesso<select id="up">${Object.entries(PAPEIS).map(([k,x])=>`<option value="${k}"${t.papel===k?" selected":""}>${x.nome}</option>`).join("")}</select></label>
    <p class="small muted" style="margin:0">${esc(PAPEIS[t.papel==="admin"?"admin":"tecnico"].d)}</p>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="ua" style="width:auto" ${!t.excluido?"checked":""}> Acesso ativo</label>
  </div>`,footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="uok">Salvar</button>`});
  $("#uok").onclick=async()=>{
    const nome=$("#un").value.trim();if(!nome)return toast("Informe o nome.");
    const papel=$("#up").value, ativo=$("#ua").checked;
    if(t.id===PERFIL.id&&(!ativo||papel!=="admin"))return toast("Você não pode tirar o próprio acesso de administrador.");
    if(t.papel==="admin"&&papel!=="admin"&&DB.tecnicos.filter(x=>x.papel==="admin"&&!x.excluido).length<=1)return toast("Deve haver ao menos um administrador.");
    const {error}=await supa.from("perfis").update({nome,papel,ativo}).eq("id",t.id);
    if(error)return toast(/policy|permission|row-level/i.test(error.message)?"Só administrador altera usuários.":(error.message||"Erro."));
    t.nome=nome;t.papel=papel;t.excluido=ativo?undefined:{};
    audit("Edição","Usuário",t.id,nome);persist();
    closeModal();toast("Usuário salvo.");router();
  };
}

/* ---------- PWA: manifesto + ícones gerados em runtime ---------- */
function installPWA(){
  try{
    const bpath="M112 64H288C352 64 400 104 400 168C400 208 376 240 344 252C384 264 408 300 408 344C408 408 360 448 288 448H112C99 448 88 437 88 424V88C88 75 99 64 112 64ZM168 136V216H280C312 216 328 196 328 176C328 156 312 136 280 136H168ZM168 296V376H296C328 376 348 358 348 328C348 298 328 296 296 296H168Z";
    const bolt='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="120" fill="#002820"/><path fill-rule="evenodd" d="'+bpath+'" fill="#3ed87f"/></svg>';
    const svgIcon="data:image/svg+xml,"+encodeURIComponent(bolt);
    let pngIcon=svgIcon;
    const mkCanvas=drawB=>{try{
      const cv=document.createElement("canvas");cv.width=cv.height=512;const c=cv.getContext("2d");
      c.fillStyle="#002820";
      const r=120;c.beginPath();c.moveTo(r,0);c.arcTo(512,0,512,512,r);c.arcTo(512,512,0,512,r);c.arcTo(0,512,0,0,r);c.arcTo(0,0,512,0,r);c.fill();
      drawB(c);
      pngIcon=cv.toDataURL("image/png");applyIcons();
    }catch(e){}};
    const geomB=c=>{c.fillStyle="#3ed87f";c.fill(new Path2D(bpath),"evenodd");};
    mkCanvas(geomB);
    const im=new Image();
    im.onload=()=>mkCanvas(c=>{const s=340,x=(512-s*im.width/im.height)/2,y=(512-s)/2;c.drawImage(im,x,y,s*im.width/im.height,s);});
    im.onerror=()=>{};
    im.src="assets/mark-green.png";
    const nm=(CFG().empresa&&CFG().empresa!=="Minha Empresa")?CFG().empresa:"Banheza Assist";
    let mfLink=null,appleLink=null,favLink=null;
    function applyIcons(){
      const manifest={name:nm,short_name:nm.slice(0,12),description:"Assistência técnica e operação de campo",
        start_url:".",scope:".",display:"standalone",orientation:"portrait",
        background_color:"#002820",theme_color:"#002820",
        icons:[{src:pngIcon,sizes:"512x512",type:"image/png",purpose:"any"},{src:svgIcon,sizes:"512x512",type:"image/svg+xml",purpose:"maskable"}]};
      if(mfLink)mfLink.remove();
      mfLink=document.createElement("link");mfLink.rel="manifest";
      mfLink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
      document.head.appendChild(mfLink);
      if(appleLink)appleLink.remove();
      appleLink=document.createElement("link");appleLink.rel="apple-touch-icon";appleLink.href=pngIcon;document.head.appendChild(appleLink);
      if(favLink)favLink.remove();
      favLink=document.createElement("link");favLink.rel="icon";favLink.href=svgIcon;document.head.appendChild(favLink);
    }
    applyIcons();
  }catch(e){}
}

function applyThemeColor(){
  const dark=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);
  let mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=dark?"#071a12":"#002820";
}

};

async function boot(){
  document.documentElement.setAttribute("data-hidden-app","");   // esconde o app até resolver a sessão
  checarRetornoPagamento();
  mostrarSplash();
  const libOk=await loadSupaLib();
  if(!libOk){ MODO_DEMO=true; return mostrarLogin("Não foi possível carregar a biblioteca."); }
  try{
    supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  }catch(e){ MODO_DEMO=true; return mostrarLogin("Falha ao iniciar o Supabase."); }
  supa.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT"&&PERFIL){ PERFIL=null; mostrarLogin(); } });
  let session=null;
  try{ session=(await supa.auth.getSession()).data.session; }catch(e){}
  if(session){
    try{ await entrar(session); return; }
    catch(e){ console.warn("sessão inválida:",e); }
  }
  // sem sessão — testa se o servidor responde (senão, MODO_DEMO)
  try{
    const {error}=await supa.from("empresas").select("id").limit(1);
    if(error && /Failed to fetch|NetworkError|ERR_|blocked/i.test((error.message||"")+(error.details||""))){
      MODO_DEMO=true; return mostrarLogin("Sem conexão com o servidor.");
    }
  }catch(e){
    MODO_DEMO=true; return mostrarLogin("Sem conexão com o servidor.");
  }
  mostrarLogin();
}
boot();
