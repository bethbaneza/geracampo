<title>GeraCampo</title>
<meta name="description" content="App técnico de manutenção de geradores de cloro, jornada, veículos e estoque, integrado ao Bling.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GeraCampo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#eef1f2; --surface:#ffffff; --surface-2:#f6f8f8; --surface-3:#eceff0;
  --ink:#12201f; --ink-2:#42575a; --ink-3:#6b8184; --line:#d8dfe0; --line-2:#e7ecec;
  --accent:#0e7490; --accent-deep:#0b5566; --accent-soft:#dbeef2; --on-accent:#ffffff;
  --good:#15803d; --good-soft:#dcf0e1; --warn:#b45309; --warn-soft:#f7e8d3; --crit:#b91c1c; --crit-soft:#f6dede;
  --info:#3f4d8a; --info-soft:#e2e5f3;
  --radius:9px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(16,32,34,.06),0 8px 24px -12px rgba(16,32,34,.18);
  --font:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --display:"Archivo",var(--font); --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0b1214; --surface:#121e21; --surface-2:#16252a; --surface-3:#1d2f34;
  --ink:#e8efef; --ink-2:#a7bcbe; --ink-3:#7a9195; --line:#274045; --line-2:#1e3237;
  --accent:#3bb6cf; --accent-deep:#2a94ab; --accent-soft:#123138; --on-accent:#03191d;
  --good:#4ec27d; --good-soft:#123727; --warn:#e0a24a; --warn-soft:#3a2c14; --crit:#e8756b; --crit-soft:#3a1d1c;
  --info:#9aa6e0; --info-soft:#1e2340;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#0b1214; --surface:#121e21; --surface-2:#16252a; --surface-3:#1d2f34;
  --ink:#e8efef; --ink-2:#a7bcbe; --ink-3:#7a9195; --line:#274045; --line-2:#1e3237;
  --accent:#3bb6cf; --accent-deep:#2a94ab; --accent-soft:#123138; --on-accent:#03191d;
  --good:#4ec27d; --good-soft:#123727; --warn:#e0a24a; --warn-soft:#3a2c14; --crit:#e8756b; --crit-soft:#3a1d1c;
  --info:#9aa6e0; --info-soft:#1e2340;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent-deep)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* shell — mobile-first: app bar em cima, tab bar embaixo */
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.side{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--accent),var(--accent-deep));display:grid;place-items:center;color:var(--on-accent);flex:none}
.brand b{font-family:var(--display);font-size:17px;letter-spacing:-.02em}
.brand span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.nav{padding:6px 10px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px;margin-bottom:1px}
.nav a .ic{width:17px;height:17px;flex:none;opacity:.85}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);padding:14px 10px 5px;font-weight:600}
.side .foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 12px;padding-top:calc(9px + env(safe-area-inset-top))}
.topbar .crumb{flex:1;min-width:0;font-weight:700;font-family:var(--display);font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.userchip{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:100px;padding:5px 11px 5px 5px;color:var(--ink);min-height:38px;flex:none;max-width:11em}
.userchip .uav{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11px;flex:none}
.userchip .uname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userchip:active{background:var(--surface-3)}
@media(max-width:360px){.userchip .uname{display:none}.userchip{padding:5px}}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:var(--radius-sm);width:38px;height:38px;display:grid;place-items:center;flex:none}
#backbtn{display:none}
.app.hasback #backbtn{display:grid}
.wrap{padding:16px 14px calc(88px + env(safe-area-inset-bottom));width:100%;max-width:680px;margin:0 auto}
.menutoggle{display:none!important}

/* tab bar (celular) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 14px -6px rgba(16,32,34,.25)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--ink-3);text-decoration:none;font-size:10px;font-weight:600;letter-spacing:.01em;min-height:56px;justify-content:center}
.tabbar a .ic{width:23px;height:23px;stroke-width:1.9}
.tabbar a.on{color:var(--accent-deep)}
.tabbar a.on .ic{stroke-width:2.5}
.tabbar a:active{background:var(--surface-2)}

/* grade de atalhos da tela "Mais" */
.maisgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.maistile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.maistile .ic{width:22px;height:22px;color:var(--accent-deep)}
.maistile b{font-family:var(--display);font-size:13.5px;font-weight:600}
.maistile span{font-size:11px;color:var(--ink-3)}
.maistile:active{background:var(--surface-2)}

/* generic */
.row{display:flex;gap:12px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.pagehead{margin-bottom:16px}
.pagehead h1{font-size:20px}
.pagehead p{margin:5px 0 0;color:var(--ink-2);max-width:64ch;font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius-sm);padding:11px 15px;font-weight:600;font-size:14px;text-decoration:none;min-height:44px;line-height:1.1}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-deep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-deep);min-height:36px;padding:8px 10px}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{padding:7px 11px;font-size:12.5px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media(min-width:960px){.btn{font-size:13px;min-height:38px;padding:8px 13px}.btn.sm{min-height:30px;padding:5px 9px;font-size:12px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.card h3{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel>.ph{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel>.ph h3{font-size:13.5px}
.panel>.pb{padding:6px 0}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;line-height:1.25}
.kpi .val{font-family:var(--display);font-size:24px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
.kpi .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi.warn{border-color:var(--warn-soft)} .kpi.warn .val{color:var(--warn)}
.kpi.crit{border-color:var(--crit-soft)} .kpi.crit .val{color:var(--crit)}
.kpi.good .val{color:var(--good)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit;min-height:56px}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item:active{background:var(--surface-3)}
.item .t{font-weight:600;font-size:14px}
.item .d{font-size:12px;color:var(--ink-3)}
.item .sp{flex:1}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-weight:700;font-family:var(--display);flex:none;font-size:13px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:100px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;letter-spacing:.01em}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent-deep)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}

label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
label.f .rq{color:var(--crit)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;width:100%;min-height:44px}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--ink-3) 50%),linear-gradient(-45deg,transparent 49%,var(--ink-3) 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input[type=file]{padding:9px;font-size:13px}
input[type=checkbox]{min-height:0}
@media(min-width:960px){input,select,textarea{font-size:13.5px;min-height:0;padding:8px 10px}}
.formgrid{display:grid;grid-template-columns:1fr;gap:13px}
@media(min-width:600px){.formgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.formgrid .full{grid-column:1/-1}
.searchbar{position:relative;flex:1;min-width:160px}
.searchbar input{padding-left:34px}
.searchbar .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;font-size:15px}

.chips{display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{font-size:12.5px;padding:7px 12px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:500;white-space:nowrap;min-height:34px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:600}

.detailgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.detailgrid.two{grid-template-columns:1.4fr 1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:500}
.kv dd{margin:0;font-weight:500;text-align:right}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 15px}
.tl::before{content:"";position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tl .when{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.tl .what{font-weight:600;font-size:13px;margin-top:1px}

.flowdiag{display:flex;flex-direction:column;gap:0;font-family:var(--display);font-weight:600}
.flowdiag .step{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px}
.flowdiag .arr{align-self:center;color:var(--accent);padding:3px 0;font-size:14px}

.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:74px;height:74px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--line)}
.photogroup{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;width:100%;margin-top:4px}

.modal-bg{position:fixed;inset:0;background:rgba(8,16,18,.5);display:grid;place-items:end center;z-index:60}
.modal{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;border-bottom:0;animation:sheetup .22s ease}
.modal .mh{padding:15px 18px 13px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mh::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:34px;height:4px;border-radius:2px;background:var(--line)}
.modal .mh h3{font-size:16px}
.modal .mb{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal .mf{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);display:flex;flex-direction:column-reverse;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.modal .mf .btn{width:100%}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:640px){
  .modal-bg{place-items:center;padding:18px}
  .modal{border-radius:var(--radius);border-bottom:1px solid var(--line);max-height:88vh;animation:none}
  .modal .mh::before{display:none}
  .modal .mf{flex-direction:row;justify-content:flex-end}
  .modal .mf .btn{width:auto}
}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:100px;font-size:13px;font-weight:500;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center}
@media(min-width:960px){.toast{bottom:24px}}

.emptyst{text-align:center;padding:40px 20px;color:var(--ink-3)}
.bignums{display:flex;gap:8px}
.actionbar{display:flex;gap:8px;flex-wrap:wrap}
.actionbar .btn{flex:1 1 auto}
@media(min-width:600px){.actionbar .btn{flex:0 0 auto}}

.stepper{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.stepper .s{font-size:12px;padding:6px 12px;border-radius:100px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);font-weight:600}
.stepper .s.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stepper .s.done{background:var(--good-soft);border-color:var(--good-soft);color:var(--good)}

.alertbox{border:1px solid var(--warn-soft);background:var(--warn-soft);color:var(--warn);padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;display:flex;gap:9px;align-items:flex-start}
.alertbox.crit{border-color:var(--crit-soft);background:var(--crit-soft);color:var(--crit)}
.alertbox.info{border-color:var(--info-soft);background:var(--info-soft);color:var(--info)}

/* desktop: volta a barra lateral, esconde a tab bar */
@media(min-width:960px){
  .app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line)}
  .tabbar{display:none}
  .app.hasback #backbtn{display:none}
  .topbar{padding:10px 22px}
  .wrap{max-width:1120px;padding:22px 24px 60px}
  .maisgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .pagehead h1{font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* relatórios */
.repdoc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px;max-width:920px}
.rephead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.rephead .org{font-family:var(--display);font-weight:700;font-size:16px}
.rephead .meta{font-size:11px;color:var(--ink-3);text-align:right;line-height:1.6}
.repttl{font-family:var(--display);font-size:19px;font-weight:700;margin-bottom:2px}
.repsub{font-size:12px;color:var(--ink-2);margin-bottom:16px}
.reptotals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.reptot{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px}
.reptot .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.reptot .n{font-family:var(--display);font-size:18px;font-weight:700;margin-top:2px}
.repfoot{margin-top:18px;padding-top:10px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.repsign{margin-top:34px;display:flex;gap:40px;flex-wrap:wrap}
.repsign div{flex:1;min-width:180px;border-top:1px solid var(--ink-2);padding-top:5px;font-size:11px;color:var(--ink-3);text-align:center}

@media print{
  @page{margin:14mm}
  body{background:#fff}
  .side,.topbar,.tabbar,.noprint{display:none!important}
  .app{display:block}
  .wrap{padding:0!important}
  .wrap{padding:0;max-width:none}
  .repdoc{border:0;box-shadow:none;border-radius:0;padding:0;max-width:none}
  .repdoc,.rephead,.reptot,.tbl th,.tbl td{color:#000!important}
  .tbl th{border-bottom:1px solid #000}
  .tbl td{border-bottom:1px solid #bbb}
  .reptot{border-color:#999}
  a{color:#000;text-decoration:none}
  .repdoc tr{break-inside:avoid}
}
</style>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark" aria-hidden="true">

/* reduz a foto antes de guardar (economia p/ sincronização e armazenamento) */
function compressImg(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=900,sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      try{cb(cv.toDataURL("image/jpeg",0.55));}catch(e){cb(rd.result);}
    };
    img.onerror=()=>cb(rd.result);
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- sincronização com a base compartilhada ----------
   Dois back-ends possíveis, escolhidos em tempo de execução:
   - Supabase (se configurado em Configurações → Conexão) — funciona em qualquer host
   - capability "db" do claude.ai (quando publicado como Artifact)
   Sem nenhum dos dois: modo local (localStorage), 1 dispositivo.            */
const LOCALONLY=location.protocol==="file:";
const SUPAKEY="geracampo_supa_v1";
function getSupaCfg(){try{return JSON.parse(localStorage.getItem(SUPAKEY))||null;}catch(e){return null;}}
function setSupaCfg(c){try{c?localStorage.setItem(SUPAKEY,JSON.stringify(c)):localStorage.removeItem(SUPAKEY);}catch(e){}}
let cloud=null,supa=null,flushT=null,lastLocalWrite=0;
const dirty=new Set(),lastSent={};
let SYNC={mode:"conectando",ts:0};
function backendAtivo(){return cloud?"db":supa?"supabase":null;}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function updateSync(){
  const el=document.getElementById("dbnote");if(!el)return;
  const m=SYNC.mode;
  if(m==="local")el.textContent="Somente neste dispositivo";
  else if(m==="conectando")el.textContent="Conectando…";
  else if(m==="pending")el.textContent="Sincronizando…";
  else if(m==="err")el.textContent="Sem conexão — dados salvos localmente";
  else{const t=SYNC.ts?new Date(SYNC.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";el.textContent="Sincronizado ("+(backendAtivo()==="supabase"?"Supabase":"equipe")+")"+(t?" · "+t:"");}
}
function trimCol(c,arr){
  if(c==="auditoria")return arr.slice(0,300);
  if(c==="manutencoes")return arr.map(m=>({...m,fotos:(m.fotos||[]).map(f=>({id:f.id,grupo:f.grupo,ts:f.ts}))}));
  if(c==="jornadas")return arr.map(j=>{const o={...j};delete o.fotoPainel;delete o.fotoPainelData;return o;});
  return arr;
}
function persist(){
  persistLocal();
  if(!backendAtivo())return;
  lastLocalWrite=Date.now();SYNC.mode="pending";updateSync();
  clearTimeout(flushT);flushT=setTimeout(flushRemote,700);
}
async function flushRemote(){
  if(!backendAtivo())return;
  let ok=true;
  for(const c of COLS){
    const body=JSON.stringify(trimCol(c,DB[c]||[]));
    if(body===lastSent[c])continue;
    if(body.length>900000){console.warn("Coleção "+c+" muito grande ("+body.length+" B) — mantida só localmente.");ok=false;continue;}
    try{
      if(cloud)await cloud.collection("estado").doc(c).set({items:JSON.parse(body),updatedAt:Date.now(),by:perfilNome()});
      else{const{error}=await supa.from("geracampo_estado").upsert({col:c,items:JSON.parse(body),updated_at:new Date().toISOString(),updated_by:perfilNome()});if(error)throw error;}
      lastSent[c]=body;
    }catch(e){ok=false;dirty.add(c);}
  }
  SYNC={mode:ok?"ok":"err",ts:Date.now()};updateSync();
}
function aplicarRemoto(c,items,by){
  const body=JSON.stringify(items||[]);
  if(body===lastSent[c])return;
  if(Date.now()-lastLocalWrite<1800)return;
  lastSent[c]=body;DB[c]=items||[];normalizeDB();persistLocal();
  SYNC={mode:"ok",ts:Date.now()};updateSync();
  if(document.getElementById("modalbg"))return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  router();
  if(by&&by!==perfilNome())toast("Dados atualizados · "+by);
}
function loadSupaLib(){
  return new Promise(res=>{
    if(window.supabase&&window.supabase.createClient)return res(true);
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload=()=>res(!!(window.supabase&&window.supabase.createClient));
    s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
}
async function initSupabase(cfg){
  if(!await loadSupaLib()){SYNC.mode="err";updateSync();toast("Não foi possível carregar a biblioteca do Supabase.");return false;}
  try{
    supa=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false}});
    const{data,error}=await supa.from("geracampo_estado").select("col,items");
    if(error)throw error;
    if(data&&data.length){
      data.forEach(r=>{if(COLS.includes(r.col)){DB[r.col]=r.items||[];lastSent[r.col]=JSON.stringify(r.items||[]);}});
      normalizeDB();persistLocal();SYNC={mode:"ok",ts:Date.now()};router();
    }else{SYNC={mode:"ok",ts:Date.now()};await flushRemote();}
    updateSync();
    supa.channel("geracampo-estado")
      .on("postgres_changes",{event:"*",schema:"public",table:"geracampo_estado"},p=>{
        const r=p.new;if(!r||!COLS.includes(r.col))return;
        aplicarRemoto(r.col,r.items,r.updated_by);
      }).subscribe();
    return true;
  }catch(e){supa=null;SYNC.mode="err";updateSync();toast("Falha ao conectar no Supabase: "+(e.message||e));return false;}
}
async function initDbCapability(){
  if(LOCALONLY||!(window.claude&&claude.use))return false;
  try{cloud=await claude.use("db");}catch(e){cloud=null;}
  if(!cloud)return false;
  try{
    const snaps=await Promise.all(COLS.map(c=>cloud.collection("estado").doc(c).get().catch(()=>null)));
    if(snaps.some(s=>s&&s.exists)){
      snaps.forEach((s,i)=>{const c=COLS[i];if(s&&s.exists){const items=(s.data()||{}).items||[];DB[c]=items;lastSent[c]=JSON.stringify(items);}});
      normalizeDB();persistLocal();SYNC={mode:"ok",ts:Date.now()};router();
    }else{await flushRemote();}
    updateSync();
    COLS.forEach(c=>cloud.collection("estado").doc(c).onSnapshot(s=>{
      if(!s||!s.exists)return;const d=s.data()||{};aplicarRemoto(c,d.items,d.by);
    },()=>{SYNC.mode="err";updateSync();}));
    return true;
  }catch(e){cloud=null;SYNC.mode="err";updateSync();return false;}
}
async function initRemote(){
  const cfg=getSupaCfg();
  if(cfg&&cfg.url&&cfg.key){if(await initSupabase(cfg))return;}
  if(await initDbCapability())return;
  SYNC.mode="local";updateSync();
}

function tipoAtendPill(t){const c=t==="locacao"?"accent":t==="garantia"?"info":t==="assistencia"?"warn":t==="cortesia"?"good":"";return `<span class="pill ${c}">${esc(TIPOS_ATEND[t]||"—")}</span>`;}
function osStatusPill(s){const m={aberta:["warn","Aberta"],em_atendimento:["info","Em atendimento"],aguardando_peca:["crit","Aguardando peça"],aguardando_retorno:["warn","Aguardando retorno"],encerrada:["good","Encerrada"]};const x=m[s]||["","—"];return `<span class="pill ${x[0]}"><span class="dot"></span>${x[1]}</span>`;}
function jornadaAberta(){return DB.jornadas.find(j=>j.status==="aberta"&&j.tecnicoId===VIEWER.tecnicoId&&ativo(j));}

function preventivaStatus(pv){
  const v=byId("veiculos",pv.veiculoId);if(!v)return{label:"—",cls:""};
  const kmRest=pv.regraKm?(pv.ultKm+pv.regraKm)-v.kmAtual:Infinity;
  const diasRest=pv.regraMeses?daysBetween(new Date(),new Date(new Date(pv.ultData).setMonth(new Date(pv.ultData).getMonth()+pv.regraMeses))):Infinity;
  const venc=kmRest<=0||diasRest<=0;
  const prox=kmRest<=(pv.regraKm?pv.regraKm*0.15:0)||diasRest<=21;
  return{kmRest,diasRest,venc,prox,label:venc?"Vencida":prox?"Próxima":"Em dia",cls:venc?"crit":prox?"warn":"good"};
}

/* ---------- indicadores ---------- */
function ind(){
  const now=new Date(),mes=now.getMonth(),ano=now.getFullYear();
  const mntMes=DB.manutencoes.filter(m=>ativo(m)&&new Date(m.criadaEm).getMonth()===mes&&new Date(m.criadaEm).getFullYear()===ano);
  const osAbertas=DB.ordens.filter(o=>ativo(o)&&o.status==="aberta");
  const osPeca=DB.ordens.filter(o=>ativo(o)&&o.status==="aguardando_peca");
  const osRetorno=DB.ordens.filter(o=>ativo(o)&&o.status==="aguardando_retorno");
  const estCrit=DB.produtos.filter(p=>ativo(p)&&p.estoque<=p.minimo);
  const solPend=DB.solicitacoesPeca.filter(s=>ativo(s)&&s.status==="pendente");
  const prevVenc=DB.preventivas.filter(p=>ativo(p)&&preventivaStatus(p).venc);
  const prevProx=DB.preventivas.filter(p=>ativo(p)&&!preventivaStatus(p).venc&&preventivaStatus(p).prox);
  const kmMes=DB.jornadas.filter(j=>ativo(j)&&j.kmFinal&&new Date(j.criadaEm).getMonth()===mes).reduce((s,j)=>s+(j.kmFinal-j.kmInicial),0);
  return{mntMes,osAbertas,osPeca,osRetorno,estCrit,solPend,prevVenc,prevProx,kmMes};
}

/* ---------- modal ---------- */
function modal({title,body,footer,wide}){
  closeModal();
  const bg=document.createElement("div");bg.className="modal-bg";bg.id="modalbg";
  bg.innerHTML=`<div class="modal" style="${wide?'max-width:760px':''}"><div class="mh"><h3>${esc(title)}</h3><button class="iconbtn" id="modalx" aria-label="Fechar">✕</button></div><div class="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:""}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener("mousedown",e=>{if(e.target===bg)closeModal();});
  $("#modalx").onclick=closeModal;
  return bg;
}
function closeModal(){$("#modalbg")?.remove();}

/* ---------- exclusão (admin, com auditoria) ---------- */
function excluir(arr,id,label,after,nivel){
  nivel=nivel||"excluir";
  if(!can(nivel)){toast("Sem permissão para excluir "+label.toLowerCase()+".");return;}
  const wrapId=uid("mot");
  modal({title:"Excluir "+label,body:`
    <p class="small muted">A exclusão é lógica (soft delete). O registro sai das listas mas continua na auditoria e pode ser restaurado.</p>
    <label class="f">Motivo da exclusão <span class="rq">*</span>
      <textarea id="${wrapId}" placeholder="Descreva o motivo"></textarea></label>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" id="cfx">Excluir</button>`});
  $("#cfx").onclick=()=>{
    const motivo=$("#"+wrapId).value.trim();
    if(!motivo){toast("Informe o motivo.");return;}
    const reg=byId(arr,id);reg.excluido={ts:nowISO(),usuario:perfilNome(),motivo};
    audit("Exclusão",label,id,motivo);persist();closeModal();toast(label+" excluído.");after&&after();
  };
}

function router(){
  const h=(location.hash||"#/painel").slice(2);
  const [r,...rest]=h.split("/");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
  const activeTab=TABROUTES.includes(r)?r:(ROUTES[r]?"mais":"painel");
  document.querySelectorAll("#tabbar a").forEach(a=>a.classList.toggle("on",a.dataset.tab===activeTab));
  const inDetalhe=rest.length>0&&rest[0]!=="novo";
  $("#app").classList.toggle("hasback",inDetalhe||(!TABROUTES.includes(r)&&r!=="mais"&&!!ROUTES[r]));
  const fn=ROUTES[r]||ROUTES.painel;
  $("#crumb").textContent=crumbMap[r]||"Painel";
  $("#view").innerHTML="";
  try{fn($("#view"),rest);}catch(e){$("#view").innerHTML=`<div class="alertbox crit">Erro ao renderizar: ${esc(e.message)}</div>`;console.error(e);}
  window.scrollTo(0,0);
}

ROUTES.equipamentos=(v,rest)=>{
  if(rest[0]==="novo")return equipForm(v,null);
  if(rest[0])return equipDetalhe(v,rest[0]);
  let q="",fstatus="";
  const draw=()=>{
    let list=DB.equipamentos.filter(ativo);
    if(fstatus)list=list.filter(e=>e.status===fstatus);
    if(q)list=list.filter(e=>[e.ns,e.modelo,e.fabricante,cliNome(e.clienteId)].join(" ").toLowerCase().includes(q.toLowerCase()));
    v.querySelector("#elist").innerHTML=list.map(e=>`
      <a class="item" href="#/equipamentos/${e.id}"><span class="avatar">NS</span>
      <div><div class="t mono">${esc(e.ns)}</div><div class="d">${esc(e.modelo)} · ${esc(cliNome(e.clienteId))} · vínculo ${esc(e.vinculo)}</div></div>
      <span class="sp"></span>${e.classAtend?tipoAtendPill(e.classAtend):""}<span class="pill ${e.status==="Ativo"?"good":e.status==="Retirado"||e.status==="Descartado"?"crit":""}">${esc(e.status)}</span></a>`).join("")||'<div class="emptyst">Nenhum equipamento.</div>';
  };
  v.innerHTML=`<div class="pagehead between"><div><h1>Equipamentos / NS</h1><p>O número de série é a identidade permanente do equipamento. Cadastro único; histórico acompanha o NS mesmo em troca de cliente.</p></div>
    ${can("criar")?`<a class="btn primary" href="#/equipamentos/novo">+ Cadastrar NS</a>`:""}</div>
  <div class="row" style="margin-bottom:12px"><div class="searchbar"><span class="ic">⌕</span><input id="q" placeholder="Buscar por NS, modelo, cliente…"></div></div>
  <div class="chips" style="margin-bottom:14px"><button class="chip on" data-s="">Todos</button>${STATUS_EQUIP.map(s=>`<button class="chip" data-s="${s}">${s}</button>`).join("")}</div>
  <div class="panel"><div class="list" id="elist"></div></div>`;
  v.querySelector("#q").oninput=e=>{q=e.target.value;draw();};
  v.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{v.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));ch.classList.add("on");fstatus=ch.dataset.s;draw();});
  draw();
};

function transferirEquip(e){
  modal({title:"Transferir equipamento de cliente",body:`
    <p class="small muted">O NS permanece o mesmo. O período com o cliente atual é fechado e um novo período é aberto. O histórico técnico acompanha o NS.</p>
    <label class="f">Novo cliente
      <select id="ncli">${DB.clientes.filter(ativo).map(c=>`<option value="${c.id}"${c.id===e.clienteId?" disabled":""}>${esc(c.fantasia||c.razao)}</option>`).join("")}</select></label>
    <label class="f" style="margin-top:10px">Novo local de instalação<input id="nloc" value="${esc(e.local||"")}"></label>
    <label class="f" style="margin-top:10px">Setor / piscina<input id="nset" value="${esc(e.setor||"")}"></label>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="ok">Transferir</button>`});
  $("#ok").onclick=()=>{
    const nc=$("#ncli").value;if(nc===e.clienteId)return toast("Selecione outro cliente.");
    const inst=(e.instalacoes||[]);const cur=inst.find(x=>!x.fim);if(cur)cur.fim=nowISO();
    inst.push({clienteId:nc,inicio:nowISO(),fim:null});
    e.instalacoes=inst;e.clienteId=nc;e.local=$("#nloc").value.trim();e.setor=$("#nset").value.trim();
    audit("Transferência","Equipamento",e.id,"Novo cliente: "+cliNome(nc));persist();closeModal();toast("Equipamento transferido.");router();
  };
}
function substituirEquip(e){
  modal({title:"Substituir equipamento",body:`
    <div class="alertbox" style="margin-bottom:12px"><span>!</span><div>O NS antigo <b>${esc(e.ns)}</b> nunca é sobrescrito. Ele fica <b>Retirado</b> e relacionado ao novo NS, que recebe prontuário próprio.</div></div>
    <div class="formgrid">
      <label class="f">Novo NS <span class="rq">*</span><input id="nns"></label>
      <label class="f">Modelo<input id="nmod" value="${esc(e.modelo)}"></label>
      <label class="f">Fabricante<input id="nfab" value="${esc(e.fabricante)}"></label>
      <label class="f">Vínculo<select id="nvinc"><option>locado</option><option>proprio</option><option>outro</option></select></label>
    </div>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="ok">Criar substituto</button>`});
  $("#ok").onclick=()=>{
    const ns=$("#nns").value.trim();if(!ns)return toast("Informe o novo NS.");
    if(DB.equipamentos.some(x=>x.ns===ns))return toast("Já existe equipamento com esse NS.");
    e.status="Retirado";

    const n={id:uid("eq"),criadoEm:nowISO(),ns,modelo:$("#nmod").value.trim(),fabricante:$("#nfab").value.trim(),dataFab:"",dataInstal:nowISO(),status:"Ativo",clienteId:e.clienteId,local:e.local,endereco:e.endereco,setor:e.setor,obsInstal:"Substitui "+e.ns,vinculo:$("#nvinc").value,classAtend:e.classAtend,camposValores:{},instalacoes:[{clienteId:e.clienteId,inicio:nowISO(),fim:null}],substituiId:e.id};
    e.substituidoPorId=n.id;
    DB.equipamentos.unshift(n);audit("Substituição","Equipamento",e.id,"Novo NS: "+ns);persist();closeModal();toast("Equipamento substituto criado.");location.hash="#/equipamentos/"+n.id;
  };
}

function relatorioManutencaoTexto(m){
  const eq=byId("equipamentos",m.equipamentoId);
  const L=[];
  L.push("RELATÓRIO DE MANUTENÇÃO");
  L.push("");
  L.push("Cliente: "+cliNome(m.clienteId));
  L.push("Equipamento: NS "+(eq?.ns||"—")+(eq?.modelo?" — "+eq.modelo:""));
  if(m.numeroBlingRef)L.push("OS: "+m.numeroBlingRef);
  L.push("Data: "+fmtDate(m.criadaEm));
  L.push("Técnico: "+tecNome(m.tecnicoId));
  L.push("Tipo de atendimento: "+(TIPOS_ATEND[m.tipoAtendimento]||"—"));
  L.push("");
  L.push("Problema relatado: "+(m.problema||"—"));
  L.push("Diagnóstico: "+(m.diagnostico||"—"));
  L.push("Serviço realizado: "+(m.servico||"—"));
  const testes=Object.entries(m.testes||{}).filter(([,x])=>x).map(([k,x])=>"  - "+((DB.camposTecnicos.find(c=>c.id===k)||{}).nome||k)+": "+x)
    .concat((m.testesExtra||[]).filter(t=>t.valor).map(t=>"  - "+t.nome+": "+t.valor));
  if(testes.length){L.push("","Testes:");L.push(...testes);}
  const med=Object.entries(m.medicoes||{}).filter(([,x])=>x).map(([k,x])=>"  - "+k+": "+x);
  if(med.length){L.push("","Medições:");L.push(...med);}
  const pc=(m.pecas||[]).map(p=>"  - "+((byId("produtos",p.produtoId)||{}).descricao||"Peça")+" (x"+p.qtd+")");
  if(pc.length){L.push("","Peças/materiais utilizados:");L.push(...pc);}
  if(m.obs)L.push("","Observações: "+m.obs);
  L.push("");
  L.push("Finalização: "+(m.finalizacao||"—"));
  if(m.proximaAcao&&m.proximaAcao!=="nenhuma")L.push("Próxima ação: "+(PROX_ACOES[m.proximaAcao]||m.proximaAcao)+(m.proximaData?" — "+fmtDate(m.proximaData):""));
  L.push("","—","Relatório gerado pelo GeraCampo.");
  return L.join("\n");
}

        <h3 style="margin-bottom:10px">Fotos</h3>
        <div class="photos" id="fotos"></div>
        ${!readonly?`<div class="row" style="margin-top:10px">
          <label class="btn sm">+ Antes<input type="file" accept="image/*" hidden data-g="antes" multiple></label>
          <label class="btn sm">+ Durante<input type="file" accept="image/*" hidden data-g="durante" multiple></label>

      </div>
      <div class="card pad">
